    const BLOG_CONFIG = {

        { name: "病房组", url: "https://cdn.luogu.com.cn/upload/image_hosting/a4j7q31r.png", weight: 1 }
      ],

      live2d: {
        enabled: true,
        engine: "oml2d",
        scriptUrl: "https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js",
        oml2dScriptUrl: "https://cdn.jsdelivr.net/npm/oh-my-live2d@latest/dist/index.min.js",
        modelJsonUrl: "../../102800/model.model3.json",

    (function initAmericanBlocksGame() {
      const BOARD_RADIUS = 4;
      const HEX_SIZE = 26;
      const SQRT3 = Math.sqrt(3);

      const BASE_SHAPES = [
        {
          id: "single",
          color: "#0ea5e9",
          border: "#0284c7",
          cells: [[0, 0]]
        },
        {
          id: "parallelogram_2x2",
          color: "#10b981",
          border: "#059669",
          cells: [[0, 0], [1, 0], [0, 1], [1, 1]]
        },
        {
          id: "row3_top_right",
          color: "#f59e0b",
          border: "#d97706",
          cells: [[0, 0], [1, 0], [2, 0], [1, -1]]
        },
        {
          id: "row3_bottom_right",
          color: "#f43f5e",
          border: "#e11d48",
          cells: [[0, 0], [1, 0], [2, 0], [0, 1]]
        },
        {
          id: "line_4",
          color: "#3b82f6",
          border: "#2563eb",
          cells: [[0, 0], [1, 0], [2, 0], [3, 0]]
        },
        {
          id: "arch_cup",
          color: "#8b5cf6",
          border: "#7c3aed",
          cells: [[0, 0], [2, 0], [0, 1], [1, 1]]
        }
      ];

      let audioCtx = null;
      let soundMuted = false;

      function ensureAudioCtx() {
        if (soundMuted) return null;
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function playTone(freq, type, duration, delay, gainVal) {
        const ctx = ensureAudioCtx();
        if (!ctx) return;
        const start = ctx.currentTime + (delay || 0);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(gainVal || 0.08, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + duration);
      }

      function playSfxPlace() {
        playTone(420, "triangle", 0.09, 0, 0.09);
        playTone(560, "sine", 0.11, 0.04, 0.07);
      }

      function playSfxClear(lineCount) {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        const count = Math.min(notes.length, lineCount + 2);
        for (let i = 0; i < count; i++) {
          playTone(notes[i], "triangle", 0.22, i * 0.06, 0.12);
        }
      }

      function playSfxGameOver() {
        playTone(340, "sawtooth", 0.18, 0, 0.07);
        playTone(260, "sawtooth", 0.28, 0.15, 0.07);
      }

      function rotateCell60(q, r) {
        return [-r, q + r];
      }

      /* 关键修复：从拼图自身的实际格子中选取离几何中心最近的那个格子作为锚点 (0, 0)。
         避免此前因 Math.round(-1.5) === -1 且 Math.round(1.5) === 2 导致左下到右上斜线 (q + r = 0)
         被平移到 q + r = -1（锚点脱离拼图本身，进而无法放置在棋盘右下边界 q + r = 4）的 Bug！ */
      function normalizeCells(cells) {
        let sumX = 0;
        let sumY = 0;
        for (let i = 0; i < cells.length; i++) {
          const px = SQRT3 * (cells[i][0] + cells[i][1] / 2);
          const py = 1.5 * cells[i][1];
          sumX += px;
          sumY += py;
        }
        const avgX = sumX / cells.length;
        const avgY = sumY / cells.length;

        let bestIdx = 0;
        let bestDist = Infinity;
        for (let i = 0; i < cells.length; i++) {
          const px = SQRT3 * (cells[i][0] + cells[i][1] / 2);
          const py = 1.5 * cells[i][1];
          const d = (px - avgX) * (px - avgX) + (py - avgY) * (py - avgY);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
          }
        }

        const anchorQ = cells[bestIdx][0];
        const anchorR = cells[bestIdx][1];
        return cells.map(function (c) {
          return [c[0] - anchorQ, c[1] - anchorR];
        });
      }

      function generateRandomPiece() {
        const shapeIdx = Math.floor(Math.random() * BASE_SHAPES.length);
        const base = BASE_SHAPES[shapeIdx];
        const rotSteps = Math.floor(Math.random() * 6);

        let rotated = base.cells.map(function (c) {
          return [c[0], c[1]];
        });

        for (let step = 0; step < rotSteps; step++) {
          rotated = rotated.map(function (c) {
            return rotateCell60(c[0], c[1]);
          });
        }

        return {
          id: base.id,
          color: base.color,
          border: base.border,
          rotSteps: rotSteps,
          cells: normalizeCells(rotated)
        };
      }

      const boardCellsMap = new Map();
      const allBoardCoords = [];

      for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
        for (let r = -BOARD_RADIUS; r <= BOARD_RADIUS; r++) {
          const s = -q - r;
          if (Math.max(Math.abs(q), Math.abs(r), Math.abs(s)) <= BOARD_RADIUS) {
            const key = q + "," + r;
            allBoardCoords.push({ q: q, r: r, s: s, key: key });
            boardCellsMap.set(key, null);
          }
        }
      }

      const allBoardLines = [];
      for (let c = -BOARD_RADIUS; c <= BOARD_RADIUS; c++) {
        allBoardLines.push(
          allBoardCoords.filter(function (cell) { return cell.r === c; }).map(function (cell) { return cell.key; })
        );
        allBoardLines.push(
          allBoardCoords.filter(function (cell) { return cell.q === c; }).map(function (cell) { return cell.key; })
        );
        allBoardLines.push(
          allBoardCoords.filter(function (cell) { return cell.s === c; }).map(function (cell) { return cell.key; })
        );
      }

      const boardCanvas = document.getElementById("boardCanvas");
      const boardCtx = boardCanvas.getContext("2d");
      const slotCanvases = [
        document.getElementById("slotCanvas0"),
        document.getElementById("slotCanvas1"),
        document.getElementById("slotCanvas2")
      ];
      const slotCards = [
        document.getElementById("pieceSlot0"),
        document.getElementById("pieceSlot1"),
        document.getElementById("pieceSlot2")
      ];
      const dragFloatCanvas = document.getElementById("dragFloatCanvas");
      const dragFloatCtx = dragFloatCanvas.getContext("2d");

      const scoreEl = document.getElementById("scoreValue");
      const bestScoreEl = document.getElementById("bestScoreValue");
      const linesClearedEl = document.getElementById("linesClearedValue");
      const maxComboEl = document.getElementById("maxComboValue");
      const undoMoveBtn = document.getElementById("undoMoveBtn");
      const restartGameBtn = document.getElementById("restartGameBtn");
      const overlayRestartBtn = document.getElementById("overlayRestartBtn");
      const toggleSoundBtn = document.getElementById("toggleSoundBtn");
      const gameOverOverlay = document.getElementById("gameOverOverlay");
      const gameOverSummary = document.getElementById("gameOverSummary");
      const randomBgBtn = document.getElementById("randomBgBtn");
      const currentBgLabel = document.getElementById("currentBgLabel");
      const toastNotice = document.getElementById("toastNotice");

      let score = 0;
      let bestScore = 0;
      let totalLinesCleared = 0;
      let maxCombo = 0;
      let handPieces = [null, null, null];
      let selectedSlotIndex = 0;
      let hoverAxial = null;
      let isDragging = false;
      let dragSlotIndex = -1;
      let undoSnapshot = null;
      let clearingEffects = [];
      let animFrameId = null;
      let toastTimer = null;

      try {
        const savedBest = localStorage.getItem("tm_sharweek_hex_blocks_best");
        if (savedBest) bestScore = parseInt(savedBest, 10) || 0;
      } catch (e) {}
      bestScoreEl.textContent = String(bestScore);

      function showToast(msg) {
        if (!toastNotice) return;
        toastNotice.textContent = msg;
        toastNotice.classList.add("is-visible");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastNotice.classList.remove("is-visible");
        }, 2400);
      }

      function axialToPixel(q, r, originX, originY, size) {
        const x = originX + size * SQRT3 * (q + r / 2);
        const y = originY + size * 1.5 * r;
        return { x: x, y: y };
      }

      function pixelToAxial(px, py, originX, originY, size) {
        const dx = px - originX;
        const dy = py - originY;
        const qFrac = (SQRT3 / 3 * dx - 1 / 3 * dy) / size;
        const rFrac = (2 / 3 * dy) / size;
        return axialRound(qFrac, rFrac);
      }

      function axialRound(qf, rf) {
        const sf = -qf - rf;
        let q = Math.round(qf);
        let r = Math.round(rf);
        let s = Math.round(sf);
        const qDiff = Math.abs(q - qf);
        const rDiff = Math.abs(r - rf);
        const sDiff = Math.abs(s - sf);
        if (qDiff > rDiff && qDiff > sDiff) {
          q = -r - s;
        } else if (rDiff > sDiff) {
          r = -q - s;
        }
        return { q: q, r: r };
      }

      function drawHexagon(ctx, cx, cy, radius, fillColor, strokeColor, lineWidth, innerHighlight) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angleRad = (Math.PI / 180) * (60 * i - 30);
          const vx = cx + radius * Math.cos(angleRad);
          const vy = cy + radius * Math.sin(angleRad);
          if (i === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.closePath();

        if (fillColor) {
          ctx.fillStyle = fillColor;
          ctx.fill();
        }
        if (strokeColor) {
          ctx.lineWidth = lineWidth || 1.5;
          ctx.strokeStyle = strokeColor;
          ctx.stroke();
        }
        if (innerHighlight) {
          ctx.beginPath();
          const innerR = radius * 0.72;
          for (let i = 0; i < 6; i++) {
            const angleRad = (Math.PI / 180) * (60 * i - 30);
            const vx = cx + innerR * Math.cos(angleRad);
            const vy = cy + innerR * Math.sin(angleRad);
            if (i === 0) ctx.moveTo(vx, vy);
            else ctx.lineTo(vx, vy);
          }
          ctx.closePath();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      function canPlacePieceAt(piece, anchorQ, anchorR) {
        if (!piece) return false;
        for (let i = 0; i < piece.cells.length; i++) {
          const tq = anchorQ + piece.cells[i][0];
          const tr = anchorR + piece.cells[i][1];
          const key = tq + "," + tr;
          if (!boardCellsMap.has(key)) return false;
          if (boardCellsMap.get(key) !== null) return false;
        }
        return true;
      }

      function canPieceFitAnywhere(piece) {
        if (!piece) return false;
        for (let i = 0; i < allBoardCoords.length; i++) {
          const cell = allBoardCoords[i];
          if (canPlacePieceAt(piece, cell.q, cell.r)) {
            return true;
          }
        }
        return false;
      }

      function checkGameOver() {
        for (let i = 0; i < 3; i++) {
          const playable = canPieceFitAnywhere(handPieces[i]);
          slotCards[i].classList.toggle("is-unplayable", !playable);
        }
        const anyPlayable = handPieces.some(function (p) {
          return canPieceFitAnywhere(p);
        });
        if (!anyPlayable) {
          playSfxGameOver();
          gameOverSummary.textContent = "得分 " + score + " · 消除 " + totalLinesCleared + " 行";
          gameOverOverlay.classList.add("is-visible");
        } else {
          gameOverOverlay.classList.remove("is-visible");
        }
      }

      function saveUndoState() {
        const boardCopy = [];
        boardCellsMap.forEach(function (val, key) {
          boardCopy.push([key, val ? { color: val.color, border: val.border } : null]);
        });
        undoSnapshot = {
          boardCopy: boardCopy,
          handPieces: handPieces.map(function (p) {
            return JSON.parse(JSON.stringify(p));
          }),
          score: score,
          totalLinesCleared: totalLinesCleared,
          maxCombo: maxCombo,
          selectedSlotIndex: selectedSlotIndex
        };
        undoMoveBtn.disabled = false;
      }

      function performUndo() {
        if (!undoSnapshot) return;
        undoSnapshot.boardCopy.forEach(function (entry) {
          boardCellsMap.set(entry[0], entry[1]);
        });
        handPieces = undoSnapshot.handPieces;
        score = undoSnapshot.score;
        totalLinesCleared = undoSnapshot.totalLinesCleared;
        maxCombo = undoSnapshot.maxCombo;
        selectedSlotIndex = undoSnapshot.selectedSlotIndex;
        undoSnapshot = null;
        undoMoveBtn.disabled = true;
        gameOverOverlay.classList.remove("is-visible");
        playTone(360, "sine", 0.1, 0, 0.07);
        updateHudUI();
        renderAllSlots();
        checkGameOver();
        renderBoard();
      }

      function placePieceFromSlot(slotIdx, anchorQ, anchorR) {
        const piece = handPieces[slotIdx];
        if (!piece || !canPlacePieceAt(piece, anchorQ, anchorR)) return false;

        saveUndoState();

        for (let i = 0; i < piece.cells.length; i++) {
          const tq = anchorQ + piece.cells[i][0];
          const tr = anchorR + piece.cells[i][1];
          boardCellsMap.set(tq + "," + tr, {
            color: piece.color,
            border: piece.border
          });
        }
        let turnScore = piece.cells.length * 10;

        const completedLines = [];
        for (let i = 0; i < allBoardLines.length; i++) {
          const lineKeys = allBoardLines[i];
          const isFull = lineKeys.every(function (k) {
            return boardCellsMap.get(k) !== null;
          });
          if (isFull) {
            completedLines.push(lineKeys);
          }
        }

        if (completedLines.length > 0) {
          const uniqueKeysToClear = new Set();
          completedLines.forEach(function (lineKeys) {
            lineKeys.forEach(function (k) {
              uniqueKeysToClear.add(k);
            });
          });

          uniqueKeysToClear.forEach(function (k) {
            const oldCell = boardCellsMap.get(k);
            const parts = k.split(",");
            clearingEffects.push({
              q: parseInt(parts[0], 10),
              r: parseInt(parts[1], 10),
              color: oldCell ? oldCell.color : "#3b82f6",
              alpha: 1.0,
              scale: 1.0
            });
            boardCellsMap.set(k, null);
          });

          const lineCount = completedLines.length;
          const clearBonus = uniqueKeysToClear.size * 20 * lineCount;
          turnScore += clearBonus;
          totalLinesCleared += lineCount;
          if (lineCount > maxCombo) {
            maxCombo = lineCount;
          }

          playSfxClear(lineCount);
        } else {
          playSfxPlace();
        }

        score += turnScore;
        if (score > bestScore) {
          bestScore = score;
          try {
            localStorage.setItem("tm_sharweek_hex_blocks_best", String(bestScore));
          } catch (e) {}
        }

        handPieces[slotIdx] = generateRandomPiece();

        updateHudUI();
        renderAllSlots();
        checkGameOver();
        renderBoard();
        if (clearingEffects.length > 0) {
          if (animFrameId) cancelAnimationFrame(animFrameId);
          animFrameId = requestAnimationFrame(animateClearEffects);
        }
        return true;
      }

      function animateClearEffects() {
        if (clearingEffects.length === 0) {
          animFrameId = null;
          return;
        }
        for (let i = clearingEffects.length - 1; i >= 0; i--) {
          clearingEffects[i].alpha -= 0.08;
          clearingEffects[i].scale += 0.04;
          if (clearingEffects[i].alpha <= 0) {
            clearingEffects.splice(i, 1);
          }
        }
        renderBoard();
        if (clearingEffects.length > 0) {
          animFrameId = requestAnimationFrame(animateClearEffects);
        } else {
          animFrameId = null;
        }
      }

      function updateHudUI() {
        scoreEl.textContent = String(score);
        bestScoreEl.textContent = String(bestScore);
        linesClearedEl.textContent = String(totalLinesCleared);
        maxComboEl.textContent = String(maxCombo);
      }

      function renderBoard() {
        const w = boardCanvas.width;
        const h = boardCanvas.height;
        const originX = w / 2;
        const originY = h / 2;

        boardCtx.clearRect(0, 0, w, h);

        boardCtx.save();
        drawHexagon(
          boardCtx,
          originX,
          originY,
          HEX_SIZE * 9.3,
          "rgba(255, 255, 255, 0.42)",
          "rgba(255, 255, 255, 0.85)",
          2,
          false
        );
        boardCtx.restore();

        for (let i = 0; i < allBoardCoords.length; i++) {
          const coord = allBoardCoords[i];
          const pos = axialToPixel(coord.q, coord.r, originX, originY, HEX_SIZE);
          const cellData = boardCellsMap.get(coord.key);

          if (cellData) {
            drawHexagon(
              boardCtx,
              pos.x,
              pos.y,
              HEX_SIZE - 2,
              cellData.color,
              "#ffffff",
              1.8,
              true
            );
          } else {
            drawHexagon(
              boardCtx,
              pos.x,
              pos.y,
              HEX_SIZE - 2,
              "rgba(241, 245, 249, 0.72)",
              "rgba(148, 163, 184, 0.42)",
              1.4,
              false
            );
          }
        }

        for (let i = 0; i < clearingEffects.length; i++) {
          const ef = clearingEffects[i];
          const pos = axialToPixel(ef.q, ef.r, originX, originY, HEX_SIZE);
          boardCtx.save();
          boardCtx.globalAlpha = Math.max(0, ef.alpha);
          drawHexagon(
            boardCtx,
            pos.x,
            pos.y,
            (HEX_SIZE - 2) * ef.scale,
            "#ffffff",
            ef.color,
            3,
            false
          );
          boardCtx.restore();
        }

        const activeIdx = isDragging ? dragSlotIndex : selectedSlotIndex;
        const activePiece = handPieces[activeIdx];
        if (hoverAxial && activePiece) {
          const valid = canPlacePieceAt(activePiece, hoverAxial.q, hoverAxial.r);
          for (let i = 0; i < activePiece.cells.length; i++) {
            const tq = hoverAxial.q + activePiece.cells[i][0];
            const tr = hoverAxial.r + activePiece.cells[i][1];
            if (!boardCellsMap.has(tq + "," + tr)) continue;
            const pos = axialToPixel(tq, tr, originX, originY, HEX_SIZE);
            boardCtx.save();
            boardCtx.globalAlpha = valid ? 0.68 : 0.35;
            drawHexagon(
              boardCtx,
              pos.x,
              pos.y,
              HEX_SIZE - 2,
              valid ? activePiece.color : "#ef4444",
              valid ? "#ffffff" : "#b91c1c",
              2,
              valid
            );
            boardCtx.restore();
          }
        }
      }

      /* alignToAnchor:
         - 在右侧候选槽内展示时 (alignToAnchor=false)：按包围盒几何居中显示；
         - 在鼠标拖拽浮层时 (alignToAnchor=true)：严格将拼图锚点格子 (0, 0) 对准鼠标中心 (cw/2, ch/2)，
           确保鼠标指针所在位置与棋盘落子判定锚点 100% 严丝合缝，绝不发生视觉错位！ */
      function drawPieceOnCanvas(ctx, cw, ch, piece, cellRadius, alignToAnchor) {
        ctx.clearRect(0, 0, cw, ch);
        if (!piece) return;

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        const pts = piece.cells.map(function (c) {
          const p = axialToPixel(c[0], c[1], 0, 0, cellRadius);
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
          return p;
        });

        const offsetX = alignToAnchor ? (cw / 2) : (cw / 2 - (minX + maxX) / 2);
        const offsetY = alignToAnchor ? (ch / 2) : (ch / 2 - (minY + maxY) / 2);

        for (let i = 0; i < pts.length; i++) {
          drawHexagon(
            ctx,
            pts[i].x + offsetX,
            pts[i].y + offsetY,
            cellRadius - 1.5,
            piece.color,
            "#ffffff",
            1.6,
            true
          );
        }
      }

      function renderAllSlots() {
        for (let i = 0; i < 3; i++) {
          const canvas = slotCanvases[i];
          const ctx = canvas.getContext("2d");
          const piece = handPieces[i];
          drawPieceOnCanvas(ctx, canvas.width, canvas.height, piece, 18, false);
          slotCards[i].classList.toggle("is-selected", i === selectedSlotIndex);
        }
      }

      function startNewGame() {
        boardCellsMap.forEach(function (_, key) {
          boardCellsMap.set(key, null);
        });
        score = 0;
        totalLinesCleared = 0;
        maxCombo = 0;
        selectedSlotIndex = 0;
        hoverAxial = null;
        undoSnapshot = null;
        undoMoveBtn.disabled = true;
        gameOverOverlay.classList.remove("is-visible");

        handPieces = [
          generateRandomPiece(),
          generateRandomPiece(),
          generateRandomPiece()
        ];

        updateHudUI();
        renderAllSlots();
        checkGameOver();
        renderBoard();
      }

      function getBoardAxialFromClientPoint(clientX, clientY) {
        const rect = boardCanvas.getBoundingClientRect();
        if (
          clientX < rect.left ||
          clientX > rect.right ||
          clientY < rect.top ||
          clientY > rect.bottom
        ) {
          return null;
        }
        const scaleX = boardCanvas.width / rect.width;
        const scaleY = boardCanvas.height / rect.height;
        const px = (clientX - rect.left) * scaleX;
        const py = (clientY - rect.top) * scaleY;
        const axial = pixelToAxial(px, py, boardCanvas.width / 2, boardCanvas.height / 2, HEX_SIZE);
        if (boardCellsMap.has(axial.q + "," + axial.r)) {
          return axial;
        }
        return null;
      }

      boardCanvas.addEventListener("pointermove", function (e) {
        if (isDragging) return;
        const axial = getBoardAxialFromClientPoint(e.clientX, e.clientY);
        if (
          (!hoverAxial && axial) ||
          (hoverAxial && !axial) ||
          (hoverAxial && axial && (hoverAxial.q !== axial.q || hoverAxial.r !== axial.r))
        ) {
          hoverAxial = axial;
          renderBoard();
        }
      });

      boardCanvas.addEventListener("pointerleave", function () {
        if (!isDragging && hoverAxial) {
          hoverAxial = null;
          renderBoard();
        }
      });

      boardCanvas.addEventListener("click", function (e) {
        if (isDragging) return;
        const axial = getBoardAxialFromClientPoint(e.clientX, e.clientY);
        if (axial) {
          placePieceFromSlot(selectedSlotIndex, axial.q, axial.r);
        }
      });

      slotCards.forEach(function (card, idx) {
        card.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          selectedSlotIndex = idx;
          renderAllSlots();

          isDragging = true;
          dragSlotIndex = idx;

          drawPieceOnCanvas(
            dragFloatCtx,
            dragFloatCanvas.width,
            dragFloatCanvas.height,
            handPieces[idx],
            HEX_SIZE,
            true
          );
          dragFloatCanvas.style.display = "block";
          dragFloatCanvas.style.left = (e.clientX - dragFloatCanvas.width / 2) + "px";
          dragFloatCanvas.style.top = (e.clientY - dragFloatCanvas.height / 2) + "px";

          hoverAxial = getBoardAxialFromClientPoint(e.clientX, e.clientY);
          renderBoard();
        });
      });

      window.addEventListener("pointermove", function (e) {
        if (!isDragging) return;
        dragFloatCanvas.style.left = (e.clientX - dragFloatCanvas.width / 2) + "px";
        dragFloatCanvas.style.top = (e.clientY - dragFloatCanvas.height / 2) + "px";
        const axial = getBoardAxialFromClientPoint(e.clientX, e.clientY);
        if (
          (!hoverAxial && axial) ||
          (hoverAxial && !axial) ||
          (hoverAxial && axial && (hoverAxial.q !== axial.q || hoverAxial.r !== axial.r))
        ) {
          hoverAxial = axial;
          renderBoard();
        }
      });

      window.addEventListener("pointerup", function (e) {
        if (!isDragging) return;
        const axial = getBoardAxialFromClientPoint(e.clientX, e.clientY);
        if (axial && dragSlotIndex >= 0) {
          placePieceFromSlot(dragSlotIndex, axial.q, axial.r);
        }
        isDragging = false;
        dragSlotIndex = -1;
        dragFloatCanvas.style.display = "none";
        hoverAxial = getBoardAxialFromClientPoint(e.clientX, e.clientY);
        renderBoard();
      });

      if (toggleSoundBtn) {
        toggleSoundBtn.addEventListener("click", function () {
          soundMuted = !soundMuted;
          toggleSoundBtn.textContent = soundMuted ? "🔇 静音" : "🔊 音效";
        });
      }

      window.addEventListener("keydown", function (e) {
        if (e.key === "1" || e.key === "2" || e.key === "3") {
          selectedSlotIndex = parseInt(e.key, 10) - 1;
          renderAllSlots();
          renderBoard();
        } else if (e.key === "z" || e.key === "Z") {
          performUndo();
        } else if (e.key === "r" || e.key === "R") {
          startNewGame();
        } else if (e.key === "m" || e.key === "M") {
          soundMuted = !soundMuted;
          if (toggleSoundBtn) toggleSoundBtn.textContent = soundMuted ? "🔇 静音" : "🔊 音效";
        }
      });

      undoMoveBtn.addEventListener("click", performUndo);
      restartGameBtn.addEventListener("click", startNewGame);
      overlayRestartBtn.addEventListener("click", startNewGame);

      window.addEventListener("resize", function () {
        renderBoard();
        renderAllSlots();
      });

      function pickWeightedBackground(manualClick) {
        const pool = (BLOG_CONFIG.backgrounds || []).filter(function (item) {
          return item && item.url && Number(item.weight) > 0;
        });
        if (pool.length === 0) return;

        const totalWeight = pool.reduce(function (sum, item) {
          return sum + Number(item.weight);
        }, 0);

        let rand = Math.random() * totalWeight;
        let chosenIndex = 0;
        for (let i = 0; i < pool.length; i++) {
          rand -= Number(pool[i].weight);
          if (rand <= 0) {
            chosenIndex = i;
            break;
          }
        }

        const chosen = pool[chosenIndex];
        document.documentElement.style.setProperty("--bg-image", 'url("' + chosen.url + '")');

        if (currentBgLabel) {
          currentBgLabel.textContent = chosen.name || ("图" + (chosenIndex + 1));
        }
        if (manualClick) {
          showToast("背景：" + chosen.name);
        }
      }

      if (randomBgBtn) {
        randomBgBtn.addEventListener("click", function () {
          pickWeightedBackground(true);
        });
      }
      pickWeightedBackground(false);

      function loadExternalScript(src) {
        return new Promise(function (resolve, reject) {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }

      function applyLive2DUpperBodyZoom(disp) {
        const boxW = (disp.width || 280) + "px";
        const boxH = (disp.boxHeight || 300) + "px";
        const zoom = Number(disp.upperZoom) > 0 ? Number(disp.upperZoom) : 1.9;
        const anchorY = disp.anchorY || "18%";
        const shiftY = typeof disp.shiftY === "number" ? (disp.shiftY + "px") : (disp.shiftY || "0px");

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty("--live2d-box-width", boxW);
        rootStyle.setProperty("--live2d-box-height", boxH);
        rootStyle.setProperty("--live2d-zoom", String(zoom));
        rootStyle.setProperty("--live2d-anchor-y", anchorY);
        rootStyle.setProperty("--live2d-shift-y", shiftY);

        function syncDomStyles() {
          const stages = document.querySelectorAll("#oml2d-stage, .oml2d-stage, #live2d-widget, .live2d-widget-container");
          stages.forEach(function (st) {
            st.style.setProperty("position", "fixed", "important");
            st.style.setProperty("right", (typeof disp.hOffset === "number" ? disp.hOffset : 12) + "px", "important");
            st.style.setProperty("bottom", (typeof disp.vOffset === "number" ? disp.vOffset : 0) + "px", "important");
            st.style.setProperty("left", "auto", "important");
            st.style.setProperty("width", boxW, "important");
            st.style.setProperty("height", boxH, "important");
            st.style.setProperty("overflow", "hidden", "important");
          });

          const canvases = document.querySelectorAll("#oml2d-canvas, #oml2d-stage canvas, #live2dcanvas, #live2d-widget canvas");
          canvases.forEach(function (cvs) {
            cvs.style.setProperty("transform-origin", "50% " + anchorY, "important");
            cvs.style.setProperty("transform", "translateY(" + shiftY + ") scale(" + zoom + ")", "important");
          });
        }

        syncDomStyles();
        let count = 0;
        const timer = setInterval(function () {
          syncDomStyles();
          count++;
          if (count > 30) clearInterval(timer);
        }, 200);
      }

      async function initLive2D() {
        const cfg = BLOG_CONFIG.live2d;
        if (!cfg || !cfg.enabled || !cfg.modelJsonUrl) return;
        const disp = cfg.display || {};
        const mob = cfg.mobile || {};
        const react = cfg.react || {};

        applyLive2DUpperBodyZoom(disp);

        try {
          if (cfg.engine === "oml2d") {
            await loadExternalScript(cfg.oml2dScriptUrl || "https://cdn.jsdelivr.net/npm/oh-my-live2d@latest/dist/index.min.js");
            if (window.OML2D && typeof window.OML2D.loadOml2d === "function") {
              const omlInstance = window.OML2D.loadOml2d({
                dockedPosition: "right",
                menus: { disable: true },
                tips: { disable: true },
                statusBar: { disable: true },
                models: [
                  {
                    path: cfg.modelJsonUrl,
                    stageStyle: {
                      width: disp.width || 280,
                      height: disp.height || 500
                    }
                  }
                ]
              });
              if (omlInstance && typeof omlInstance.onLoad === "function") {
                omlInstance.onLoad(function () {
                  applyLive2DUpperBodyZoom(disp);
                });
              }
            }
          } else {
            await loadExternalScript(cfg.scriptUrl || "https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js");
            if (window.L2Dwidget && typeof window.L2Dwidget.init === "function") {
              window.L2Dwidget.init({
                model: { jsonPath: cfg.modelJsonUrl, scale: disp.scale || 1 },
                display: {
                  position: disp.position || "right",
                  width: disp.width || 280,
                  height: disp.height || 500,
                  hOffset: typeof disp.hOffset === "number" ? disp.hOffset : 12,
                  vOffset: typeof disp.vOffset === "number" ? disp.vOffset : 0
                },
                mobile: { show: mob.show !== false, scale: mob.scale || 0.6 },
                react: {
                  opacityDefault: react.opacityDefault || 0.95,
                  opacityOnHover: react.opacityOnHover || 1
                }
              });
            }
          }
          applyLive2DUpperBodyZoom(disp);
        } catch (err) {}
      }

      window.addEventListener("load", function () {
        initLive2D();
        startNewGame();
      });
      startNewGame();
    })();
  </script>
</body>
</html>
