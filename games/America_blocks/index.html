  <script>
    const BLOG_CONFIG = {
      backgrounds: [
        { name: "阿绫", url: "https://cdn.luogu.com.cn/upload/image_hosting/t55ghywt.png", weight: 13 },
        { name: "二重变革", url: "https://cdn.luogu.com.cn/upload/image_hosting/5c26cnb1.png", weight: 3 },
        { name: "月巷", url: "https://cdn.luogu.com.cn/upload/image_hosting/hjqw3cv3.png", weight: 1 },
        { name: "九重现实", url: "https://cdn.luogu.com.cn/upload/image_hosting/9qdrt0hk.png", weight: 1 },
        { name: "傲娇绫", url: "https://cdn.luogu.com.cn/upload/image_hosting/cuna6iak.png", weight: 1 },
        { name: "五重空洞", url: "https://cdn.luogu.com.cn/upload/image_hosting/rpd6v91b.png", weight: 1 },
        { name: "世末绫", url: "https://cdn.luogu.com.cn/upload/image_hosting/nw1msrkd.png", weight: 1 },
        { name: "世末歌者", url: "https://cdn.luogu.com.cn/upload/image_hosting/kut13cln.png", weight: 1 },
        { name: "小焰", url: "https://cdn.luogu.com.cn/upload/image_hosting/s57te7ko.png", weight: 1 },
        { name: "待我归乡", url: "https://cdn.luogu.com.cn/upload/image_hosting/vgphr83p.png", weight: 1 },
        { name: "遗忘的物语", url: "https://cdn.luogu.com.cn/upload/image_hosting/ksdftve2.png", weight: 1 },
        { name: "病房组", url: "https://cdn.luogu.com.cn/upload/image_hosting/a4j7q31r.png", weight: 1 }
      ],

      live2d: {
        enabled: true,
        engine: "oml2d",
        scriptUrl: "https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js",
        oml2dScriptUrl: "https://cdn.jsdelivr.net/npm/oh-my-live2d@latest/dist/index.min.js",
        modelJsonUrl: "../../102800/model.model3.json",
        display: {
          position: "right",
          width: 280,
          height: 300,
          boxHeight: 300,
          upperZoom: 2.25,
          anchorY: "0%",
          shiftX: "10px",
          shiftY: "20px",
          hOffset: 12,
          vOffset: 0,
          scale: 1
        },
        mobile: { show: true, scale: 0.6 },
        react: { opacityDefault: 0.95, opacityOnHover: 1 }
      }
    };

    (function initAmericanBlocksGame() {
      const BOARD_RADIUS = 4;
      const HEX_SIZE = 22;
      const SQRT3 = Math.sqrt(3);

      const BASE_SHAPES = [
        {
          id: "single",
          color: "#0ea5e9",
          border: "#0284c7",
          cells: [[0, 0]]
        },
        {
          id: "parallelogram_2x2",
          color: "#10b981",
          border: "#059669",
          cells: [[0, 0], [1, 0], [0, 1], [1, 1]]
        },
        {
          id: "row3_top_right",
          color: "#8b5cf6",
          border: "#6d28d9",
          cells: [[0, 0], [1, 0], [2, 0], [1, -1]]
        },
        {
          id: "row3_bottom_right",
          color: "#f59e0b",
          border: "#d97706",
          cells: [[0, 0], [1, 0], [2, 0], [0, 1]]
        },
        {
          id: "line_4",
          color: "#ec4899",
          border: "#be185d",
          cells: [[0, 0], [1, 0], [2, 0], [3, 0]]
        },
        {
          id: "v_bridge_4",
          color: "#3b82f6",
          border: "#1d4ed8",
          cells: [[0, 0], [2, 0], [0, 1], [1, 1]]
        }
      ];

      function rotateAxial60(q, r) {
        return [-r, q + r];
      }

      function rotateCellsSteps(cells, steps) {
        const k = ((steps % 6) + 6) % 6;
        return cells.map(function (pair) {
          let q = pair[0];
          let r = pair[1];
          for (let i = 0; i < k; i++) {
            const next = rotateAxial60(q, r);
            q = next[0];
            r = next[1];
          }
          return [q, r];
        });
      }

      /* ------------------------------------------------------------------------
         关键修复：归一化拼图坐标 (normalizeCells)
         必须选取拼图自身最靠近像素几何中心的那个实际格子作为锚点 [0, 0]，
         避免左下到右上 (/) 四连直线因 Math.round(-1.5)=-1、Math.round(1.5)=2
         产生不在拼图直线上的偏移锚点 (-1, 2)，从而保证鼠标锚点永远落在拼图实体格子上，
         可紧贴棋盘右下角边缘 (q + r = 4) 精准放置。
         ------------------------------------------------------------------------ */
      function normalizeCells(cells) {
        let sumX = 0;
        let sumY = 0;
        for (let i = 0; i < cells.length; i++) {
          const q = cells[i][0];
          const r = cells[i][1];
          sumX += SQRT3 * (q + r * 0.5);
          sumY += 1.5 * r;
        }
        const avgX = sumX / cells.length;
        const avgY = sumY / cells.length;

        let anchorQ = cells[0][0];
        let anchorR = cells[0][1];
        let bestDist = Infinity;

        for (let i = 0; i < cells.length; i++) {
          const q = cells[i][0];
          const r = cells[i][1];
          const px = SQRT3 * (q + r * 0.5);
          const py = 1.5 * r;
          const dist = (px - avgX) * (px - avgX) + (py - avgY) * (py - avgY);
          if (dist < bestDist) {
            bestDist = dist;
            anchorQ = q;
            anchorR = r;
          }
        }

        const shifted = cells.map(function (c) {
          return [c[0] - anchorQ, c[1] - anchorR];
        });
        shifted.sort(function (a, b) {
          return (a[1] - b[1]) || (a[0] - b[0]);
        });
        return shifted;
      }

      function cellsSignature(cells) {
        let minQ = Infinity;
        let minR = Infinity;
        for (let i = 0; i < cells.length; i++) {
          if (cells[i][0] < minQ) minQ = cells[i][0];
          if (cells[i][1] < minR) minR = cells[i][1];
        }
        const canonical = cells.map(function (c) {
          return [c[0] - minQ, c[1] - minR];
        }).sort(function (a, b) {
          return (a[1] - b[1]) || (a[0] - b[0]);
        });
        return canonical.map(function (c) { return c[0] + ":" + c[1]; }).join("|");
      }

      const PIECE_POOL = [];
      BASE_SHAPES.forEach(function (base) {
        const seenSigs = new Set();
        const uniqueOrientations = [];

        for (let step = 0; step < 6; step++) {
          const rotated = normalizeCells(rotateCellsSteps(base.cells, step));
          const sig = cellsSignature(rotated);
          if (!seenSigs.has(sig)) {
            seenSigs.add(sig);
            uniqueOrientations.push({
              shapeId: base.id,
              color: base.color,
              border: base.border,
              rotationStep: step,
              cells: rotated
            });
          }
        }

        PIECE_POOL.push({
          base: base,
          orientations: uniqueOrientations
        });
      });

      function spawnRandomPiece() {
        const group = PIECE_POOL[Math.floor(Math.random() * PIECE_POOL.length)];
        const variant = group.orientations[Math.floor(Math.random() * group.orientations.length)];
        return {
          shapeId: variant.shapeId,
          color: variant.color,
          border: variant.border,
          rotationStep: variant.rotationStep,
          cells: variant.cells.map(function (c) { return [c[0], c[1]]; })
        };
      }

      // 构建 5 格正六边形棋盘 (共 61 格) 及三方向 27 条消除线
      const boardCellsMap = new Map();
      const allBoardCoords = [];

      function cellKey(q, r) {
        return q + "," + r;
      }

      function isInsideBoard(q, r) {
        return (
          Math.abs(q) <= BOARD_RADIUS &&
          Math.abs(r) <= BOARD_RADIUS &&
          Math.abs(q + r) <= BOARD_RADIUS
        );
      }

      for (let r = -BOARD_RADIUS; r <= BOARD_RADIUS; r++) {
        for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
          if (isInsideBoard(q, r)) {
            const key = cellKey(q, r);
            allBoardCoords.push({ q: q, r: r, key: key });
            boardCellsMap.set(key, null);
          }
        }
      }

      const ALL_LINES = [];
      for (let r = -BOARD_RADIUS; r <= BOARD_RADIUS; r++) {
        const lineKeys = [];
        for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
          if (isInsideBoard(q, r)) lineKeys.push(cellKey(q, r));
        }
        ALL_LINES.push({ axis: "r", index: r, keys: lineKeys });
      }
      for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
        const lineKeys = [];
        for (let r = -BOARD_RADIUS; r <= BOARD_RADIUS; r++) {
          if (isInsideBoard(q, r)) lineKeys.push(cellKey(q, r));
        }
        ALL_LINES.push({ axis: "q", index: q, keys: lineKeys });
      }
      for (let s = -BOARD_RADIUS; s <= BOARD_RADIUS; s++) {
        const lineKeys = [];
        for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
          const r = -q - s;
          if (isInsideBoard(q, r)) lineKeys.push(cellKey(q, r));
        }
        ALL_LINES.push({ axis: "s", index: s, keys: lineKeys });
      }

      const boardCanvas = document.getElementById("boardCanvas");
      const boardCtx = boardCanvas.getContext("2d");
      const BOARD_CENTER_X = boardCanvas.width / 2;
      const BOARD_CENTER_Y = boardCanvas.height / 2;

      function axialToPixel(q, r, centerX, centerY, hexSize) {
        const x = centerX + hexSize * SQRT3 * (q + r / 2);
        const y = centerY + hexSize * 1.5 * r;
        return { x: x, y: y };
      }

      function pixelToAxial(px, py, centerX, centerY, hexSize) {
        const x = px - centerX;
        const y = py - centerY;
        const qFloat = ((SQRT3 / 3) * x - (1 / 3) * y) / hexSize;
        const rFloat = ((2 / 3) * y) / hexSize;
        return axialRound(qFloat, rFloat);
      }

      function axialRound(qf, rf) {
        const sf = -qf - rf;
        let q = Math.round(qf);
        let r = Math.round(rf);
        let s = Math.round(sf);

        const qDiff = Math.abs(q - qf);
        const rDiff = Math.abs(r - rf);
        const sDiff = Math.abs(s - sf);

        if (qDiff > rDiff && qDiff > sDiff) {
          q = -r - s;
        } else if (rDiff > sDiff) {
          r = -q - s;
        }
        return { q: q, r: r };
      }

      function traceHexPath(ctx, cx, cy, radius) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 180) * (60 * i - 30);
          const vx = cx + radius * Math.cos(angle);
          const vy = cy + radius * Math.sin(angle);
          if (i === 0) {
            ctx.moveTo(vx, vy);
          } else {
            ctx.lineTo(vx, vy);
          }
        }
        ctx.closePath();
      }

      function drawHexCell(ctx, cx, cy, radius, fillStyle, strokeStyle, alpha, isGhost) {
        ctx.save();
        if (typeof alpha === "number") ctx.globalAlpha = alpha;

        traceHexPath(ctx, cx, cy, radius);

        const grad = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
        grad.addColorStop(0, fillStyle);
        grad.addColorStop(1, strokeStyle || fillStyle);
        ctx.fillStyle = isGhost ? fillStyle : grad;
        ctx.fill();

        if (!isGhost) {
          traceHexPath(ctx, cx, cy, radius * 0.78);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        traceHexPath(ctx, cx, cy, radius);
        ctx.strokeStyle = strokeStyle || "rgba(255, 255, 255, 0.85)";
        ctx.lineWidth = isGhost ? 2 : 1.6;
        ctx.stroke();

        ctx.restore();
      }

      // Web Audio 合成音效
      let soundEnabled = true;
      let audioCtx = null;

      function playTone(freq, duration, type, gainVal, delaySec) {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          const start = audioCtx.currentTime + (delaySec || 0);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(gainVal || 0.11, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + duration);
        } catch (e) {}
      }

      function sfxPlace() {
        playTone(340, 0.08, "triangle", 0.12, 0);
        playTone(480, 0.1, "sine", 0.1, 0.04);
      }

      function sfxClear(lineCount) {
        const baseNotes = [523.25, 659.25, 783.99, 1046.5];
        const steps = Math.min(4, lineCount + 1);
        for (let i = 0; i < steps; i++) {
          playTone(baseNotes[i], 0.18, "triangle", 0.14, i * 0.055);
        }
      }

      function sfxGameOver() {
        playTone(300, 0.16, "sawtooth", 0.09, 0);
        playTone(230, 0.24, "sawtooth", 0.09, 0.14);
      }

      // 游戏状态
      const STORAGE_KEY_BEST = "tm_sharweek_american_blocks_best_v1";
      let score = 0;
      let bestScore = Number(localStorage.getItem(STORAGE_KEY_BEST) || 0);
      let totalLinesCleared = 0;
      let maxComboLines = 0;

      let pieces = [null, null, null];
      let selectedSlotIndex = 0;
      let hoverAnchor = null;
      let isDragging = false;
      let dragSlotIndex = -1;
      let undoSnapshot = null;
      let isGameOver = false;

      let clearingAnimations = [];
      let floatingPopups = [];

      const scoreValueEl = document.getElementById("scoreValue");
      const bestScoreValueEl = document.getElementById("bestScoreValue");
      const linesClearedValueEl = document.getElementById("linesClearedValue");
      const maxComboValueEl = document.getElementById("maxComboValue");
      const undoMoveBtn = document.getElementById("undoMoveBtn");
      const restartGameBtn = document.getElementById("restartGameBtn");
      const overlayRestartBtn = document.getElementById("overlayRestartBtn");
      const toggleSoundBtn = document.getElementById("toggleSoundBtn");
      const gameOverOverlay = document.getElementById("gameOverOverlay");
      const gameOverSummary = document.getElementById("gameOverSummary");
      const dragFloatCanvas = document.getElementById("dragFloatCanvas");
      const dragFloatCtx = dragFloatCanvas.getContext("2d");
      const toastNotice = document.getElementById("toastNotice");

      const slotCards = [
        document.getElementById("pieceSlot0"),
        document.getElementById("pieceSlot1"),
        document.getElementById("pieceSlot2")
      ];
      const slotCanvases = [
        document.getElementById("slotCanvas0"),
        document.getElementById("slotCanvas1"),
        document.getElementById("slotCanvas2")
      ];

      let toastTimer = null;
      function showToast(msg) {
        if (!toastNotice) return;
        toastNotice.textContent = msg;
        toastNotice.classList.add("is-visible");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastNotice.classList.remove("is-visible");
        }, 2400);
      }

      function canPlacePieceAt(piece, anchorQ, anchorR) {
        if (!piece) return false;
        for (let i = 0; i < piece.cells.length; i++) {
          const tq = anchorQ + piece.cells[i][0];
          const tr = anchorR + piece.cells[i][1];
          if (!isInsideBoard(tq, tr)) return false;
          if (boardCellsMap.get(cellKey(tq, tr)) !== null) return false;
        }
        return true;
      }

      function canPieceFitAnywhere(piece) {
        if (!piece) return false;
        for (let i = 0; i < allBoardCoords.length; i++) {
          const coord = allBoardCoords[i];
          if (canPlacePieceAt(piece, coord.q, coord.r)) {
            return true;
          }
        }
        return false;
      }

      function checkAnyPiecePlaceable() {
        for (let i = 0; i < 3; i++) {
          if (pieces[i] && canPieceFitAnywhere(pieces[i])) {
            return true;
          }
        }
        return false;
      }

      function saveUndoState() {
        const boardCopy = new Map();
        boardCellsMap.forEach(function (val, key) {
          boardCopy.set(key, val ? { color: val.color, border: val.border } : null);
        });
        const piecesCopy = pieces.map(function (p) {
          return {
            shapeId: p.shapeId,
            color: p.color,
            border: p.border,
            rotationStep: p.rotationStep,
            cells: p.cells.map(function (c) { return [c[0], c[1]]; })
          };
        });
        undoSnapshot = {
          board: boardCopy,
          pieces: piecesCopy,
          score: score,
          totalLinesCleared: totalLinesCleared,
          maxComboLines: maxComboLines
        };
        undoMoveBtn.disabled = false;
      }

      function performUndo() {
        if (!undoSnapshot) return;
        undoSnapshot.board.forEach(function (val, key) {
          boardCellsMap.set(key, val);
        });
        pieces = undoSnapshot.pieces;
        score = undoSnapshot.score;
        totalLinesCleared = undoSnapshot.totalLinesCleared;
        maxComboLines = undoSnapshot.maxComboLines;
        undoSnapshot = null;
        undoMoveBtn.disabled = true;
        isGameOver = false;
        gameOverOverlay.classList.remove("is-visible");
        updateHud();
        renderAllSlots();
        showToast("已撤回上一步落子");
      }

      function placePieceOnBoard(slotIdx, anchorQ, anchorR) {
        const piece = pieces[slotIdx];
        if (!piece || !canPlacePieceAt(piece, anchorQ, anchorR)) return false;

        saveUndoState();

        for (let i = 0; i < piece.cells.length; i++) {
          const tq = anchorQ + piece.cells[i][0];
          const tr = anchorR + piece.cells[i][1];
          boardCellsMap.set(cellKey(tq, tr), {
            color: piece.color,
            border: piece.border
          });
        }

        const placePoints = piece.cells.length * 10;
        let turnTotalPoints = placePoints;

        const fullLines = [];
        for (let i = 0; i < ALL_LINES.length; i++) {
          const line = ALL_LINES[i];
          let isFull = true;
          for (let j = 0; j < line.keys.length; j++) {
            if (boardCellsMap.get(line.keys[j]) === null) {
              isFull = false;
              break;
            }
          }
          if (isFull) {
            fullLines.push(line);
          }
        }

        if (fullLines.length > 0) {
          const uniqueClearedKeys = new Set();
          fullLines.forEach(function (line) {
            line.keys.forEach(function (k) {
              uniqueClearedKeys.add(k);
            });
          });

          const now = performance.now();
          uniqueClearedKeys.forEach(function (k) {
            const oldData = boardCellsMap.get(k);
            const parts = k.split(",");
            clearingAnimations.push({
              q: Number(parts[0]),
              r: Number(parts[1]),
              color: oldData ? oldData.color : piece.color,
              border: oldData ? oldData.border : piece.border,
              startTime: now
            });
            boardCellsMap.set(k, null);
          });

          const kLines = fullLines.length;
          const clearBonus = uniqueClearedKeys.size * 20 * kLines + (kLines > 1 ? kLines * kLines * 50 : 0);
          turnTotalPoints += clearBonus;

          totalLinesCleared += kLines;
          if (kLines > maxComboLines) {
            maxComboLines = kLines;
          }

          const anchorPos = axialToPixel(anchorQ, anchorR, BOARD_CENTER_X, BOARD_CENTER_Y, HEX_SIZE);
          floatingPopups.push({
            x: anchorPos.x,
            y: anchorPos.y - 10,
            text: (kLines > 1 ? (kLines + "行同消! ") : "消行! ") + "+" + turnTotalPoints,
            color: kLines > 1 ? "#dc2626" : "#2563eb",
            startTime: now
          });

          sfxClear(kLines);
        } else {
          sfxPlace();
        }

        score += turnTotalPoints;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem(STORAGE_KEY_BEST, String(bestScore));
        }

        // 消耗后立刻自动补齐新拼图，保持玩家始终持有 3 个拼图
        pieces[slotIdx] = spawnRandomPiece();

        updateHud();
        renderAllSlots();

        if (!checkAnyPiecePlaceable()) {
          isGameOver = true;
          sfxGameOver();
          gameOverSummary.textContent = "本局得分 " + score + " 分 · 累计消去 " + totalLinesCleared + " 行";
          gameOverOverlay.classList.add("is-visible");
        }

        return true;
      }

      /* ------------------------------------------------------------------------
         绘制单个拼图到 Canvas：
         - 当 alignToAnchor === false（右侧候选槽展示）时，按拼图几何包围盒居中绘制；
         - 当 alignToAnchor === true（鼠标拖拽浮层 #dragFloatCanvas）时，严格将锚点格子 [0, 0]
           固定在画布正中心 (cw/2, ch/2)，使鼠标指针位置与棋盘虚影落子锚点 100% 重合。
         ------------------------------------------------------------------------ */
      function drawPieceOnCanvas(ctx, piece, hexRadius, alignToAnchor) {
        const cw = ctx.canvas.width;
        const ch = ctx.canvas.height;
        ctx.clearRect(0, 0, cw, ch);
        if (!piece) return;

        let offsetX = cw / 2;
        let offsetY = ch / 2;

        if (!alignToAnchor) {
          const pts = piece.cells.map(function (c) {
            return axialToPixel(c[0], c[1], 0, 0, hexRadius);
          });
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          pts.forEach(function (p) {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
          });
          offsetX = cw / 2 - (minX + maxX) / 2;
          offsetY = ch / 2 - (minY + maxY) / 2;
        }

        piece.cells.forEach(function (c) {
          const p = axialToPixel(c[0], c[1], offsetX, offsetY, hexRadius);
          drawHexCell(
            ctx,
            p.x,
            p.y,
            hexRadius - 1.5,
            piece.color,
            piece.border,
            1,
            false
          );
        });
      }

      function renderAllSlots() {
        for (let i = 0; i < 3; i++) {
          const piece = pieces[i];
          const card = slotCards[i];
          const canvas = slotCanvases[i];
          const ctx = canvas.getContext("2d");

          drawPieceOnCanvas(ctx, piece, 15, false);

          const fit = canPieceFitAnywhere(piece);
          card.classList.toggle("is-unplaceable", !fit);
          card.classList.toggle("is-selected", i === selectedSlotIndex);
          card.classList.toggle("is-dragging-source", isDragging && dragSlotIndex === i);
        }
      }

      function updateHud() {
        scoreValueEl.textContent = String(score);
        bestScoreValueEl.textContent = String(bestScore);
        linesClearedValueEl.textContent = String(totalLinesCleared);
        maxComboValueEl.textContent = String(maxComboLines);
      }

      function renderBoardFrame(now) {
        boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

        // 1. 绘制外围正六边形毛玻璃底盘边框
        boardCtx.save();
        boardCtx.beginPath();
        const outerR = HEX_SIZE * (BOARD_RADIUS * SQRT3 + 1.18);
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 180) * (60 * i);
          const vx = BOARD_CENTER_X + outerR * Math.cos(angle);
          const vy = BOARD_CENTER_Y + outerR * Math.sin(angle);
          if (i === 0) boardCtx.moveTo(vx, vy);
          else boardCtx.lineTo(vx, vy);
        }
        boardCtx.closePath();
        boardCtx.fillStyle = "rgba(255, 255, 255, 0.34)";
        boardCtx.fill();
        boardCtx.strokeStyle = "rgba(255, 255, 255, 0.85)";
        boardCtx.lineWidth = 2;
        boardCtx.stroke();
        boardCtx.restore();

        // 2. 绘制 61 个正六边形底座与已放置方块
        for (let i = 0; i < allBoardCoords.length; i++) {
          const coord = allBoardCoords[i];
          const pos = axialToPixel(coord.q, coord.r, BOARD_CENTER_X, BOARD_CENTER_Y, HEX_SIZE);
          const cellData = boardCellsMap.get(coord.key);

          if (cellData) {
            drawHexCell(boardCtx, pos.x, pos.y, HEX_SIZE - 1.6, cellData.color, cellData.border, 1, false);
          } else {
            boardCtx.save();
            traceHexPath(boardCtx, pos.x, pos.y, HEX_SIZE - 1.8);
            boardCtx.fillStyle = "rgba(255, 255, 255, 0.62)";
            boardCtx.fill();
            boardCtx.strokeStyle = "rgba(148, 163, 184, 0.45)";
            boardCtx.lineWidth = 1.3;
            boardCtx.stroke();
            boardCtx.restore();
          }
        }

        // 3. 绘制悬停/拖拽落子预览虚影与即将消除的整行高亮提示
        const activeIdx = isDragging ? dragSlotIndex : selectedSlotIndex;
        const activePiece = pieces[activeIdx];

        if (!isGameOver && activePiece && hoverAnchor) {
          const valid = canPlacePieceAt(activePiece, hoverAnchor.q, hoverAnchor.r);

          if (valid) {
            const previewSet = new Set();
            activePiece.cells.forEach(function (c) {
              previewSet.add(cellKey(hoverAnchor.q + c[0], hoverAnchor.r + c[1]));
            });

            ALL_LINES.forEach(function (line) {
              let willComplete = true;
              for (let j = 0; j < line.keys.length; j++) {
                const k = line.keys[j];
                if (boardCellsMap.get(k) === null && !previewSet.has(k)) {
                  willComplete = false;
                  break;
                }
              }
              if (willComplete) {
                line.keys.forEach(function (k) {
                  const parts = k.split(",");
                  const p = axialToPixel(Number(parts[0]), Number(parts[1]), BOARD_CENTER_X, BOARD_CENTER_Y, HEX_SIZE);
                  boardCtx.save();
                  traceHexPath(boardCtx, p.x, p.y, HEX_SIZE - 1.2);
                  boardCtx.strokeStyle = "#f59e0b";
                  boardCtx.lineWidth = 2.8;
                  boardCtx.stroke();
                  boardCtx.restore();
                });
              }
            });
          }

          activePiece.cells.forEach(function (c) {
            const tq = hoverAnchor.q + c[0];
            const tr = hoverAnchor.r + c[1];
            if (!isInsideBoard(tq, tr)) return;
            const pos = axialToPixel(tq, tr, BOARD_CENTER_X, BOARD_CENTER_Y, HEX_SIZE);
            if (valid) {
              drawHexCell(boardCtx, pos.x, pos.y, HEX_SIZE - 1.8, activePiece.color, activePiece.border, 0.56, true);
            } else {
              drawHexCell(boardCtx, pos.x, pos.y, HEX_SIZE - 1.8, "rgba(239, 68, 68, 0.38)", "#ef4444", 0.72, true);
            }
          });
        }

        // 4. 消行缩放闪光动画
        if (clearingAnimations.length > 0) {
          const remain = [];
          for (let i = 0; i < clearingAnimations.length; i++) {
            const anim = clearingAnimations[i];
            const progress = (now - anim.startTime) / 320;
            if (progress < 1) {
              const pos = axialToPixel(anim.q, anim.r, BOARD_CENTER_X, BOARD_CENTER_Y, HEX_SIZE);
              const r = (HEX_SIZE - 1.5) * (1 - progress * 0.85);
              drawHexCell(boardCtx, pos.x, pos.y, Math.max(2, r), "#ffffff", anim.color, 1 - progress, false);
              remain.push(anim);
            }
          }
          clearingAnimations = remain;
        }

        // 5. 浮动得分文字动画
        if (floatingPopups.length > 0) {
          const remainPopups = [];
          for (let i = 0; i < floatingPopups.length; i++) {
            const pop = floatingPopups[i];
            const progress = (now - pop.startTime) / 850;
            if (progress < 1) {
              boardCtx.save();
              boardCtx.globalAlpha = 1 - progress;
              boardCtx.font = "800 16px " + getComputedStyle(document.body).fontFamily;
              boardCtx.textAlign = "center";
              boardCtx.fillStyle = pop.color;
              boardCtx.strokeStyle = "rgba(255, 255, 255, 0.95)";
              boardCtx.lineWidth = 3.5;
              const py = pop.y - progress * 34;
              boardCtx.strokeText(pop.text, pop.x, py);
              boardCtx.fillText(pop.text, pop.x, py);
              boardCtx.restore();
              remainPopups.push(pop);
            }
          }
          floatingPopups = remainPopups;
        }

        requestAnimationFrame(renderBoardFrame);
      }

      function getBoardAxialFromClientPoint(clientX, clientY) {
        const rect = boardCanvas.getBoundingClientRect();
        const scaleX = boardCanvas.width / rect.width;
        const scaleY = boardCanvas.height / rect.height;
        const canvasX = (clientX - rect.left) * scaleX;
        const canvasY = (clientY - rect.top) * scaleY;
        const axial = pixelToAxial(canvasX, canvasY, BOARD_CENTER_X, BOARD_CENTER_Y, HEX_SIZE);
        if (isInsideBoard(axial.q, axial.r)) {
          return axial;
        }
        return null;
      }

      boardCanvas.addEventListener("pointermove", function (e) {
        if (isDragging) return;
        hoverAnchor = getBoardAxialFromClientPoint(e.clientX, e.clientY);
      });

      boardCanvas.addEventListener("pointerleave", function () {
        if (!isDragging) {
          hoverAnchor = null;
        }
      });

      boardCanvas.addEventListener("click", function (e) {
        if (isDragging || isGameOver) return;
        const target = getBoardAxialFromClientPoint(e.clientX, e.clientY);
        if (target && pieces[selectedSlotIndex]) {
          placePieceOnBoard(selectedSlotIndex, target.q, target.r);
        }
      });

      slotCards.forEach(function (card, idx) {
        card.addEventListener("pointerdown", function (e) {
          if (isGameOver || !pieces[idx]) return;
          e.preventDefault();
          selectedSlotIndex = idx;
          isDragging = true;
          dragSlotIndex = idx;

          // 使用 alignToAnchor = true，让拖拽浮层中的拼图锚点 [0, 0] 严格对准鼠标中心
          drawPieceOnCanvas(dragFloatCtx, pieces[idx], HEX_SIZE, true);
          dragFloatCanvas.style.display = "block";
          const yOffset = e.pointerType === "touch" ? -48 : 0;
          dragFloatCanvas.style.left = e.clientX + "px";
          dragFloatCanvas.style.top = (e.clientY + yOffset) + "px";

          hoverAnchor = getBoardAxialFromClientPoint(e.clientX, e.clientY + yOffset);
          renderAllSlots();
        });
      });

      window.addEventListener("pointermove", function (e) {
        if (!isDragging) return;
        const yOffset = e.pointerType === "touch" ? -48 : 0;
        dragFloatCanvas.style.left = e.clientX + "px";
        dragFloatCanvas.style.top = (e.clientY + yOffset) + "px";
        hoverAnchor = getBoardAxialFromClientPoint(e.clientX, e.clientY + yOffset);
      });

      window.addEventListener("pointerup", function (e) {
        if (!isDragging) return;
        const yOffset = e.pointerType === "touch" ? -48 : 0;
        const dropTarget = getBoardAxialFromClientPoint(e.clientX, e.clientY + yOffset);
        const slotIdx = dragSlotIndex;

        isDragging = false;
        dragSlotIndex = -1;
        dragFloatCanvas.style.display = "none";

        if (dropTarget && pieces[slotIdx] && canPlacePieceAt(pieces[slotIdx], dropTarget.q, dropTarget.r)) {
          placePieceOnBoard(slotIdx, dropTarget.q, dropTarget.r);
        } else {
          renderAllSlots();
        }
        hoverAnchor = null;
      });

      window.addEventListener("keydown", function (e) {
        if (e.key === "1") {
          selectedSlotIndex = 0;
          renderAllSlots();
        } else if (e.key === "2") {
          selectedSlotIndex = 1;
          renderAllSlots();
        } else if (e.key === "3") {
          selectedSlotIndex = 2;
          renderAllSlots();
        } else if (e.key === "z" || e.key === "Z") {
          performUndo();
        } else if (e.key === "r" || e.key === "R") {
          startNewGame();
        } else if (e.key === "m" || e.key === "M") {
          toggleSound();
        }
      });

      function startNewGame() {
        boardCellsMap.forEach(function (_, k) {
          boardCellsMap.set(k, null);
        });
        score = 0;
        totalLinesCleared = 0;
        maxComboLines = 0;
        undoSnapshot = null;
        undoMoveBtn.disabled = true;
        isGameOver = false;
        gameOverOverlay.classList.remove("is-visible");
        pieces = [spawnRandomPiece(), spawnRandomPiece(), spawnRandomPiece()];
        selectedSlotIndex = 0;
        updateHud();
        renderAllSlots();
      }

      function toggleSound() {
        soundEnabled = !soundEnabled;
        toggleSoundBtn.textContent = soundEnabled ? "🔊 音效" : "🔇 静音";
      }

      restartGameBtn.addEventListener("click", function () {
        startNewGame();
        showToast("已重新开始新对局");
      });
      overlayRestartBtn.addEventListener("click", startNewGame);
      undoMoveBtn.addEventListener("click", performUndo);
      toggleSoundBtn.addEventListener("click", toggleSound);

      // 按权重随机切换背景图
      const randomBgBtn = document.getElementById("randomBgBtn");
      const currentBgLabel = document.getElementById("currentBgLabel");

      function pickWeightedBackground(showMsg) {
        const pool = (BLOG_CONFIG.backgrounds || []).filter(function (item) {
          return item && item.url && Number(item.weight) > 0;
        });
        if (pool.length === 0) return;

        const totalWeight = pool.reduce(function (sum, item) {
          return sum + Number(item.weight);
        }, 0);

        let rand = Math.random() * totalWeight;
        let chosen = pool[0];
        for (let i = 0; i < pool.length; i++) {
          rand -= Number(pool[i].weight);
          if (rand <= 0) {
            chosen = pool[i];
            break;
          }
        }

        document.documentElement.style.setProperty("--bg-image", 'url("' + chosen.url + '")');
        const pct = Math.round((Number(chosen.weight) / totalWeight) * 100);
        if (currentBgLabel) {
          currentBgLabel.textContent = chosen.name;
        }
        if (showMsg) {
          showToast("已切换背景：「" + chosen.name + "」(" + pct + "% 权重)");
        }
      }

      pickWeightedBackground(false);
      randomBgBtn.addEventListener("click", function () {
        pickWeightedBackground(true);
      });

      // 右下角 Live2D 模型加载与上半身等比放大 (同时兼容 oh-my-live2d 与 live2d-widget)
      function loadExternalScript(src) {
        return new Promise(function (resolve, reject) {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }

      function applyLive2DUpperBodyZoom(disp) {
        const boxW = (disp.width || 280) + "px";
        const boxH = (disp.boxHeight || 300) + "px";
        const zoom = Number(disp.upperZoom) > 0 ? Number(disp.upperZoom) : 2.25;
        const anchorY = disp.anchorY || "0%";
        const shiftX = typeof disp.shiftX === "number" ? (disp.shiftX + "px") : (disp.shiftX || "10px");
        const shiftY = typeof disp.shiftY === "number" ? (disp.shiftY + "px") : (disp.shiftY || "20px");

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty("--live2d-box-width", boxW);
        rootStyle.setProperty("--live2d-box-height", boxH);
        rootStyle.setProperty("--live2d-zoom", String(zoom));
        rootStyle.setProperty("--live2d-anchor-y", anchorY);
        rootStyle.setProperty("--live2d-shift-x", shiftX);
        rootStyle.setProperty("--live2d-shift-y", shiftY);

        function syncDomStyles() {
          const stages = document.querySelectorAll("#oml2d-stage, .oml2d-stage, #live2d-widget, .live2d-widget-container");
          stages.forEach(function (st) {
            st.style.setProperty("position", "fixed", "important");
            st.style.setProperty("right", (typeof disp.hOffset === "number" ? disp.hOffset : 12) + "px", "important");
            st.style.setProperty("bottom", (typeof disp.vOffset === "number" ? disp.vOffset : 0) + "px", "important");
            st.style.setProperty("left", "auto", "important");
            st.style.setProperty("top", "auto", "important");
            st.style.setProperty("width", boxW, "important");
            st.style.setProperty("height", boxH, "important");
            st.style.setProperty("overflow", "visible", "important");
            st.style.setProperty("clip-path", "inset(-600px -300px 0px -300px)", "important");
          });

          const canvases = document.querySelectorAll("#oml2d-canvas, #oml2d-stage canvas, #live2dcanvas, #live2d-widget canvas");
          canvases.forEach(function (cvs) {
            cvs.style.setProperty("transform-origin", "50% " + anchorY, "important");
            cvs.style.setProperty("transform", "translate(" + shiftX + ", " + shiftY + ") scale(" + zoom + ")", "important");
          });
        }

        syncDomStyles();
        let count = 0;
        const timer = setInterval(function () {
          syncDomStyles();
          count++;
          if (count > 40) clearInterval(timer);
        }, 180);
      }

      async function initLive2D() {
        const cfg = BLOG_CONFIG.live2d;
        if (!cfg || !cfg.enabled || !cfg.modelJsonUrl) return;
        const disp = cfg.display || {};
        const mob = cfg.mobile || {};
        const react = cfg.react || {};

        applyLive2DUpperBodyZoom(disp);

        try {
          if (cfg.engine === "oml2d") {
            await loadExternalScript(cfg.oml2dScriptUrl || "https://cdn.jsdelivr.net/npm/oh-my-live2d@latest/dist/index.min.js");
            if (window.OML2D && typeof window.OML2D.loadOml2d === "function") {
              const omlInstance = window.OML2D.loadOml2d({
                dockedPosition: "right",
                menus: { disable: true },
                tips: { disable: true },
                statusBar: { disable: true },
                models: [
                  {
                    path: cfg.modelJsonUrl,
                    stageStyle: {
                      width: disp.width || 280,
                      height: disp.boxHeight || 300
                    }
                  }
                ]
              });
              if (omlInstance && typeof omlInstance.onLoad === "function") {
                omlInstance.onLoad(function () {
                  applyLive2DUpperBodyZoom(disp);
                });
              }
            }
          } else {
            await loadExternalScript(cfg.scriptUrl || "https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js");
            if (window.L2Dwidget && typeof window.L2Dwidget.init === "function") {
              window.L2Dwidget.init({
                model: { jsonPath: cfg.modelJsonUrl, scale: disp.scale || 1 },
                display: {
                  position: disp.position || "right",
                  width: disp.width || 280,
                  height: disp.boxHeight || 300,
                  hOffset: typeof disp.hOffset === "number" ? disp.hOffset : 12,
                  vOffset: typeof disp.vOffset === "number" ? disp.vOffset : 0
                },
                mobile: { show: mob.show !== false, scale: mob.scale || 0.6 },
                react: { opacityDefault: react.opacityDefault || 0.95, opacityOnHover: react.opacityOnHover || 1 }
              });
            }
          }
          applyLive2DUpperBodyZoom(disp);
        } catch (e) {}
      }

      initLive2D();
      startNewGame();
      requestAnimationFrame(renderBoardFrame);
    })();
  </script>
</body>
</html>
