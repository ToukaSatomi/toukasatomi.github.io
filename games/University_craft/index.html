    .hud-stat-value.accent { color: #2563eb; }
    .hud-stat-value.is-bumping { animation: hudScoreBump 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes hudScoreBump { 0% { transform: scale(1); } 45% { transform: scale(1.24); color: #2563eb; } 100% { transform: scale(1); } }
    .game-arena { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 244px; gap: 14px; align-items: stretch; }
    .board-glass-card { position: relative; border-radius: 20px; background: rgba(255,255,255,0.54); border: 1px solid rgba(255,255,255,0.9); padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

    .uni-next-card { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 13px; background: rgba(255,255,255,0.66); border: 1px solid rgba(255,255,255,0.92); }

    .uni-atlas-header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; font-size: 0.72rem; font-weight: 700; color: #475569; }
    .uni-atlas-count { font-family: var(--font-mono, monospace); font-size: 0.72rem; font-weight: 800; color: #2563eb; }

            🔊 音效
          </button>

            ↻ 重开 (R)
          </button>
          <a href="../../index.html" id="backBlogHomeBtn" class="back-home-btn is-primary">
            ← 返回主页
          </a>
        </div>
      </header>

      <!-- 2. 四项计分与统计数据栏 -->
      <section class="hud-stats-row" aria-label="游戏计分面板">
        <div class="hud-stat-card">
          <span class="hud-stat-label">当前得分 / SCORE</span>
          <span id="currentScoreEl" class="hud-stat-value accent">0</span>
        </div>
        <div class="hud-stat-card">
          <span class="hud-stat-label">最高纪录 / BEST</span>
          <span id="bestScoreEl" class="hud-stat-value">0</span>
        </div>
        <div class="hud-stat-card">
          <span class="hud-stat-label">最高学府 / TOP UNI</span>
          <span id="topUniEl" class="hud-stat-value" style="font-size: 1.05rem;">Lv.1 上财</span>
        </div>
        <div class="hud-stat-card">
          <span class="hud-stat-label">最高连合 / MAX COMBO</span>
          <span id="maxComboEl" class="hud-stat-value">×1</span>
        </div>
      </section>

      <!-- 3. 左侧大圆形培养皿主画布 + 右侧 15 阶名校校徽图鉴 -->
      <section class="game-arena" aria-label="大圆形合成培养皿与右侧校徽图鉴">

          <canvas id="suikaCanvas" width="520" height="490" aria-label="合成名校大圆形容器画布"></canvas>

            <p id="gameOverSummary"></p>
            <button type="button" id="overlayRestartBtn" class="back-home-btn is-primary" style="padding: 9px 22px; font-size: 0.9rem;">
              ↻ 再来一局
            </button>
          </div>
        </div>

        <aside class="tray-glass-panel" aria-label="下一枚预告与15阶名校图鉴">

            <div>
              <div class="uni-next-label">NEXT · 下一枚校徽</div>

            </div>
            <div class="uni-atlas-thumb" style="width: 42px; height: 42px; padding: 0;">
              <canvas id="nextPreviewCanvas" width="64" height="64"></canvas>
            </div>
          </div>

          <div class="uni-atlas-header">
            <span>15 阶高校校徽（小 → 大）</span>
            <span id="unlockedCountEl" class="uni-atlas-count">1 / 15</span>
          </div>

          <div class="uni-atlas-grid" id="uniAtlasGrid"></div>
        </aside>
      </section>
    </div>

    /* ============================================================================
       矢量图腾兜底绘制（当网络慢或个别外网图片尚未加载完成时立即显示精致矢量校徽，
       网络图片加载完成后自动无缝替换为真实网络校徽）

    const emblemSprites = [];
    const loadedImageElements = new Array(UNIVERSITIES.length).fill(null);

    function drawGearTeeth(ctx, rInner, rOuter, teeth, color) {
      ctx.save();
      ctx.fillStyle = color;
      for (let i = 0; i < teeth; i++) {
        const a = (i / teeth) * Math.PI * 2;
        ctx.save();
        ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(-4, -rInner);
        ctx.lineTo(-3, -rOuter);
        ctx.lineTo(3, -rOuter);
        ctx.lineTo(4, -rInner);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    function drawFallbackVectorMotif(ctx, uni) {
      ctx.save();
      const acc = uni.accent;
      const pri = uni.primary;
      switch (uni.motif) {
        case "sufe_coin":
          ctx.strokeStyle = acc;
          ctx.lineWidth = 4.5;
          ctx.beginPath();
          ctx.moveTo(-10, -34);
          ctx.lineTo(10, -34);
          ctx.lineTo(12, -16);
          ctx.lineTo(24, -14);
          ctx.lineTo(26, 20);
          ctx.lineTo(12, 20);
          ctx.lineTo(6, 4);
          ctx.lineTo(-6, 4);
          ctx.lineTo(-12, 20);
          ctx.lineTo(-26, 20);
          ctx.lineTo(-24, -14);
          ctx.lineTo(-12, -16);
          ctx.closePath();
          ctx.stroke();
          break;
        case "bupt_dove":
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.moveTo(-34, 10);
          ctx.quadraticCurveTo(-10, -18, 32, -22);
          ctx.quadraticCurveTo(8, -2, 14, 18);
          ctx.quadraticCurveTo(-4, 4, -34, 10);
          ctx.closePath();
          ctx.fill();
          break;
        case "sustech_torch":
          ctx.fillStyle = "#fb923c";
          ctx.beginPath();
          ctx.moveTo(-6, 32);
          ctx.quadraticCurveTo(-24, 6, -12, -16);
          ctx.quadraticCurveTo(0, -34, 18, -40);
          ctx.quadraticCurveTo(6, -14, 18, 2);
          ctx.quadraticCurveTo(32, -6, 12, 22);
          ctx.closePath();
          ctx.fill();
          break;
        case "shanghaitech_tower":
          drawGearTeeth(ctx, 30, 38, 12, acc);
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.moveTo(0, -26);
          ctx.lineTo(13, 20);
          ctx.lineTo(-13, 20);
          ctx.closePath();
          ctx.fill();
          break;
        case "westlake_moon":
          ctx.fillStyle = "#fcd34d";
          ctx.beginPath();
          ctx.arc(0, -4, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = pri;
          ctx.beginPath();
          ctx.arc(0, -4, 6, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "ruc_triple_ren":
          ctx.strokeStyle = acc;
          ctx.lineWidth = 6;
          ctx.lineCap = "round";
          for (const [ox, oy] of [[0, -12], [-18, 10], [18, 10]]) {
            ctx.beginPath();
            ctx.moveTo(ox, oy - 16);
            ctx.lineTo(ox, oy - 2);
            ctx.lineTo(ox - 12, oy + 14);
            ctx.moveTo(ox, oy);
            ctx.lineTo(ox + 12, oy + 14);
            ctx.stroke();
          }
          break;
        case "nju_cedar_shield":
          ctx.fillStyle = "#4ade80";
          ctx.beginPath();
          ctx.moveTo(0, -26);
          ctx.lineTo(-22, 16);
          ctx.lineTo(22, 16);
          ctx.closePath();
          ctx.fill();
          break;
        case "ucas_atom":
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 3;
          for (let a = 0; a < 3; a++) {
            ctx.save();
            ctx.rotate((a * Math.PI) / 3);
            ctx.beginPath();
            ctx.ellipse(0, 0, 32, 12, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
          break;
        case "sjtu_gear_anvil":
          drawGearTeeth(ctx, 32, 41, 20, acc);

        case "tsinghua_seal":

        case "utokyo_ginkgo":

    function renderUniversityTokenCanvas(idx, imgEl) {
      const uni = UNIVERSITIES[idx];
      const size = 256;
      const off = emblemSprites[idx] || document.createElement("canvas");
      off.width = size;
      off.height = size;
      const c = off.getContext("2d");
      const cx = size / 2;
      const cy = size / 2;
      const R = 122;

      c.clearRect(0, 0, size, size);
      c.save();
      c.translate(cx, cy);

      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        // 1. 网络校徽图片加载成功：纯白圆盘底托 + 真实校徽图片居中内切
        c.beginPath();
        c.arc(0, 0, R, 0, Math.PI * 2);
        c.fillStyle = "#ffffff";
        c.fill();

        c.save();
        c.beginPath();
        c.arc(0, 0, R - 8, 0, Math.PI * 2);
        c.clip();

        const iw = imgEl.naturalWidth;
        const ih = imgEl.naturalHeight;
        const aspect = iw / ih;
        const targetBox = (aspect > 1.25 || aspect < 0.8) ? (R - 16) * 1.86 : (R - 9) * 1.96;
        let dw = targetBox;
        let dh = targetBox;
        if (aspect > 1) {
          dh = targetBox / aspect;
        } else {
          dw = targetBox * aspect;
        }
        c.drawImage(imgEl, -dw / 2, -dh / 2, dw, dh);
        c.restore();
      } else {
        // 2. 矢量校徽即时兜底（即使离线或等待请求期间也拥有完整精致校徽）
        const baseGrad = c.createRadialGradient(-30, -36, 12, 0, 0, R);
        baseGrad.addColorStop(0, uni.primary);
        baseGrad.addColorStop(1, uni.secondary || uni.primary);
        c.beginPath();
        c.arc(0, 0, R, 0, Math.PI * 2);
        c.fillStyle = baseGrad;
        c.fill();
        c.save();
        c.translate(0, -10);
        drawFallbackVectorMotif(c, uni);
        c.restore();
      }

      // 3. 高校代表色双层边框
      c.beginPath();
      c.arc(0, 0, R - 3, 0, Math.PI * 2);
      c.lineWidth = 7;
      c.strokeStyle = uni.primary;
      c.stroke();

      c.beginPath();
      c.arc(0, 0, R - 8, 0, Math.PI * 2);
      c.lineWidth = 2.2;
      c.strokeStyle = uni.accent;
      c.stroke();

      // 4. 底部校名小胶囊铭牌
      const pillW = 136;
      const pillH = 34;
      const pillY = R - 38;
      c.fillStyle = "rgba(15, 23, 42, 0.84)";
      c.strokeStyle = uni.accent;
      c.lineWidth = 2;
      c.beginPath();
      c.roundRect(-pillW / 2, pillY, pillW, pillH, 17);
      c.fill();
      c.stroke();

      c.fillStyle = "#ffffff";
      c.font = '800 20px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif';
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText(uni.short, 0, pillY + pillH / 2 + 1);

      c.restore();
      emblemSprites[idx] = off;

      // 同步刷新右侧图鉴小画布与下一枚预览画布
      const atlasCanvas = document.getElementById(`atlas-canvas-${idx}`);
      if (atlasCanvas) {
        const aCtx = atlasCanvas.getContext("2d");
        aCtx.clearRect(0, 0, 64, 64);
        aCtx.drawImage(off, 0, 0, 64, 64);
      }
      if (typeof nextDropLevel === "number" && idx === nextDropLevel) {
        updateNextPreviewUI();
      }
      return off;
    }

    function loadUniversityNetworkImages() {
      UNIVERSITIES.forEach((uni, idx) => {
        renderUniversityTokenCanvas(idx, null);

        const candidateUrls = [uni.logoUrl, ...(uni.backupUrls || [])];
        let attemptIndex = 0;

        const tryLoadNextUrl = () => {
          if (attemptIndex >= candidateUrls.length) return;
          const url = candidateUrls[attemptIndex++];
          const img = new Image();
          img.referrerPolicy = "no-referrer";
          img.onload = () => {
            loadedImageElements[idx] = img;
            renderUniversityTokenCanvas(idx, img);
          };
          img.onerror = () => {
            tryLoadNextUrl();
          };
          img.src = url;
        };

        tryLoadNextUrl();
      });
    }

    /* ============================================================================
       Web Audio 学术钟声与连合和弦合成器
       ============================================================================ */
    class AcademicSoundEngine {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      playDrop() {
        if (!this.enabled) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(165, now + 0.09);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.095);
      }

      playBounce(speed) {
        if (!this.enabled || speed < 2.2) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        const freq = Math.min(240, 95 + speed * 14);
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.045);
        const vol = Math.min(0.045, speed * 0.004);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      playMerge(newLevel, combo = 1) {
        if (!this.enabled) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00];
        const baseFreq = scale[Math.min(newLevel, scale.length - 1)] * (1 + (combo - 1) * 0.04);

        const ratios = newLevel >= 9 ? [1, 1.25, 1.5, 2] : [1, 1.25, 1.5];
        ratios.forEach((ratio, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx === 0 ? "triangle" : "sine";
          const start = now + idx * 0.032;
          const dur = newLevel >= 12 ? 0.42 : 0.24;
          osc.frequency.setValueAtTime(baseFreq * ratio, start);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * ratio * 1.03, start + dur);
          gain.gain.setValueAtTime(0.11 / (idx + 1), start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + dur + 0.02);
        });
      }

      playJostle() {
        if (!this.enabled) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.18);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    /* ============================================================================

    const STORAGE_KEY_BEST = "tm_sharweek_merge_uni_best_v1";

    function loadBestScore() {
      try {
        const val = parseInt(localStorage.getItem(STORAGE_KEY_BEST), 10);
        return Number.isFinite(val) && val > 0 ? val : 0;
      } catch (e) {
        return 0;
      }
    }

    function saveBestScore(score) {
      try {
        const currentBest = loadBestScore();
        if (score > currentBest) {
          localStorage.setItem(STORAGE_KEY_BEST, String(score));
          return score;
        }
        return currentBest;
      } catch (e) {
        return score;
      }
    }

    const canvas = document.getElementById("suikaCanvas");

    const BOWL_CX = W / 2;    // 260
    const BOWL_CY = 258;
    const BOWL_R = 220;

    const DEADLINE_DY = BOWL_CY - DEADLINE_Y; // 136
    const DEADLINE_HALF_CHORD = Math.sqrt(Math.max(0, BOWL_R * BOWL_R - DEADLINE_DY * DEADLINE_DY)); // ~114.8

    function rollRandomDropLevel() {
      const weights = [38, 28, 18, 11, 5];
      let r = Math.random() * 100;
      for (let i = 0; i < weights.length; i++) {
        if (r < weights[i]) return i;
        r -= weights[i];
      }
      return 0;
    }

    // 限制投球横坐标在大圆形顶部开口范围内，使球落下后顺畅滑入大圆内壁
    function clampDropX(x, level) {
      const r = UNIVERSITIES[level].radius;
      const maxOffset = Math.max(24, DEADLINE_HALF_CHORD - r - 4);
      return Math.max(BOWL_CX - maxOffset, Math.min(BOWL_CX + maxOffset, x));
    }

    // 计算给定横坐标 x 在大圆下半部内壁的落点 Y 坐标（供瞄准虚线使用）
    function getBowlFloorYAtX(x, ballRadius = 0) {
      const effR = Math.max(10, BOWL_R - ballRadius);
      const dx = x - BOWL_CX;
      if (Math.abs(dx) >= effR) return BOWL_CY;
      return BOWL_CY + Math.sqrt(effR * effR - dx * dx);
    }

    // 将合成的新球位置约束在大圆形容器内壁之内
    function clampBallInsideBowl(x, y, radius) {
      const maxCenterDist = Math.max(4, BOWL_R - radius);
      const dx = x - BOWL_CX;
      const dy = y - BOWL_CY;
      const dist = Math.hypot(dx, dy);
      if (dist > maxCenterDist && dist > 0.001) {
        return {
          x: BOWL_CX + (dx / dist) * maxCenterDist,
          y: BOWL_CY + (dy / dist) * maxCenterDist
        };
      }
      return { x, y };
    }

    function spawnMergeEffects(x, y, newLevel, combo) {
      const uni = UNIVERSITIES[newLevel];
      shockwaves.push({
        x,
        y,
        r: uni.radius * 0.45,
        maxR: uni.radius * (1.85 + Math.min(combo * 0.18, 1.1)),
        color: uni.accent,
        secondaryColor: uni.primary,
        alpha: 0.95,
        lineWidth: 4.5 + Math.min(newLevel * 0.35, 4)
      });

      const count = 16 + newLevel * 3 + combo * 4;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
        const speed = 2.0 + Math.random() * (4.2 + newLevel * 0.35);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          size: 3 + Math.random() * 4.5,
          color: i % 2 === 0 ? uni.accent : uni.primary,
          alpha: 1,
          decay: 0.018 + Math.random() * 0.014,
          shape: i % 3 === 0 ? "star" : "circle",
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.16
        });
      }

      const comboTag = combo >= 2 ? ` · ${combo}连合!` : "";
      floatingTexts.push({
        x,
        y: y - uni.radius * 0.5,
        text: `🎓 ${uni.name}${comboTag}`,
        subText: `+${uni.score * combo}`,
        color: uni.accent,
        stroke: "#0f172a",
        alpha: 1,
        vy: -1.35,
        scale: newLevel >= 9 ? 1.22 : 1.0
      });

      if (newLevel >= 8) {
        screenShakeMag = Math.min(11, 3 + (newLevel - 7) * 1.4);
        for (let k = 0; k < 24; k++) {
          const ang = Math.random() * Math.PI * 2;
          const rad = Math.random() * (BOWL_R * 0.72);
          backgroundConfetti.push({
            x: BOWL_CX + Math.cos(ang) * rad,
            y: BOWL_CY - Math.abs(Math.sin(ang) * rad * 0.6),
            vx: (Math.random() - 0.5) * 3.5,
            vy: 1.4 + Math.random() * 2.6,
            color: k % 2 === 0 ? uni.accent : uni.primary,
            w: 6 + Math.random() * 5,
            h: 3 + Math.random() * 3,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.2,
            alpha: 1
          });
        }
      }
    }

    function dropCurrentBall() {
      if (isGameOver || dropCooldown > 0) return;
      const lvl = currentDropLevel;
      const r = UNIVERSITIES[lvl].radius;
      const spawnX = clampDropX(pointerX, lvl);

      balls.push({
        id: ballIdSeq++,
        level: lvl,
        x: spawnX,
        y: DROP_Y,
        vx: (Math.random() - 0.5) * 0.18,
        vy: 2.1,
        radius: r,
        mass: r * r,
        angle: 0,
        vAngle: 0,
        scaleX: 1.12,
        scaleY: 0.88,
        glowAlpha: 0.4,
        hasTouched: false,
        safeFrames: 55
      });

      soundFX.playDrop();
      dropCooldown = 22;
      currentDropLevel = nextDropLevel;
      nextDropLevel = rollRandomDropLevel();
      pointerX = clampDropX(pointerX, currentDropLevel);
      updateNextPreviewUI();
    }

    /* ============================================================================
       大圆形容器物理更新（每帧 8 子步，支持沿圆弧内壁自然滚动、弹跳与滑落）
       ============================================================================ */
    function stepPhysics() {
      if (isGameOver) return;

      if (dropCooldown > 0) dropCooldown--;
      if (comboResetTimer > 0) {
        comboResetTimer--;
        if (comboResetTimer === 0) comboChainCount = 0;
      }
      if (screenShakeMag > 0.1) {
        screenShakeMag *= 0.86;
      } else {
        screenShakeMag = 0;
      }

      const SUB_STEPS = 8;
      const GRAVITY = 0.28 / SUB_STEPS;
      const RESTITUTION = 0.24;
      const FRICTION = 0.993;

      let mergedPair = null;

      for (let step = 0; step < SUB_STEPS; step++) {
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];
          b.vy += GRAVITY;
          b.vx *= Math.pow(FRICTION, 1 / SUB_STEPS);
          b.x += b.vx / SUB_STEPS;
          b.y += b.vy / SUB_STEPS;
          b.angle += b.vAngle / SUB_STEPS;
          b.vAngle *= 0.995;

          // 大圆形容器内壁碰撞检测与弧面滚动物理响应
          const maxCenterDist = Math.max(4, BOWL_R - b.radius);
          const dx = b.x - BOWL_CX;
          const dy = b.y - BOWL_CY;
          const dist = Math.hypot(dx, dy);

          // 顶部投球口：只有当球已经进入警戒线下方或碰撞到左右圆弧壁时才施加圆形内壁约束
          const inTopDropChannel = !b.hasTouched && b.y < DEADLINE_Y && Math.abs(dx) < DEADLINE_HALF_CHORD - b.radius;

          if (!inTopDropChannel && dist > maxCenterDist && dist > 0.001) {
            const nx = dx / dist; // 指向圆外侧的单位法向量
            const ny = dy / dist;

            // 将球体推回大圆形内壁上
            b.x = BOWL_CX + nx * maxCenterDist;
            b.y = BOWL_CY + ny * maxCenterDist;

            // 法向与切向速度分解
            const vNormal = b.vx * nx + b.vy * ny;
            if (vNormal > 0) {
              if (vNormal > 1.55 && step === 0) {
                b.scaleX = 1.13;
                b.scaleY = 0.87;
                soundFX.playBounce(vNormal);
              }

              // 沿圆弧切线方向（顺时针单位切向量 tx = -ny, ty = nx）
              const tx = -ny;
              const ty = nx;
              const vTangent = b.vx * tx + b.vy * ty;

              // 反弹法向速度 + 保留切向弧面滑行速度
              const newVNormal = -vNormal * RESTITUTION;
              const newVTangent = vTangent * 0.985;

              b.vx = nx * newVNormal + tx * newVTangent;
              b.vy = ny * newVNormal + ty * newVTangent;

              // 根据沿圆弧滑动的切向速度更新球体自转角速度
              b.vAngle = newVTangent / Math.max(b.radius, 12);
            }

            if (dy > -BOWL_R * 0.55) {
              b.hasTouched = true;
            }
          }
        }

        // 球与球之间的刚体碰撞与同级合成检测
        for (let i = 0; i < balls.length; i++) {
          const a = balls[i];
          for (let j = i + 1; j < balls.length; j++) {
            const b = balls[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distSq = dx * dx + dy * dy;
            const minDist = a.radius + b.radius;

            if (distSq < minDist * minDist) {
              a.hasTouched = true;
              b.hasTouched = true;

              if (a.level === b.level && !mergedPair) {
                mergedPair = { idxA: i, idxB: j };
                break;
              }

              const dist = Math.sqrt(distSq) || 0.001;
              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = minDist - dist;

              const totalMass = a.mass + b.mass;
              const ratioA = b.mass / totalMass;
              const ratioB = a.mass / totalMass;

              a.x -= nx * overlap * ratioA;
              a.y -= ny * overlap * ratioA;
              b.x += nx * overlap * ratioB;
              b.y += ny * overlap * ratioB;

              const rvx = b.vx - a.vx;
              const rvy = b.vy - a.vy;
              const velAlongNormal = rvx * nx + rvy * ny;

              if (velAlongNormal < 0) {
                const jImpulse = -(1 + RESTITUTION) * velAlongNormal / (1 / a.mass + 1 / b.mass);
                const ix = jImpulse * nx;
                const iy = jImpulse * ny;
                a.vx -= ix / a.mass;
                a.vy -= iy / a.mass;
                b.vx += ix / b.mass;
                b.vy += iy / b.mass;

                const tx = -ny;
                const ty = nx;
                const tangentVel = rvx * tx + rvy * ty;
                a.vAngle -= (tangentVel * 0.015) / a.radius;
                b.vAngle += (tangentVel * 0.015) / b.radius;
              }
            }
          }
          if (mergedPair) break;
        }

        if (mergedPair) break;
      }

      if (mergedPair) {
        const a = balls[mergedPair.idxA];
        const b = balls[mergedPair.idxB];
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const currentLvl = a.level;

        balls.splice(mergedPair.idxB, 1);
        balls.splice(mergedPair.idxA, 1);

        comboChainCount++;
        comboResetTimer = 78;
        if (comboChainCount > maxComboRecord) {
          maxComboRecord = comboChainCount;
        }
        totalMergeCount++;

        const nextLvl = Math.min(UNIVERSITIES.length - 1, currentLvl + 1);
        const uni = UNIVERSITIES[nextLvl];

        const gainedScore = uni.score * comboChainCount * (currentLvl === UNIVERSITIES.length - 1 ? 2 : 1);
        currentScore += gainedScore;

        if (nextLvl > highestLevelReached) {
          highestLevelReached = nextLvl;
        }
        if (!unlockedMask.has(nextLvl)) {
          unlockedMask.add(nextLvl);
        }
        refreshAtlasStates();

        const newR = uni.radius;
        const clampedPos = clampBallInsideBowl(mx, my, newR);

        balls.push({
          id: ballIdSeq++,
          level: nextLvl,
          x: clampedPos.x,
          y: clampedPos.y,
          vx: (a.vx + b.vx) * 0.35,
          vy: -1.3,
          radius: newR,
          mass: newR * newR,
          angle: 0,
          vAngle: (Math.random() - 0.5) * 0.08,
          scaleX: 1.28,
          scaleY: 0.74,
          glowAlpha: 1.0,
          hasTouched: true,
          safeFrames: 25
        });

        for (const other of balls) {
          const dx = other.x - clampedPos.x;
          const dy = other.y - clampedPos.y;
          const d = Math.hypot(dx, dy);
          if (d > 1 && d < newR * 2.5) {
            const push = (1 - d / (newR * 2.5)) * 2.4;
            other.vx += (dx / d) * push;
            other.vy += (dy / d) * push - 0.5;
          }
        }

        soundFX.playMerge(nextLvl, comboChainCount);
        spawnMergeEffects(clampedPos.x, clampedPos.y, nextLvl, comboChainCount);
        updateHUD(true);
      }

      // 警戒线溢出检测（当球已落稳且球顶越过圆形容器顶部弦线 DEADLINE_Y 时开始读秒）
      let anyOverDeadline = false;
      for (const b of balls) {
        b.scaleX += (1 - b.scaleX) * 0.22;
        b.scaleY += (1 - b.scaleY) * 0.22;
        if (b.glowAlpha > 0) b.glowAlpha = Math.max(0, b.glowAlpha - 0.025);
        if (b.safeFrames > 0) b.safeFrames--;

        if (b.hasTouched && b.safeFrames <= 0 && b.y - b.radius < DEADLINE_Y) {
          anyOverDeadline = true;
        }
      }

      if (anyOverDeadline) {
        deadlineOverTimer++;
        if (deadlineOverTimer >= 135) {
          triggerGameOver();
        }
      } else {
        deadlineOverTimer = Math.max(0, deadlineOverTimer - 2);
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.18;
        sw.alpha -= 0.042;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.14;
        p.rot += p.vRot;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.018;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      for (let i = backgroundConfetti.length - 1; i >= 0; i--) {
        const c = backgroundConfetti[i];
        c.x += c.vx;
        c.y += c.vy;
        c.rot += c.vRot;
        c.alpha -= 0.012;
        if (c.alpha <= 0 || Math.hypot(c.x - BOWL_CX, c.y - BOWL_CY) > BOWL_R) {
          backgroundConfetti.splice(i, 1);
        }
      }
    }

    /* ============================================================================
       渲染大圆形水晶培养皿画面
       ============================================================================ */
    function drawStar(ctx, x, y, r, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
        const a2 = a1 + Math.PI / 5;
        ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
        ctx.lineTo(Math.cos(a2) * (r * 0.45), Math.sin(a2) * (r * 0.45));
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function renderArena() {
      ctx.save();
      ctx.clearRect(0, 0, W, H);

      if (screenShakeMag > 0.2) {
        const sx = (Math.random() - 0.5) * screenShakeMag;
        const sy = (Math.random() - 0.5) * screenShakeMag;
        ctx.translate(sx, sy);
      }

      // 1. 绘制大圆形水晶培养皿的立体底座与磨砂玻璃内腔
      ctx.save();
      const bowlGrad = ctx.createRadialGradient(
        BOWL_CX - 48,
        BOWL_CY - 56,
        18,
        BOWL_CX,
        BOWL_CY,
        BOWL_R
      );
      bowlGrad.addColorStop(0, "rgba(255, 255, 255, 0.90)");
      bowlGrad.addColorStop(0.68, "rgba(241, 245, 249, 0.84)");
      bowlGrad.addColorStop(1, "rgba(219, 234, 254, 0.92)");

      ctx.beginPath();
      ctx.arc(BOWL_CX, BOWL_CY, BOWL_R, 0, Math.PI * 2);
      ctx.fillStyle = bowlGrad;
      ctx.fill();

      // 圆形培养皿内部的同心极坐标刻度环与十字基准线
      ctx.strokeStyle = "rgba(148, 163, 184, 0.18)";
      ctx.lineWidth = 1;
      for (const ringR of [68, 136, 188]) {
        ctx.beginPath();
        ctx.arc(BOWL_CX, BOWL_CY, ringR, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(BOWL_CX - BOWL_R + 12, BOWL_CY);
      ctx.lineTo(BOWL_CX + BOWL_R - 12, BOWL_CY);
      ctx.moveTo(BOWL_CX, DEADLINE_Y + 8);
      ctx.lineTo(BOWL_CX, BOWL_CY + BOWL_R - 12);
      ctx.stroke();
      ctx.restore();

      // 2. 绘制大圆形容器的外环双层玻璃器皿壁（顶部留出投球开口弧段，其余圆弧加粗高亮）
      const startArc = -Math.PI / 2 + BOWL_OPEN_ANGLE;
      const endArc = (Math.PI * 3) / 2 - BOWL_OPEN_ANGLE;

      // 顶部投球口半透明引导虚线弧
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(BOWL_CX, BOWL_CY, BOWL_R, endArc, startArc + Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 主圆弧器皿壁（宝石蓝水晶玻璃质感）
      ctx.save();
      ctx.strokeStyle = "rgba(37, 99, 235, 0.48)";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(BOWL_CX, BOWL_CY, BOWL_R, startArc, endArc);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(BOWL_CX, BOWL_CY, BOWL_R - 3, startArc, endArc);
      ctx.stroke();

      // 顶部开口两侧的圆润玻璃唇口端点
      for (const ang of [startArc, endArc]) {
        const lx = BOWL_CX + Math.cos(ang) * BOWL_R;
        const ly = BOWL_CY + Math.sin(ang) * BOWL_R;
        ctx.fillStyle = "#2563eb";
        ctx.beginPath();
        ctx.arc(lx, ly, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 3. 圆形培养皿顶部警戒弦线
      const warnRatio = Math.min(1, deadlineOverTimer / 135);
      ctx.save();
      ctx.setLineDash([7, 6]);
      ctx.strokeStyle = warnRatio > 0
        ? `rgba(220, 38, 38, ${0.58 + 0.42 * Math.sin(Date.now() * 0.015)})`
        : "rgba(239, 68, 68, 0.42)";
      ctx.lineWidth = warnRatio > 0 ? 2.6 : 1.6;
      ctx.beginPath();
      ctx.moveTo(BOWL_CX - DEADLINE_HALF_CHORD + 4, DEADLINE_Y);
      ctx.lineTo(BOWL_CX + DEADLINE_HALF_CHORD - 4, DEADLINE_Y);
      ctx.stroke();
      if (warnRatio > 0.1) {
        ctx.fillStyle = "#dc2626";
        ctx.font = '700 11px "JetBrains Mono", monospace';
        ctx.textAlign = "center";
        ctx.fillText(`⚠ 圆盘即将溢出 ${(100 - warnRatio * 100).toFixed(0)}%`, BOWL_CX, DEADLINE_Y - 7);
      }
      ctx.restore();

      // 4. 顶部待投掷校徽与直达大圆底壁的激光瞄准线
      if (!isGameOver && dropCooldown <= 4) {
        const previewUni = UNIVERSITIES[currentDropLevel];
        const dropX = clampDropX(pointerX, currentDropLevel);
        const floorYAtDrop = getBowlFloorYAtX(dropX, previewUni.radius);

        ctx.save();
        ctx.setLineDash([4, 5]);
        ctx.strokeStyle = previewUni.primary + "88";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(dropX, DROP_Y + previewUni.radius);
        ctx.lineTo(dropX, floorYAtDrop);
        ctx.stroke();
        ctx.restore();

        const r = previewUni.radius;
        ctx.save();
        ctx.translate(dropX, DROP_Y);
        ctx.drawImage(emblemSprites[currentDropLevel], -r, -r, r * 2, r * 2);
        ctx.restore();
      }

      // 5. 背景金箔礼花
      for (const c of backgroundConfetti) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, c.alpha);
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }

      // 6. 绘制所有物理校徽球体
      for (const b of balls) {
        const uni = UNIVERSITIES[b.level];
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(b.scaleX, b.scaleY);

        // 贴近大圆内壁时的柔和投影
        const distFromCenter = Math.hypot(b.x - BOWL_CX, b.y - BOWL_CY);
        if (distFromCenter + b.radius > BOWL_R - 12 && b.y > BOWL_CY) {
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.15)";
          ctx.beginPath();
          ctx.ellipse(0, b.radius - 2, b.radius * 0.68, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (b.glowAlpha > 0.02) {
          ctx.save();
          ctx.globalAlpha = b.glowAlpha;
          ctx.strokeStyle = uni.accent;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(0, 0, b.radius + 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        ctx.rotate(b.angle);
        ctx.drawImage(emblemSprites[b.level], -b.radius, -b.radius, b.radius * 2, b.radius * 2);
        ctx.restore();
      }

      // 7. 合成冲击波光环
      for (const sw of shockwaves) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = sw.lineWidth;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = sw.secondaryColor;
        ctx.lineWidth = sw.lineWidth * 0.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r * 0.78, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 8. 星芒与粒子
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        if (p.shape === "star") {
          drawStar(ctx, p.x, p.y, p.size * 1.35, p.rot);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // 9. 浮动名校晋升横幅
      for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.translate(ft.x, ft.y);
        ctx.scale(ft.scale, ft.scale);
        ctx.font = '800 13px "Inter", "PingFang SC", sans-serif';
        ctx.textAlign = "center";
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = ft.stroke;
        ctx.strokeText(ft.text, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(ft.text, 0, 0);

        ctx.font = '800 11px "JetBrains Mono", monospace';
        ctx.strokeText(ft.subText, 0, 15);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.subText, 0, 15);
        ctx.restore();
      }

      ctx.restore();
    }

    /* ============================================================================
       交互控制与顶部按钮事件
       ============================================================================ */
    function showToast(msg) {
      const toast = document.getElementById("toastNotice");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("is-visible");
      clearTimeout(window.__uniToastTimer);
      window.__uniToastTimer = setTimeout(() => {
        toast.classList.remove("is-visible");
      }, 2200);
    }

    function updatePointerFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      if (typeof clientX === "number") {
        pointerX = clampDropX((clientX - rect.left) * scaleX, currentDropLevel);
      }
    }

    canvas.addEventListener("pointermove", (e) => {
      updatePointerFromEvent(e);
    });

    canvas.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      updatePointerFromEvent(e);
      dropCurrentBall();
    });

    function triggerJostleSkill() {
      if (isGameOver || jostleCharges <= 0 || balls.length === 0) return;
      jostleCharges--;
      screenShakeMag = 8;
      soundFX.playJostle();
      // 沿大圆盘施加切向涡旋与向心微跃助推，让校徽沿圆弧滚动碰撞
      for (const b of balls) {
        const dx = b.x - BOWL_CX;
        const dy = b.y - BOWL_CY;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;
        b.vx += -nx * 2.2 + (Math.random() - 0.5) * 6.2;
        b.vy += -ny * 2.4 - (1.8 + Math.random() * 2.0);
        b.scaleX = 0.88;
        b.scaleY = 1.12;
      }
      floatingTexts.push({
        x: BOWL_CX,
        y: BOWL_CY,
        text: "🌪 圆盘涡旋振荡助推!",
        subText: `剩余 ${jostleCharges} 次`,
        color: "#38bdf8",
        stroke: "#0f172a",
        alpha: 1,
        vy: -1.2,
        scale: 1.15
      });
      updateHUD();
    }

    jostleBoxBtn.addEventListener("click", triggerJostleSkill);

    function triggerGameOver() {
      isGameOver = true;
      if (currentScore > bestScore) {
        bestScore = saveBestScore(currentScore);
      }
      updateHUD();
      const topUni = UNIVERSITIES[highestLevelReached];
      if (gameOverSummary) {
        gameOverSummary.textContent = `本局得分 ${currentScore.toLocaleString()} · 历史最高 ${bestScore.toLocaleString()} · 最高合成 Lv.${highestLevelReached + 1} ${topUni.name}（共合成 ${totalMergeCount} 次）`;
      }
      if (gameOverOverlay) {
        gameOverOverlay.classList.add("is-visible");
      }
    }

    function resetGame() {
      balls = [];
      particles = [];
      shockwaves = [];
      floatingTexts = [];
      backgroundConfetti = [];
      currentScore = 0;
      bestScore = loadBestScore();
      highestLevelReached = 0;
      unlockedMask = new Set([0]);
      maxComboRecord = 1;
      totalMergeCount = 0;
      currentDropLevel = 0;
      nextDropLevel = rollRandomDropLevel();
      dropCooldown = 0;
      comboChainCount = 0;
      comboResetTimer = 0;
      jostleCharges = 3;
      deadlineOverTimer = 0;
      isGameOver = false;
      if (gameOverOverlay) {
        gameOverOverlay.classList.remove("is-visible");
      }
      refreshAtlasStates();
      updateNextPreviewUI();
      updateHUD();
    }

    document.getElementById("restartGameBtn").addEventListener("click", resetGame);
    document.getElementById("overlayRestartBtn").addEventListener("click", resetGame);

    const toggleSoundBtn = document.getElementById("toggleSoundBtn");
    toggleSoundBtn.addEventListener("click", () => {
      soundFX.enabled = !soundFX.enabled;
      toggleSoundBtn.textContent = soundFX.enabled ? "🔊 音效" : "🔇 静音";
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "e" || e.key === "E") {
        triggerJostleSkill();
      } else if (e.key === "r" || e.key === "R") {
        resetGame();
      } else if (e.key === "m" || e.key === "M") {
        toggleSoundBtn.click();
      } else if (e.key === " ") {
        e.preventDefault();
        dropCurrentBall();
      }
    });

    /* ============================================================================
       按权重随机背景图与 Live2D 上半身放大 + 点击穿透与动作反馈共存
       ============================================================================ */
    function pickWeightedBackground(list) {
      if (!Array.isArray(list) || list.length === 0) return null;
      const totalWeight = list.reduce((sum, item) => sum + (Number(item.weight) > 0 ? Number(item.weight) : 1), 0);
      let rand = Math.random() * totalWeight;
      for (const item of list) {
        const w = Number(item.weight) > 0 ? Number(item.weight) : 1;
        if (rand < w) return item;
        rand -= w;
      }
      return list[0];
    }

    function applyRandomBackground(showTip = false) {
      const chosen = pickWeightedBackground(BLOG_CONFIG.backgrounds);
      if (chosen && chosen.url) {
        document.documentElement.style.setProperty("--bg-image", `url("${chosen.url}")`);
        const label = document.getElementById("currentBgLabel");
        if (label) label.textContent = chosen.name || "切换背景";
        if (showTip) showToast(`已切换背景：${chosen.name}`);
      }
    }

    const randomBgBtn = document.getElementById("randomBgBtn");
    if (randomBgBtn) {
      randomBgBtn.addEventListener("click", () => applyRandomBackground(true));
    }

    function applyUpperBodyLive2DLayout() {
      const d = BLOG_CONFIG.live2d.display;
      const stages = document.querySelectorAll("#oml2d-stage, #live2d-widget, .live2d-widget-container");
      stages.forEach((stage) => {
        stage.style.setProperty("width", `${d.width}px`, "important");
        stage.style.setProperty("height", `${d.boxHeight}px`, "important");
        stage.style.setProperty("right", `${d.hOffset}px`, "important");
        stage.style.setProperty("bottom", `${d.vOffset}px`, "important");
        stage.style.setProperty("left", "auto", "important");
        stage.style.setProperty("top", "auto", "important");
        stage.style.setProperty("overflow", "visible", "important");
        stage.style.setProperty("clip-path", "inset(-600px -300px 0px -300px)", "important");
        stage.style.setProperty("pointer-events", "none", "important");
        stage.style.setProperty("z-index", "90", "important");
      });

      const canvases = document.querySelectorAll("#oml2d-canvas, #live2dcanvas");
      canvases.forEach((c) => {
        c.style.setProperty("transform-origin", `50% ${d.anchorY}`, "important");
        c.style.setProperty("transform", `translate(${d.shiftX}, ${d.shiftY}) scale(${d.upperZoom})`, "important");
        c.style.setProperty("pointer-events", "none", "important");
      });
    }

    function setupLive2DPassthroughForwarder() {
      if (window.__l2dPassthroughBound) return;
      window.__l2dPassthroughBound = true;

      const forwardEventToLive2D = (e) => {
        if (!e.isTrusted) return;
        const canvasEl = document.querySelector("#oml2d-canvas, #live2dcanvas");
        if (!canvasEl) return;

        const rect = canvasEl.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        const isMove = e.type === "pointermove" || e.type === "mousemove";
        const inside =
          e.clientX >= rect.left &&
          e.clientX <= rect.right &&
          e.clientY >= rect.top &&
          e.clientY <= rect.bottom;

        if (!isMove && !inside) return;

        if (typeof PointerEvent !== "undefined" && e.type.startsWith("pointer")) {
          const cloned = new PointerEvent(e.type, {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: e.clientX,
            clientY: e.clientY,
            screenX: e.screenX,
            screenY: e.screenY,
            pointerId: e.pointerId || 1,
            pointerType: e.pointerType || "mouse",
            isPrimary: true,
            button: e.button || 0,
            buttons: e.buttons || (e.type === "pointerdown" ? 1 : 0)
          });
          canvasEl.dispatchEvent(cloned);
        } else {
          const cloned = new MouseEvent(e.type, {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: e.clientX,
            clientY: e.clientY,
            screenX: e.screenX,
            screenY: e.screenY,
            button: e.button || 0,
            buttons: e.buttons || (e.type === "mousedown" ? 1 : 0)
          });
          canvasEl.dispatchEvent(cloned);
        }
      };

      ["pointerdown", "pointermove", "pointerup", "mousedown", "mousemove", "mouseup", "click"].forEach((evtName) => {
        window.addEventListener(evtName, forwardEventToLive2D, { capture: true, passive: true });
      });
    }

    function initLive2D() {
      if (!BLOG_CONFIG.live2d || !BLOG_CONFIG.live2d.enabled) return;
      const cfg = BLOG_CONFIG.live2d;
      const script = document.createElement("script");
      script.src = cfg.oml2dScriptUrl;
      script.async = true;
      script.onload = () => {
        if (window.OML2D && typeof window.OML2D.loadOml2d === "function") {
          window.OML2D.loadOml2d({
            dockedPosition: "right",
            mobileDisplay: false,
            menus: { disable: true },
            tips: { copyTips: { message: [] }, idleTips: { message: [] } },
            statusBar: { disable: true },
            models: [
              {
                path: cfg.modelJsonUrl,
                position: [0, 0],
                scale: 0.11,
                stageStyle: {
                  width: cfg.display.width,
                  height: cfg.display.boxHeight
                }
              }
            ]
          });
          setupLive2DPassthroughForwarder();
          setTimeout(applyUpperBodyLive2DLayout, 300);
          setTimeout(applyUpperBodyLive2DLayout, 1000);
          setTimeout(applyUpperBodyLive2DLayout, 2200);
        }
      };
      document.body.appendChild(script);
    }

    /* ============================================================================
       启动入口
       ============================================================================ */
    function startLoop() {
      stepPhysics();
      renderArena();
      requestAnimationFrame(startLoop);
    }

    applyRandomBackground(false);
    loadUniversityNetworkImages();
    buildAtlasDOM();
    resetGame();
    startLoop();
    initLive2D();
  </script>
</body>
