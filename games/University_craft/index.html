       网络校徽图片异步加载与圆形徽章离屏缓存 (256×256)
       加载成功后自动将真实网络校徽居中裁剪/缩放进纯白底色圆盘 + 校色外框

    const emblemSprites = [];
    const loadedImageElements = new Array(UNIVERSITIES.length).fill(null);

    function renderUniversityTokenCanvas(idx, imgEl) {
      const uni = UNIVERSITIES[idx];
      const size = 256;
      const off = emblemSprites[idx] || document.createElement("canvas");
      off.width = size;
      off.height = size;
      const c = off.getContext("2d");
      const cx = size / 2;
      const cy = size / 2;
      const R = 122;

      c.clearRect(0, 0, size, size);
      c.save();
      c.translate(cx, cy);

      // 1. 纯白圆盘底托（使得透明底或白底的网络校徽均清晰醒目）
      c.beginPath();
      c.arc(0, 0, R, 0, Math.PI * 2);
      c.fillStyle = "#ffffff";
      c.fill();

      // 2. 绘制网络校徽图像（自动按宽高比内切适配圆形区域）
      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        c.save();
        c.beginPath();
        c.arc(0, 0, R - 8, 0, Math.PI * 2);
        c.clip();

        const iw = imgEl.naturalWidth;
        const ih = imgEl.naturalHeight;
        const aspect = iw / ih;
        // 针对圆形校徽填满圆盘，针对长方形校徽（如巴黎高师、东大横版）按最大边留白内切
        const targetBox = (aspect > 1.25 || aspect < 0.8) ? (R - 18) * 1.85 : (R - 10) * 1.96;
        let dw = targetBox;
        let dh = targetBox;
        if (aspect > 1) {
          dh = targetBox / aspect;
        } else {
          dw = targetBox * aspect;
        }
        c.drawImage(imgEl, -dw / 2, -dh / 2, dw, dh);
        c.restore();
      } else {
        // 图片仍在网络请求时的占位文字
        c.fillStyle = uni.primary;
        c.font = '800 38px "Inter", "PingFang SC", sans-serif';
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText(uni.short, 0, -4);
      }

      // 3. 高校代表色金属质感双层边框
      c.beginPath();
      c.arc(0, 0, R - 3, 0, Math.PI * 2);
      c.lineWidth = 7;
      c.strokeStyle = uni.primary;
      c.stroke();

      c.beginPath();
      c.arc(0, 0, R - 8, 0, Math.PI * 2);
      c.lineWidth = 2.2;
      c.strokeStyle = uni.accent;
      c.stroke();

      // 4. 底部简洁校名小胶囊标签（方便小尺寸球体快速识别等级与学校）
      const pillW = 136;
      const pillH = 34;
      const pillY = R - 38;
      c.fillStyle = "rgba(15, 23, 42, 0.82)";
      c.strokeStyle = uni.accent;
      c.lineWidth = 2;
      c.beginPath();
      c.roundRect(-pillW / 2, pillY, pillW, pillH, 17);
      c.fill();
      c.stroke();

      c.fillStyle = "#ffffff";
      c.font = '800 20px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif';
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText(uni.short, 0, pillY + pillH / 2 + 1);

      c.restore();
      emblemSprites[idx] = off;
      return off;
    }

    /* ============================================================================
       Web Audio 学术钟声与连合和弦合成器
       ============================================================================ */
    class AcademicSoundEngine {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      playDrop() {
        if (!this.enabled) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(165, now + 0.09);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.095);
      }

      playBounce(speed) {
        if (!this.enabled || speed < 2.2) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        const freq = Math.min(240, 95 + speed * 14);
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.045);
        const vol = Math.min(0.045, speed * 0.004);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      playMerge(newLevel, combo = 1) {
        if (!this.enabled) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00];
        const baseFreq = scale[Math.min(newLevel, scale.length - 1)] * (1 + (combo - 1) * 0.04);

        const ratios = newLevel >= 9 ? [1, 1.25, 1.5, 2] : [1, 1.25, 1.5];
        ratios.forEach((ratio, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx === 0 ? "triangle" : "sine";
          const start = now + idx * 0.032;
          const dur = newLevel >= 12 ? 0.42 : 0.24;
          osc.frequency.setValueAtTime(baseFreq * ratio, start);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * ratio * 1.03, start + dur);
          gain.gain.setValueAtTime(0.11 / (idx + 1), start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + dur + 0.02);
        });
      }

      playJostle() {
        if (!this.enabled) return;
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.18);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

        return 0;

        if (score > currentBest) {

          return score;
        }
        return currentBest;
      } catch (e) {

      }
    }

    /* ============================================================================
       物理更新（每帧 8 子步，保证大球堆叠稳定不穿模）
       ============================================================================ */
    function stepPhysics() {
      if (isGameOver) return;

      if (dropCooldown > 0) dropCooldown--;
      if (comboResetTimer > 0) {
        comboResetTimer--;
        if (comboResetTimer === 0) comboChainCount = 0;
      }
      if (screenShakeMag > 0.1) {
        screenShakeMag *= 0.86;
      } else {
        screenShakeMag = 0;
      }

      const SUB_STEPS = 8;
      const GRAVITY = 0.28 / SUB_STEPS;
      const RESTITUTION = 0.24;
      const FRICTION = 0.992;

      let mergedPair = null;

      for (let step = 0; step < SUB_STEPS; step++) {
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];
          b.vy += GRAVITY;
          b.vx *= Math.pow(FRICTION, 1 / SUB_STEPS);
          b.x += b.vx / SUB_STEPS;
          b.y += b.vy / SUB_STEPS;
          b.angle += b.vAngle / SUB_STEPS;
          b.vAngle *= 0.995;

          if (b.x - b.radius < WALL_LEFT) {
            b.x = WALL_LEFT + b.radius;
            if (b.vx < 0) b.vx = -b.vx * RESTITUTION;
          } else if (b.x + b.radius > WALL_RIGHT) {
            b.x = WALL_RIGHT - b.radius;
            if (b.vx > 0) b.vx = -b.vx * RESTITUTION;
          }

          if (b.y + b.radius > FLOOR_Y) {
            b.y = FLOOR_Y - b.radius;
            if (b.vy > 1.5 && step === 0) {
              b.scaleX = 1.14;
              b.scaleY = 0.86;
              soundFX.playBounce(Math.abs(b.vy));
            }
            if (b.vy > 0) b.vy = -b.vy * RESTITUTION;
            b.vx *= 0.95;
            b.vAngle = b.vx / Math.max(b.radius, 12);
            b.hasTouched = true;
          }
        }

        for (let i = 0; i < balls.length; i++) {
          const a = balls[i];
          for (let j = i + 1; j < balls.length; j++) {
            const b = balls[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distSq = dx * dx + dy * dy;
            const minDist = a.radius + b.radius;

            if (distSq < minDist * minDist) {
              a.hasTouched = true;
              b.hasTouched = true;

              if (a.level === b.level && !mergedPair) {
                mergedPair = { idxA: i, idxB: j };
                break;
              }

              const dist = Math.sqrt(distSq) || 0.001;
              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = minDist - dist;

              const totalMass = a.mass + b.mass;
              const ratioA = b.mass / totalMass;
              const ratioB = a.mass / totalMass;

              a.x -= nx * overlap * ratioA;
              a.y -= ny * overlap * ratioA;
              b.x += nx * overlap * ratioB;
              b.y += ny * overlap * ratioB;

              const rvx = b.vx - a.vx;
              const rvy = b.vy - a.vy;
              const velAlongNormal = rvx * nx + rvy * ny;

              if (velAlongNormal < 0) {
                const jImpulse = -(1 + RESTITUTION) * velAlongNormal / (1 / a.mass + 1 / b.mass);
                const ix = jImpulse * nx;
                const iy = jImpulse * ny;
                a.vx -= ix / a.mass;
                a.vy -= iy / a.mass;
                b.vx += ix / b.mass;
                b.vy += iy / b.mass;

                const tx = -ny;
                const ty = nx;
                const tangentVel = rvx * tx + rvy * ty;
                a.vAngle -= (tangentVel * 0.015) / a.radius;
                b.vAngle += (tangentVel * 0.015) / b.radius;
              }
            }
          }
          if (mergedPair) break;
        }

        if (mergedPair) break;
      }

      if (mergedPair) {
        const a = balls[mergedPair.idxA];
        const b = balls[mergedPair.idxB];
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const currentLvl = a.level;

        balls.splice(mergedPair.idxB, 1);
        balls.splice(mergedPair.idxA, 1);

        comboChainCount++;
        comboResetTimer = 78;
        if (comboChainCount > maxComboRecord) {
          maxComboRecord = comboChainCount;
        }
        totalMergeCount++;

        const nextLvl = Math.min(UNIVERSITIES.length - 1, currentLvl + 1);
        const uni = UNIVERSITIES[nextLvl];

        const gainedScore = uni.score * comboChainCount * (currentLvl === UNIVERSITIES.length - 1 ? 2 : 1);
        currentScore += gainedScore;

        if (nextLvl > highestLevelReached) {
          highestLevelReached = nextLvl;
        }
        if (!unlockedMask.has(nextLvl)) {
          unlockedMask.add(nextLvl);
        }
        refreshAtlasStates();

        const newR = uni.radius;
        const clampedX = Math.max(WALL_LEFT + newR, Math.min(WALL_RIGHT - newR, mx));
        const clampedY = Math.min(FLOOR_Y - newR, my);

        balls.push({
          id: ballIdSeq++,
          level: nextLvl,
          x: clampedX,
          y: clampedY,
          vx: (a.vx + b.vx) * 0.35,
          vy: -1.4,
          radius: newR,
          mass: newR * newR,
          angle: 0,
          vAngle: (Math.random() - 0.5) * 0.08,
          scaleX: 1.28,
          scaleY: 0.74,
          glowAlpha: 1.0,
          hasTouched: true,
          safeFrames: 25
        });

        for (const other of balls) {
          const dx = other.x - clampedX;
          const dy = other.y - clampedY;
          const d = Math.hypot(dx, dy);
          if (d > 1 && d < newR * 2.5) {
            const push = (1 - d / (newR * 2.5)) * 2.4;
            other.vx += (dx / d) * push;
            other.vy += (dy / d) * push - 0.5;
          }
        }

        soundFX.playMerge(nextLvl, comboChainCount);
        spawnMergeEffects(clampedX, clampedY, nextLvl, comboChainCount);
        updateHUD(true);
      }

      let anyOverDeadline = false;
      for (const b of balls) {
        b.scaleX += (1 - b.scaleX) * 0.22;
        b.scaleY += (1 - b.scaleY) * 0.22;
        if (b.glowAlpha > 0) b.glowAlpha = Math.max(0, b.glowAlpha - 0.025);
        if (b.safeFrames > 0) b.safeFrames--;

        if (b.hasTouched && b.safeFrames <= 0 && b.y - b.radius < DEADLINE_Y) {
          anyOverDeadline = true;
        }
      }

      if (anyOverDeadline) {
        deadlineOverTimer++;
        if (deadlineOverTimer >= 135) {
          triggerGameOver();
        }
      } else {
        deadlineOverTimer = Math.max(0, deadlineOverTimer - 2);
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.18;
        sw.alpha -= 0.042;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.14;
        p.rot += p.vRot;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.018;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      for (let i = backgroundConfetti.length - 1; i >= 0; i--) {
        const c = backgroundConfetti[i];
        c.x += c.vx;
        c.y += c.vy;
        c.rot += c.vRot;
        c.alpha -= 0.012;
        if (c.alpha <= 0 || c.y > FLOOR_Y) backgroundConfetti.splice(i, 1);
      }
    }

    /* ============================================================================
       渲染画面
       ============================================================================ */
    function drawStar(ctx, x, y, r, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
        const a2 = a1 + Math.PI / 5;
        ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
        ctx.lineTo(Math.cos(a2) * (r * 0.45), Math.sin(a2) * (r * 0.45));
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function renderArena() {
      ctx.save();
      ctx.clearRect(0, 0, W, H);

      if (screenShakeMag > 0.2) {
        const sx = (Math.random() - 0.5) * screenShakeMag;
        const sy = (Math.random() - 0.5) * screenShakeMag;
        ctx.translate(sx, sy);
      }

      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, "rgba(248, 250, 252, 0.78)");
      bgGrad.addColorStop(1, "rgba(226, 232, 240, 0.88)");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
      ctx.lineWidth = 1;
      for (let gx = WALL_LEFT + 40; gx < WALL_RIGHT; gx += 44) {
        ctx.beginPath();
        ctx.moveTo(gx, DEADLINE_Y);
        ctx.lineTo(gx, FLOOR_Y);
        ctx.stroke();
      }
      for (let gy = DEADLINE_Y + 40; gy < FLOOR_Y; gy += 44) {
        ctx.beginPath();
        ctx.moveTo(WALL_LEFT, gy);
        ctx.lineTo(WALL_RIGHT, gy);
        ctx.stroke();
      }

      ctx.strokeStyle = "rgba(37, 99, 235, 0.38)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(WALL_LEFT, DEADLINE_Y - 12);
      ctx.lineTo(WALL_LEFT, FLOOR_Y);
      ctx.lineTo(WALL_RIGHT, FLOOR_Y);
      ctx.lineTo(WALL_RIGHT, DEADLINE_Y - 12);
      ctx.stroke();

      const warnRatio = Math.min(1, deadlineOverTimer / 135);
      ctx.save();
      ctx.setLineDash([7, 6]);
      ctx.strokeStyle = warnRatio > 0
        ? `rgba(220, 38, 38, ${0.55 + 0.45 * Math.sin(Date.now() * 0.015)})`
        : "rgba(239, 68, 68, 0.38)";
      ctx.lineWidth = warnRatio > 0 ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.moveTo(WALL_LEFT + 4, DEADLINE_Y);
      ctx.lineTo(WALL_RIGHT - 4, DEADLINE_Y);
      ctx.stroke();
      if (warnRatio > 0.1) {
        ctx.fillStyle = "#dc2626";
        ctx.font = '700 11px "JetBrains Mono", monospace';
        ctx.fillText(`⚠ 培养皿即将溢出 ${(100 - warnRatio * 100).toFixed(0)}%`, WALL_LEFT + 12, DEADLINE_Y - 6);
      }
      ctx.restore();

      if (!isGameOver && dropCooldown <= 4) {
        const previewUni = UNIVERSITIES[currentDropLevel];
        const dropX = clampDropX(pointerX, currentDropLevel);

        ctx.save();
        ctx.setLineDash([4, 5]);
        ctx.strokeStyle = previewUni.primary + "88";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(dropX, DROP_Y + previewUni.radius);
        ctx.lineTo(dropX, FLOOR_Y - 4);
        ctx.stroke();
        ctx.restore();

        const r = previewUni.radius;
        ctx.save();
        ctx.translate(dropX, DROP_Y);
        ctx.drawImage(emblemSprites[currentDropLevel], -r, -r, r * 2, r * 2);
        ctx.restore();
      }

      for (const c of backgroundConfetti) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, c.alpha);
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }

      for (const b of balls) {
        const uni = UNIVERSITIES[b.level];
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(b.scaleX, b.scaleY);

        if (b.y + b.radius > FLOOR_Y - 10) {
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.16)";
          ctx.beginPath();
          ctx.ellipse(0, b.radius - 2, b.radius * 0.72, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (b.glowAlpha > 0.02) {
          ctx.save();
          ctx.globalAlpha = b.glowAlpha;
          ctx.strokeStyle = uni.accent;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(0, 0, b.radius + 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        ctx.rotate(b.angle);
        ctx.drawImage(emblemSprites[b.level], -b.radius, -b.radius, b.radius * 2, b.radius * 2);
        ctx.restore();
      }

      for (const sw of shockwaves) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = sw.lineWidth;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = sw.secondaryColor;
        ctx.lineWidth = sw.lineWidth * 0.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r * 0.78, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        if (p.shape === "star") {
          drawStar(ctx, p.x, p.y, p.size * 1.35, p.rot);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.translate(ft.x, ft.y);
        ctx.scale(ft.scale, ft.scale);
        ctx.font = '800 13px "Inter", "PingFang SC", sans-serif';
        ctx.textAlign = "center";
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = ft.stroke;
        ctx.strokeText(ft.text, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(ft.text, 0, 0);

        ctx.font = '800 11px "JetBrains Mono", monospace';
        ctx.strokeText(ft.subText, 0, 15);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.subText, 0, 15);
        ctx.restore();
      }

      ctx.restore();
    }

    /* ============================================================================
       交互控制与顶部按钮事件
       ============================================================================ */
    function showToast(msg) {
      const toast = document.getElementById("toastNotice");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("is-visible");
      clearTimeout(window.__uniToastTimer);
      window.__uniToastTimer = setTimeout(() => {
        toast.classList.remove("is-visible");
      }, 2200);
    }

    function updatePointerFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      if (typeof clientX === "number") {
        pointerX = clampDropX((clientX - rect.left) * scaleX, currentDropLevel);
      }
    }

    canvas.addEventListener("pointermove", (e) => {
      updatePointerFromEvent(e);
    });

    canvas.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      updatePointerFromEvent(e);
      dropCurrentBall();
    });

    function triggerJostleSkill() {
      if (isGameOver || jostleCharges <= 0 || balls.length === 0) return;
      jostleCharges--;
      screenShakeMag = 8;
      soundFX.playJostle();
      for (const b of balls) {
        b.vx += (Math.random() - 0.5) * 6.5;
        b.vy -= 2.2 + Math.random() * 2.4;
        b.scaleX = 0.88;
        b.scaleY = 1.12;
      }
      floatingTexts.push({
        x: W / 2,
        y: H / 2,
        text: "🌪 培养皿振荡助推!",
        subText: `剩余 ${jostleCharges} 次`,
        color: "#38bdf8",
        stroke: "#0f172a",
        alpha: 1,
        vy: -1.2,
        scale: 1.15
      });
      updateHUD();
    }

    jostleBoxBtn.addEventListener("click", triggerJostleSkill);

    function triggerGameOver() {
      isGameOver = true;
      if (currentScore > bestScore) {
        bestScore = saveBestScore(currentScore);
      }
      updateHUD();
      const topUni = UNIVERSITIES[highestLevelReached];
      if (gameOverSummary) {
        gameOverSummary.textContent = `本局得分 ${currentScore.toLocaleString()} · 历史最高 ${bestScore.toLocaleString()} · 最高合成 Lv.${highestLevelReached + 1} ${topUni.name}（共合成 ${totalMergeCount} 次）`;
      }
      if (gameOverOverlay) {
        gameOverOverlay.classList.add("is-visible");
      }
    }

    function resetGame() {
      balls = [];
      particles = [];
      shockwaves = [];
      floatingTexts = [];
      backgroundConfetti = [];
      currentScore = 0;
      bestScore = loadBestScore();
      highestLevelReached = 0;
      unlockedMask = new Set([0]);
      maxComboRecord = 1;
      totalMergeCount = 0;
      currentDropLevel = 0;
      nextDropLevel = rollRandomDropLevel();
      dropCooldown = 0;
      comboChainCount = 0;
      comboResetTimer = 0;
      jostleCharges = 3;
      deadlineOverTimer = 0;
      isGameOver = false;
      if (gameOverOverlay) {
        gameOverOverlay.classList.remove("is-visible");
      }
      refreshAtlasStates();
      updateNextPreviewUI();
      updateHUD();
    }

    document.getElementById("restartGameBtn").addEventListener("click", resetGame);
    document.getElementById("overlayRestartBtn").addEventListener("click", resetGame);

    const toggleSoundBtn = document.getElementById("toggleSoundBtn");
    toggleSoundBtn.addEventListener("click", () => {
      soundFX.enabled = !soundFX.enabled;
      toggleSoundBtn.textContent = soundFX.enabled ? "🔊 音效" : "🔇 静音";
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "e" || e.key === "E") {
        triggerJostleSkill();
      } else if (e.key === "r" || e.key === "R") {
        resetGame();
      } else if (e.key === "m" || e.key === "M") {
        toggleSoundBtn.click();
      } else if (e.key === " ") {
        e.preventDefault();
        dropCurrentBall();
      }
    });

    /* ============================================================================
       按权重随机背景图与 Live2D 上半身放大 + 点击穿透与动作反馈共存
       ============================================================================ */
    function pickWeightedBackground(list) {
      if (!Array.isArray(list) || list.length === 0) return null;
      const totalWeight = list.reduce((sum, item) => sum + (Number(item.weight) > 0 ? Number(item.weight) : 1), 0);
      let rand = Math.random() * totalWeight;
      for (const item of list) {
        const w = Number(item.weight) > 0 ? Number(item.weight) : 1;
        if (rand < w) return item;
        rand -= w;
      }
      return list[0];
    }

    function applyRandomBackground(showTip = false) {
      const chosen = pickWeightedBackground(BLOG_CONFIG.backgrounds);
      if (chosen && chosen.url) {
        document.documentElement.style.setProperty("--bg-image", `url("${chosen.url}")`);
        const label = document.getElementById("currentBgLabel");
        if (label) label.textContent = chosen.name || "切换背景";
        if (showTip) showToast(`已切换背景：${chosen.name}`);
      }
    }

    const randomBgBtn = document.getElementById("randomBgBtn");
    if (randomBgBtn) {
      randomBgBtn.addEventListener("click", () => applyRandomBackground(true));
    }

    function applyUpperBodyLive2DLayout() {
      const d = BLOG_CONFIG.live2d.display;
      const stages = document.querySelectorAll("#oml2d-stage, #live2d-widget, .live2d-widget-container");
      stages.forEach((stage) => {
        stage.style.setProperty("width", `${d.width}px`, "important");
        stage.style.setProperty("height", `${d.boxHeight}px`, "important");
        stage.style.setProperty("right", `${d.hOffset}px`, "important");
        stage.style.setProperty("bottom", `${d.vOffset}px`, "important");
        stage.style.setProperty("left", "auto", "important");
        stage.style.setProperty("top", "auto", "important");
        stage.style.setProperty("overflow", "visible", "important");
        stage.style.setProperty("clip-path", "inset(-600px -300px 0px -300px)", "important");
        stage.style.setProperty("pointer-events", "none", "important");
        stage.style.setProperty("z-index", "90", "important");
      });

      const canvases = document.querySelectorAll("#oml2d-canvas, #live2dcanvas");
      canvases.forEach((c) => {
        c.style.setProperty("transform-origin", `50% ${d.anchorY}`, "important");
        c.style.setProperty("transform", `translate(${d.shiftX}, ${d.shiftY}) scale(${d.upperZoom})`, "important");
        c.style.setProperty("pointer-events", "none", "important");
      });
    }

    function setupLive2DPassthroughForwarder() {
      if (window.__l2dPassthroughBound) return;
      window.__l2dPassthroughBound = true;

      const forwardEventToLive2D = (e) => {
        if (!e.isTrusted) return;
        const canvasEl = document.querySelector("#oml2d-canvas, #live2dcanvas");
        if (!canvasEl) return;

        const rect = canvasEl.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        const isMove = e.type === "pointermove" || e.type === "mousemove";
        const inside =
          e.clientX >= rect.left &&
          e.clientX <= rect.right &&
          e.clientY >= rect.top &&
          e.clientY <= rect.bottom;

        if (!isMove && !inside) return;

        if (typeof PointerEvent !== "undefined" && e.type.startsWith("pointer")) {
          const cloned = new PointerEvent(e.type, {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: e.clientX,
            clientY: e.clientY,
            screenX: e.screenX,
            screenY: e.screenY,
            pointerId: e.pointerId || 1,
            pointerType: e.pointerType || "mouse",
            isPrimary: true,
            button: e.button || 0,
            buttons: e.buttons || (e.type === "pointerdown" ? 1 : 0)
          });
          canvasEl.dispatchEvent(cloned);
        } else {
          const cloned = new MouseEvent(e.type, {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: e.clientX,
            clientY: e.clientY,
            screenX: e.screenX,
            screenY: e.screenY,
            button: e.button || 0,
            buttons: e.buttons || (e.type === "mousedown" ? 1 : 0)
          });
          canvasEl.dispatchEvent(cloned);
        }
      };

      ["pointerdown", "pointermove", "pointerup", "mousedown", "mousemove", "mouseup", "click"].forEach((evtName) => {
        window.addEventListener(evtName, forwardEventToLive2D, { capture: true, passive: true });
      });
    }

    function initLive2D() {
      if (!BLOG_CONFIG.live2d || !BLOG_CONFIG.live2d.enabled) return;
      const cfg = BLOG_CONFIG.live2d;
      const script = document.createElement("script");
      script.src = cfg.oml2dScriptUrl;
      script.async = true;
      script.onload = () => {
        if (window.OML2D && typeof window.OML2D.loadOml2d === "function") {
          window.OML2D.loadOml2d({
            dockedPosition: "right",
            mobileDisplay: false,
            menus: { disable: true },
            tips: { copyTips: { message: [] }, idleTips: { message: [] } },
            statusBar: { disable: true },
            models: [
              {
                path: cfg.modelJsonUrl,
                position: [0, 0],
                scale: 0.11,
                stageStyle: {
                  width: cfg.display.width,
                  height: cfg.display.boxHeight
                }
              }
            ]
          });
          setupLive2DPassthroughForwarder();
          setTimeout(applyUpperBodyLive2DLayout, 300);
          setTimeout(applyUpperBodyLive2DLayout, 1000);
          setTimeout(applyUpperBodyLive2DLayout, 2200);
        }
      };
      document.body.appendChild(script);
    }

    /* ============================================================================
       启动入口
       ============================================================================ */
    function startLoop() {
      stepPhysics();
      renderArena();
      requestAnimationFrame(startLoop);
    }

    applyRandomBackground(false);
    buildAtlasDOM();
    loadUniversityNetworkImages();
    resetGame();
    startLoop();
    initLive2D();
  </script>
</body>
