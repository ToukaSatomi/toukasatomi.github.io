        const tierObj = getCurrentWeaponTierObj();
        const lv = tierObj.level;

        // 中后期 Lv.4+ 浮游光剑绘制
        if (lv >= 4 && !isGameOver) {
          const bladeCount = lv >= 6 ? 4 : 2;
          for (let i = 0; i < bladeCount; i++) {
            const bl = player.bitBlades[i];
            ctx.save();
            ctx.translate(bl.x, bl.y);
            ctx.rotate(bl.angle * 2);
            ctx.fillStyle = "#f472b6";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(0, -11);
            ctx.lineTo(5, 0);
            ctx.lineTo(0, 11);
            ctx.lineTo(-5, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }

        // 终局 Lv.7 驻场星彩浮游炮塔绘制
        if (lv >= 7 && !isGameOver) {
          player.prismTurrets.forEach(function (tu) {
            ctx.save();
            ctx.translate(tu.x, tu.y);
            ctx.rotate(tu.angle + Math.PI / 2);
            ctx.fillStyle = tu.color;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(8, 7);
            ctx.lineTo(-8, 7);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          });
        }

        ctx.save();
        ctx.translate(player.x, player.y);

        if (player.hyperTimer > 0) {
          ctx.save();
          ctx.rotate(frameTick * 0.04);
          ctx.strokeStyle = "rgba(250, 204, 21, 0.55)";
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 6]);
          ctx.beginPath();
          ctx.arc(0, 0, 115, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        if (player.invincibleTimer % 6 < 4) {
          const flameLen = 12 + Math.sin(frameTick * 0.65) * 4;
          ctx.fillStyle = player.hyperTimer > 0 ? "#facc15" : tierObj.primaryColor;
          ctx.beginPath();
          ctx.moveTo(-6, 10);
          ctx.lineTo(-3, 10 + flameLen);
          ctx.lineTo(0, 10);
          ctx.moveTo(0, 10);
          ctx.lineTo(3, 10 + flameLen);
          ctx.lineTo(6, 10);
          ctx.fill();

          const jetGrad = ctx.createLinearGradient(0, -17, 0, 14);
          jetGrad.addColorStop(0, player.hyperTimer > 0 ? "#facc15" : tierObj.primaryColor);
          jetGrad.addColorStop(1, tierObj.secondaryColor);
          ctx.fillStyle = jetGrad;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(0, -17);
          ctx.lineTo(-15, 11);
          ctx.lineTo(-4, 7);
          ctx.lineTo(0, 13);
          ctx.lineTo(4, 7);
          ctx.lineTo(15, 11);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          if (lv >= 2) {
            const dOff = player.focusMode ? 20 : 32;
            [-dOff, dOff].forEach(function (ox) {
              ctx.fillStyle = tierObj.droneColor;
              ctx.beginPath();
              ctx.arc(ox, 4, 4.8, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 1.3;
              ctx.stroke();
            });
          }
        }

        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, player.coreRadius + 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (player.focusMode) {
          ctx.strokeStyle = "rgba(56, 189, 248, 0.58)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(0, 0, player.grazeRadius, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        for (let i = 0; i < enemyBullets.length; i++) {
          const b = enemyBullets[i];
          ctx.save();
          ctx.fillStyle = b.color;
          ctx.strokeStyle = b.color;

          if (b.shape === "rice") {
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rot);
            ctx.beginPath();
            ctx.ellipse(0, 0, b.r * 1.55, b.r * 0.78, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.ellipse(0, 0, b.r * 0.85, b.r * 0.38, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (b.shape === "star") {
            drawFourPointStar(ctx, b.x, b.y, b.r * 1.7, b.rot);
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2);
            ctx.fill();
          } else if (b.shape === "ring") {
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.38, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.52, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        if (debrisShards.length > 0) {
          const nextDS = [];
          for (let i = 0; i < debrisShards.length; i++) {
            const ds = debrisShards[i];
            ds.x += ds.vx;
            ds.y += ds.vy;
            ds.vy += 0.09;
            ds.rot += ds.vRot;
            ds.alpha -= 0.032;
            if (ds.alpha > 0.02) {
              ctx.save();
              ctx.globalAlpha = ds.alpha;
              ctx.translate(ds.x, ds.y);
              ctx.rotate(ds.rot);
              ctx.fillStyle = ds.color;
              ctx.beginPath();
              ctx.moveTo(0, -ds.size);
              ctx.lineTo(ds.size * 0.85, ds.size * 0.7);
              ctx.lineTo(-ds.size * 0.85, ds.size * 0.7);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
              nextDS.push(ds);
            }
          }
          debrisShards = nextDS;
        }

        if (damagePopups.length > 0) {
          const nextDP = [];
          for (let i = 0; i < damagePopups.length; i++) {
            const dp = damagePopups[i];
            dp.x += dp.vx;
            dp.y += dp.vy;
            dp.alpha -= 0.038;
            if (dp.alpha > 0.02) {
              ctx.save();
              ctx.globalAlpha = dp.alpha;
              ctx.font = "800 " + dp.size + "px " + getComputedStyle(document.body).fontFamily;
              ctx.textAlign = "center";
              ctx.fillStyle = dp.color;
              ctx.fillText(dp.text, dp.x, dp.y);
              ctx.restore();
              nextDP.push(dp);
            }
          }
          damagePopups = nextDP;
        }

        if (floatingLabels.length > 0) {
          const nextL = [];
          for (let i = 0; i < floatingLabels.length; i++) {
            const fl = floatingLabels[i];
            fl.y -= 0.95;
            fl.alpha -= 0.018;
            if (fl.alpha > 0.02) {
              ctx.save();
              ctx.globalAlpha = fl.alpha;
              ctx.font = "800 " + (fl.size || 14) + "px " + getComputedStyle(document.body).fontFamily;
              ctx.textAlign = "center";
              ctx.strokeStyle = "rgba(15, 23, 42, 0.92)";
              ctx.lineWidth = 3.2;
              ctx.fillStyle = fl.color;
              ctx.strokeText(fl.text, fl.x, fl.y);
              ctx.fillText(fl.text, fl.x, fl.y);
              ctx.restore();
              nextL.push(fl);
            }
          }
          floatingLabels = nextL;
        }

        if (spellBannerTimer > 0) {
          const alpha = Math.min(1, spellBannerTimer / 30);
          ctx.save();
          ctx.globalAlpha = alpha * 0.92;
          const grad = ctx.createLinearGradient(0, 48, W, 48);
          grad.addColorStop(0, "rgba(15, 23, 42, 0)");
          grad.addColorStop(0.2, "rgba(236, 72, 153, 0.78)");
          grad.addColorStop(0.8, "rgba(37, 99, 235, 0.78)");
          grad.addColorStop(1, "rgba(15, 23, 42, 0)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 42, W, 28);

          ctx.fillStyle = "#ffffff";
          ctx.font = "800 14px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "center";
          ctx.fillText("✦ SPELL CARD · " + spellBannerText + " ✦", W / 2, 61);
          ctx.restore();
        }

        // 底部前、中、后期七阶武器进化路线进度条
        const barW = 756;
        const startX = (W - barW) / 2;
        const itemW = 104;
        const itemH = 22;
        const barY = H - 27;
        WEAPON_TIERS.forEach(function (wt, idx) {
          const unlocked = lv >= wt.level;
          const isCurrent = lv === wt.level;
          const bx = startX + idx * 108;
          ctx.save();
          ctx.fillStyle = isCurrent
            ? "rgba(30, 41, 59, 0.94)"
            : (unlocked ? "rgba(15, 23, 42, 0.78)" : "rgba(15, 23, 42, 0.45)");
          ctx.strokeStyle = isCurrent
            ? wt.primaryColor
            : (unlocked ? "rgba(56, 189, 248, 0.45)" : "rgba(148, 163, 184, 0.22)");
          ctx.lineWidth = isCurrent ? 1.8 : 1;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(bx, barY, itemW, itemH, 7) : ctx.rect(bx, barY, itemW, itemH);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = isCurrent
            ? wt.primaryColor
            : (unlocked ? "rgba(226, 232, 240, 0.85)" : "rgba(148, 163, 184, 0.45)");
          ctx.font = (isCurrent ? "800 " : "600 ") + "10.5px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(wt.shortName, bx + itemW / 2, barY + itemH / 2 + 0.5);
          ctx.restore();
        });

        if (screenFlashAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = screenFlashAlpha;
          ctx.fillStyle = screenFlashColor;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }

        ctx.restore();
      }

      function mainLoop() {
        updateGameFrame();
        renderScene();
        requestAnimationFrame(mainLoop);
      }

      function startNewGame() {
        score = 0;
        grazeCount = 0;
        killChain = 0;
        killChainTimer = 0;
        frameTick = 0;
        lastWaveSpawnTick = 0;
        sortieFramesRemaining = SORTIE_DURATION_FRAMES;
        stageWave = 1;
        lastAnnouncedRankTier = 1;
        isPaused = false;
        isGameOver = false;
        isMouseLeftHeld = false;
        screenShake = 0;
        screenFlashAlpha = 0;
        hitStopFrames = 0;
        spellBannerTimer = 0;
        pauseGameBtn.textContent = "⏸ 暂停";

        player.x = W / 2;
        player.y = H - 66;
        player.targetX = null;
        player.targetY = null;
        player.hp = 6;
        player.bombs = 4;
        player.powerExp = 0;
        player.hyperGauge = 0;
        player.hyperTimer = 0;
        player.overclockTimer = 0;
        player.invincibleTimer = 80;
        player.laserActiveFrames = 0;
        player.prismTurrets = [];

        playerBullets = [];
        singularityWells = [];
        plasmaFields = [];
        enemyBullets = [];
        enemyLasers = [];
        enemies = [];
        drops = [];
        particles = [];
        fireballs = [];
        debrisShards = [];
        shockwaves = [];
        slashArcs = [];
        lightningArcs = [];
        damagePopups = [];
        floatingLabels = [];
        wingTrails = [];
        currentBoss = null;

        gameOverOverlay.classList.remove("is-visible");
        updateHud(false);
      }

      // 全鼠标控制系统：移动鼠标飞行，按住左键精密聚能集火，双击左键手动开启觉醒，点击右键释放 EMP 脉冲
      function syncPointerToCanvas(e) {
        const rect = canvas.getBoundingClientRect();
        const sx = W / rect.width;
        const sy = H / rect.height;
        const cx = (e.clientX - rect.left) * sx;
        const cy = (e.clientY - rect.top) * sy;
        player.targetX = cx;
        player.targetY = cy;
      }

      canvas.addEventListener("pointermove", function (e) {
        if (isPaused || isGameOver) return;
        syncPointerToCanvas(e);
      });

      canvas.addEventListener("pointerdown", function (e) {
        if (isPaused || isGameOver) return;
        if (e.button === 2) {
          e.preventDefault();
          triggerEmpBomb(false);
        } else if (e.button === 0) {
          isMouseLeftHeld = true;
          syncPointerToCanvas(e);
        }
      });

      window.addEventListener("pointerup", function (e) {
        if (e.button === 0) {
          isMouseLeftHeld = false;
        }
      });

      canvas.addEventListener("dblclick", function (e) {
        e.preventDefault();
        activateHyperAwakening(false);
      });

      canvas.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });

      window.addEventListener("keydown", function (e) {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        keys[e.key] = true;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
          e.preventDefault();
        }
        if (e.key === " " || e.key === "x" || e.key === "X" || e.key === "k" || e.key === "K") {
          triggerEmpBomb(false);
        } else if (e.key === "f" || e.key === "F") {
          activateHyperAwakening(false);
        } else if (e.key === "p" || e.key === "P") {
          isPaused = !isPaused;
          pauseGameBtn.textContent = isPaused ? "▶ 继续" : "⏸ 暂停";
        } else if (e.key === "r" || e.key === "R") {
          startNewGame();
        } else if (e.key === "m" || e.key === "M") {
          soundEnabled = !soundEnabled;
          toggleSoundBtn.textContent = soundEnabled ? "🔊" : "🔇";
        }
      });

      window.addEventListener("keyup", function (e) {
        keys[e.key] = false;
      });

      hyperAwakenBtn.addEventListener("click", function () {
        activateHyperAwakening(false);
      });
      empBombBtn.addEventListener("click", function () {
        triggerEmpBomb(false);
      });
      pauseGameBtn.addEventListener("click", function () {
        isPaused = !isPaused;
        pauseGameBtn.textContent = isPaused ? "▶ 继续" : "⏸ 暂停";
      });
      restartGameBtn.addEventListener("click", function () {
        startNewGame();
        showToast("已重新出击");
      });
      overlayRestartBtn.addEventListener("click", startNewGame);
      toggleSoundBtn.addEventListener("click", function () {
        soundEnabled = !soundEnabled;
        toggleSoundBtn.textContent = soundEnabled ? "🔊" : "🔇";
      });

      const randomBgBtn = document.getElementById("randomBgBtn");
      const currentBgLabel = document.getElementById("currentBgLabel");

      function pickWeightedBackground(showMsg) {
        const pool = (BLOG_CONFIG.backgrounds || []).filter(function (item) {
          return item && item.url && Number(item.weight) > 0;
        });
        if (pool.length === 0) return;

        const totalWeight = pool.reduce(function (sum, item) {
          return sum + Number(item.weight);
        }, 0);

        let rand = Math.random() * totalWeight;
        let chosen = pool[0];
        for (let i = 0; i < pool.length; i++) {
          rand -= Number(pool[i].weight);
          if (rand <= 0) {
            chosen = pool[i];
            break;
          }
        }

        document.documentElement.style.setProperty("--bg-image", 'url("' + chosen.url + '")');
        const pct = Math.round((Number(chosen.weight) / totalWeight) * 100);
        if (currentBgLabel) {
          currentBgLabel.textContent = chosen.name;
        }
        if (showMsg) {
          showToast("已切换背景：「" + chosen.name + "」(" + pct + "% 权重)");
        }
      }

      pickWeightedBackground(false);
      randomBgBtn.addEventListener("click", function () {
        pickWeightedBackground(true);
      });

      function loadExternalScript(src) {
        return new Promise(function (resolve, reject) {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }

      function applyLive2DUpperBodyZoom(disp) {
        const boxW = (disp.width || 280) + "px";
        const boxH = (disp.boxHeight || 300) + "px";
        const zoom = Number(disp.upperZoom) > 0 ? Number(disp.upperZoom) : 2.25;
        const anchorY = disp.anchorY || "0%";
        const shiftX = typeof disp.shiftX === "number" ? (disp.shiftX + "px") : (disp.shiftX || "10px");
        const shiftY = typeof disp.shiftY === "number" ? (disp.shiftY + "px") : (disp.shiftY || "20px");

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty("--live2d-box-width", boxW);
        rootStyle.setProperty("--live2d-box-height", boxH);
        rootStyle.setProperty("--live2d-zoom", String(zoom));
        rootStyle.setProperty("--live2d-anchor-y", anchorY);
        rootStyle.setProperty("--live2d-shift-x", shiftX);
        rootStyle.setProperty("--live2d-shift-y", shiftY);

        function syncDomStyles() {
          const stages = document.querySelectorAll("#oml2d-stage, .oml2d-stage, #live2d-widget, .live2d-widget-container");
          stages.forEach(function (st) {
            st.style.setProperty("position", "fixed", "important");
            st.style.setProperty("right", (typeof disp.hOffset === "number" ? disp.hOffset : 12) + "px", "important");
            st.style.setProperty("bottom", (typeof disp.vOffset === "number" ? disp.vOffset : 0) + "px", "important");
            st.style.setProperty("left", "auto", "important");
            st.style.setProperty("top", "auto", "important");
            st.style.setProperty("width", boxW, "important");
            st.style.setProperty("height", boxH, "important");
            st.style.setProperty("overflow", "visible", "important");
            st.style.setProperty("clip-path", "inset(-600px -300px 0px -300px)", "important");
            st.style.setProperty("pointer-events", "none", "important");
          });

          const canvases = document.querySelectorAll("#oml2d-canvas, #oml2d-stage canvas, #live2dcanvas, #live2d-widget canvas");
          canvases.forEach(function (cvs) {
            cvs.style.setProperty("transform-origin", "50% " + anchorY, "important");
            cvs.style.setProperty("transform", "translate(" + shiftX + ", " + shiftY + ") scale(" + zoom + ")", "important");
            cvs.style.setProperty("pointer-events", "none", "important");
          });
        }

        syncDomStyles();
        if (!window.__l2dPassthroughBound) {
          window.__l2dPassthroughBound = true;
          function forwardToLive2DCanvas(e, eventType, isPointer) {
            if (e.__fromL2dPassthrough) return;
            const cvs = document.querySelector("#oml2d-canvas, #oml2d-stage canvas, #live2dcanvas, #live2d-widget canvas");
            if (!cvs) return;
            const rect = cvs.getBoundingClientRect();
            const inside = (
              e.clientX >= rect.left &&
              e.clientX <= rect.right &&
              e.clientY >= rect.top &&
              e.clientY <= rect.bottom
            );
            if (!inside && eventType !== "pointermove" && eventType !== "mousemove" && eventType !== "pointerup" && eventType !== "mouseup") {
              return;
            }
            try {
              const initOpts = {
                clientX: e.clientX,
                clientY: e.clientY,
                screenX: e.screenX,
                screenY: e.screenY,
                button: e.button || 0,
                buttons: e.buttons || (eventType === "pointerdown" || eventType === "mousedown" ? 1 : 0),
                bubbles: true,
                cancelable: true,
                view: window
              };
              let evt;
              if (isPointer && typeof PointerEvent === "function") {
                initOpts.pointerId = e.pointerId || 1;
                initOpts.pointerType = e.pointerType || "mouse";
                initOpts.isPrimary = e.isPrimary !== false;
                evt = new PointerEvent(eventType, initOpts);
              } else {
                evt = new MouseEvent(eventType, initOpts);
              }
              evt.__fromL2dPassthrough = true;
              cvs.dispatchEvent(evt);
            } catch (err) {}
          }

          ["pointerdown", "pointermove", "pointerup"].forEach(function (type) {
            window.addEventListener(type, function (e) {
              forwardToLive2DCanvas(e, type, true);
            }, { passive: true, capture: true });
          });

          ["mousedown", "mousemove", "mouseup", "click"].forEach(function (type) {
            window.addEventListener(type, function (e) {
              forwardToLive2DCanvas(e, type, false);
            }, { passive: true, capture: true });
          });
        }
        let count = 0;
        const timer = setInterval(function () {
          syncDomStyles();
          count++;
          if (count > 40) clearInterval(timer);
        }, 180);
      }

      async function initLive2D() {
        const cfg = BLOG_CONFIG.live2d;
        if (!cfg || !cfg.enabled || !cfg.modelJsonUrl) return;
        const disp = cfg.display || {};
        const mob = cfg.mobile || {};
        const react = cfg.react || {};

        applyLive2DUpperBodyZoom(disp);

        try {
          if (cfg.engine === "oml2d") {
            await loadExternalScript(cfg.oml2dScriptUrl || "https://cdn.jsdelivr.net/npm/oh-my-live2d@latest/dist/index.min.js");
            if (window.OML2D && typeof window.OML2D.loadOml2d === "function") {
              const omlInstance = window.OML2D.loadOml2d({
                dockedPosition: "right",
                menus: { disable: true },
                tips: { disable: true },
                statusBar: { disable: true },
                models: [
                  {
                    path: cfg.modelJsonUrl,
                    stageStyle: {
                      width: disp.width || 280,
                      height: disp.boxHeight || 300
                    }
                  }
                ]
              });
              if (omlInstance && typeof omlInstance.onLoad === "function") {
                omlInstance.onLoad(function () {
                  applyLive2DUpperBodyZoom(disp);
                });
              }
            }
          } else {
            await loadExternalScript(cfg.scriptUrl || "https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js");
            if (window.L2Dwidget && typeof window.L2Dwidget.init === "function") {
              window.L2Dwidget.init({
                model: { jsonPath: cfg.modelJsonUrl, scale: disp.scale || 1 },
                display: {
                  position: disp.position || "right",
                  width: disp.width || 280,
                  height: disp.boxHeight || 300,
                  hOffset: typeof disp.hOffset === "number" ? disp.hOffset : 12,
                  vOffset: typeof disp.vOffset === "number" ? disp.vOffset : 0
                },
                mobile: { show: mob.show !== false, scale: mob.scale || 0.6 },
                react: { opacityDefault: react.opacityDefault || 0.95, opacityOnHover: react.opacityOnHover || 1 }
              });
            }
          }
          applyLive2DUpperBodyZoom(disp);
        } catch (e) {}
      }

      initLive2D();
      startNewGame();
      requestAnimationFrame(mainLoop);
    })();
  </script>
</body>
