      function playTone(freq, duration, type, gainVal, delaySec, slideToFreq) {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
          const start = audioCtx.currentTime + (delaySec || 0);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, start);
          if (slideToFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideToFreq, start + duration);
          }
          gain.gain.setValueAtTime(gainVal || 0.08, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + duration);
        } catch (e) {}
      }

      let bestScore = Number(localStorage.getItem(STORAGE_KEY_BEST) || localStorage.getItem("tm_sharweek_sky_danmaku_best_v1") || 0);
      let grazeCount = 0;
      let killChain = 0;
      let killChainTimer = 0;
      let frameTick = 0;
      let lastWaveSpawnTick = 0;
      let sortieFramesRemaining = SORTIE_DURATION_FRAMES;
      let stageWave = 1;
      let lastAnnouncedRankTier = 1;
      let isPaused = false;
      let isGameOver = false;
      let screenShake = 0;
      let screenFlashAlpha = 0;
      let screenFlashColor = "#38bdf8";
      let hitStopFrames = 0;
      let spellBannerTimer = 0;
      let spellBannerText = "";
      let isMouseLeftHeld = false;

      const player = {
        x: W / 2,
        y: H - 66,
        targetX: null,
        targetY: null,
        coreRadius: 2.3,
        grazeRadius: 24,
        hp: 6,
        maxHp: 6,
        bombs: 4,
        powerExp: 0,         // 0..45 驱动 Lv.1 ~ Lv.7 前中后期武器自动进化
        hyperGauge: 0,       // 满 100 自动开启 HYPER 觉醒（也可双击或按 F 提前开启）
        hyperTimer: 0,
        overclockTimer: 0,
        invincibleTimer: 0,
        focusMode: false,
        laserActiveFrames: 0,
        bitBlades: [
          { x: W / 2 - 36, y: H - 70, angle: 0 },
          { x: W / 2 + 36, y: H - 70, angle: Math.PI },
          { x: W / 2 - 20, y: H - 90, angle: Math.PI * 0.5 },
          { x: W / 2 + 20, y: H - 90, angle: Math.PI * 1.5 }
        ],
        prismTurrets: []
      };

      const keys = {};
      let playerBullets = [];
      let singularityWells = [];
      let plasmaFields = [];
      let enemyBullets = [];
      let enemyLasers = [];
      let enemies = [];
      let drops = [];
      let particles = [];
      let fireballs = [];
      let debrisShards = [];
      let shockwaves = [];
      let slashArcs = [];
      let lightningArcs = [];
      let damagePopups = [];
      let floatingLabels = [];
      let wingTrails = [];
      let currentBoss = null;

      function getCurrentWeaponTierObj() {
        let chosen = WEAPON_TIERS[0];
        for (let i = 0; i < WEAPON_TIERS.length; i++) {
          if (player.powerExp >= WEAPON_TIERS[i].minExp) {
            chosen = WEAPON_TIERS[i];
          }
        }
        return chosen;
      }

      function getWeaponTierLevel() {
        return getCurrentWeaponTierObj().level;
      }

      function getDynamicRank() {
        const powerFactor = player.powerExp * 0.024;
        const scoreFactor = score / 16000;
        const chainFactor = Math.min(0.32, killChain * 0.014) + Math.min(0.18, grazeCount * 0.0018);
        const waveFactor = (stageWave - 1) * 0.25;
        const survivalMod = player.hp <= 2 ? -0.24 : (player.hp >= 5 ? 0.08 : 0);
        const raw = 1.0 + powerFactor + scoreFactor + chainFactor + waveFactor + survivalMod;
        return Math.max(1.0, Math.min(3.8, raw));
      }

      function checkRankMilestoneAnnouncement() {
        const rank = getDynamicRank();
        const tier = Math.floor(rank * 2) / 2;
        if (tier >= 1.5 && tier > lastAnnouncedRankTier) {
          lastAnnouncedRankTier = tier;
          spawnFloatingLabel(W / 2, 110, "⚔️ 战力跃升 · 敌军威胁度升至 RANK " + tier.toFixed(1) + "×", "#f59e0b", 16);
        } else if (tier < lastAnnouncedRankTier - 0.5) {
          lastAnnouncedRankTier = Math.max(1, tier);
        }
      }

      function updateHud(bumpScore) {
        scoreValueEl.textContent = String(score);
        bestScoreValueEl.textContent = String(bestScore);
        const tierObj = getCurrentWeaponTierObj();
        const rank = getDynamicRank();
        grazePowerValueEl.textContent = (tierObj.level === 7 ? "Lv.7 MAX" : ("Lv." + tierObj.level)) + " · " + rank.toFixed(2) + "×";
        const hearts = "♥".repeat(Math.max(0, player.hp)) + "♡".repeat(Math.max(0, player.maxHp - player.hp));
        hpBombValueEl.textContent = hearts + " · ⚡" + player.bombs;

        if (player.hyperTimer > 0) {
          const sec = (player.hyperTimer / 60).toFixed(1);
          hyperAwakenBtn.textContent = "🔥 觉醒中 " + sec + "s";
          hyperAwakenBtn.classList.add("is-hyper-ready");
        } else {
          const pct = Math.min(100, Math.floor(player.hyperGauge));
          hyperAwakenBtn.textContent = "🔥 觉醒 " + pct + "%";
          hyperAwakenBtn.classList.toggle("is-hyper-ready", pct >= 50);
        }

        if (bumpScore) triggerHudBump(scoreValueEl);
      }

      function addScore(pts) {
        const mult = player.hyperTimer > 0 ? 2 : 1;
        score += pts * mult;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem(STORAGE_KEY_BEST, String(bestScore));
        }
        checkRankMilestoneAnnouncement();
      }

      function addWeaponExp(amount) {
        const oldLv = getWeaponTierLevel();
        player.powerExp = Math.min(48, player.powerExp + amount);
        const newTier = getCurrentWeaponTierObj();
        if (newTier.level > oldLv) {
          sfxPowerUp();
          spawnShockwave(player.x, player.y, newTier.primaryColor, 140, 4.5);
          spawnParticles(player.x, player.y, newTier.primaryColor, 26, 1.3);
          spawnFloatingLabel(player.x, player.y - 26, "⚡ 武器进化 → " + newTier.stageLabel + "!", newTier.primaryColor, 17);
          if (newTier.level === 7 && player.prismTurrets.length === 0) {
            deployPrismTurrets();
          }
        }
      }

      // HYPER 能量满 100% 时自动开启觉醒暴走（全程无需按键，也可满 50% 以上时双击鼠标左键或点击按钮手动开启）
      function chargeHyper(amount) {
        if (player.hyperTimer > 0) return;
        player.hyperGauge = Math.min(100, player.hyperGauge + amount);
        if (player.hyperGauge >= 100) {
          activateHyperAwakening(true);
        }
      }

      function activateHyperAwakening(isAuto) {
        if (isGameOver || isPaused) return;
        if (player.hyperTimer > 0) return;
        if (!isAuto && player.hyperGauge < 50) {
          showToast("🔥 觉醒能量至少需 50% 才可手动提前开启（满 100% 将自动开启）");
          return;
        }
        const duration = isAuto ? 420 : Math.round(420 * (player.hyperGauge / 100));
        player.hyperGauge = 0;
        player.hyperTimer = duration;
        player.invincibleTimer = Math.max(player.invincibleTimer, 80);
        screenShake = 11;
        screenFlashColor = "#facc15";
        screenFlashAlpha = 0.36;
        sfxHyper();

        spawnShockwave(player.x, player.y, "#facc15", 260, 6);
        spawnShockwave(player.x, player.y, "#ec4899", 180, 4);
        spawnFloatingLabel(player.x, player.y - 26, "🔥 HYPER 觉醒暴走 · 敌弹时停力场开启！", "#facc15", 17);
        updateHud(false);
      }

      function deployPrismTurrets() {
        player.prismTurrets = [
          { x: W * 0.22, y: H * 0.62, angle: -Math.PI / 2, fireTick: 0, color: "#f472b6" },
          { x: W * 0.41, y: H * 0.52, angle: -Math.PI / 2, fireTick: 4, color: "#38bdf8" },
          { x: W * 0.59, y: H * 0.52, angle: -Math.PI / 2, fireTick: 8, color: "#facc15" },
          { x: W * 0.78, y: H * 0.62, angle: -Math.PI / 2, fireTick: 12, color: "#34d399" }
        ];
      }

      function spawnParticles(x, y, color, count, speedScale) {
        const sc = speedScale || 1;
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = (1.2 + Math.random() * 4.5) * sc;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: 2.2 + Math.random() * 3.2,
            color: color,
            alpha: 1,
            decay: 0.024 + Math.random() * 0.02,
            star: i % 3 === 0
          });
        }
      }

      function spawnExplosionFireball(x, y, baseColor, scale) {
        const sc = scale || 1;
        fireballs.push({
          x: x,
          y: y,
          radius: 6 * sc,
          maxRadius: 42 * sc,
          color: baseColor || "#f97316",
          alpha: 0.98
        });
        const shardCount = Math.round(12 * sc);
        for (let i = 0; i < shardCount; i++) {
          const ang = (Math.PI * 2 * i) / shardCount + (Math.random() - 0.5) * 0.4;
          const spd = (2.4 + Math.random() * 4.8) * Math.sqrt(sc);
          debrisShards.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: (4.5 + Math.random() * 4.5) * Math.sqrt(sc),
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.35,
            color: i % 2 === 0 ? baseColor : "#facc15",
            alpha: 1
          });
        }
      }

      function spawnShockwave(x, y, color, maxR, lineW) {
        shockwaves.push({
          x: x,
          y: y,
          radius: 8,
          maxRadius: maxR || 90,
          color: color,
          lineWidth: lineW || 3,
          alpha: 0.95
        });
      }

      function spawnSlashArc(x, y, color) {
        slashArcs.push({
          x: x,
          y: y,
          angle: Math.random() * Math.PI * 2,
          radius: 22 + Math.random() * 14,
          color: color || "#f472b6",
          alpha: 0.95
        });
      }

      function spawnLightningArc(x1, y1, x2, y2, color) {
        lightningArcs.push({
          x1: x1,
          y1: y1,
          x2: x2,
          y2: y2,
          color: color || "#facc15",
          alpha: 0.92
        });
      }

      function spawnDamagePopup(x, y, dmg, isCrit) {
        damagePopups.push({
          x: x + (Math.random() - 0.5) * 18,
          y: y - 8,
          vx: (Math.random() - 0.5) * 1.2,
          vy: isCrit ? -2.2 : -1.5,
          text: (isCrit ? "✦" : "") + Math.round(dmg * 10),
          color: isCrit ? "#facc15" : "#38bdf8",
          size: isCrit ? 15 : 12,
          alpha: 1
        });
      }

      function spawnFloatingLabel(x, y, text, color, size) {
        floatingLabels.push({
          x: Math.max(80, Math.min(W - 80, x)),
          y: Math.max(28, y),
          text: text,
          color: color || "#38bdf8",
          size: size || 14,
          alpha: 1
        });
      }

      function triggerEmpBomb(isAutoGuard) {
        if (isGameOver || isPaused) return;
        if (!isAutoGuard && player.bombs <= 0) {
          showToast("⚡ EMP 脉冲能量不足（擦弹或拾取 B 晶片可补充）");
          return;
        }
        if (!isAutoGuard) {
          player.bombs -= 1;
        }
        player.invincibleTimer = Math.max(player.invincibleTimer, 150);
        screenShake = 16;
        screenFlashColor = isAutoGuard ? "#f43f5e" : "#38bdf8";
        screenFlashAlpha = 0.45;
        sfxBomb();

        spawnShockwave(player.x, player.y, "#38bdf8", W * 0.95, 7);
        spawnShockwave(player.x, player.y, "#f472b6", W * 0.72, 4);
        spawnFloatingLabel(player.x, player.y - 26, isAutoGuard ? "🛡️ 自动决死脉冲护盾！" : "⚡ EMP 苍穹清屏脉冲！", "#38bdf8", 17);

        enemyBullets.forEach(function (b) {
          drops.push({
            x: b.x,
            y: b.y,
            vx: 0,
            vy: -1.2,
            type: "star",
            magnet: true
          });
          spawnParticles(b.x, b.y, b.color, 2, 0.7);
        });
        enemyBullets = [];
        enemyLasers = [];

        enemies.forEach(function (en) {
          en.hp -= 55;
          en.hitFlash = 6;
        });
        if (currentBoss) {
          currentBoss.hp -= 140;
          currentBoss.hitFlash = 6;
        }

        updateHud(true);
      }

      /* ========================================================================
         前中后期七阶武器自动演进开火系统
         前期轻灵 -> 中期折返刃与浮游剑 -> 后期电磁轨炮、熔岩榴弹与激光闪电链 -> 终局黑洞奇点与星彩炮塔交响
         ======================================================================== */
      function firePlayerWeapons() {
        const lv = getWeaponTierLevel();
        const focused = player.focusMode;
        const isHyper = player.hyperTimer > 0 || player.overclockTimer > 0;
        const fireStep = isHyper ? 3 : 4;

        // 1. 基础与弦月散弹 (Lv.1 为双联脉冲，Lv.2+ 进化为多道弦月刀光波，Lv.7 进化为七彩星芒交响)
        if (frameTick % fireStep === 0) {
          sfxShoot(680 + lv * 25);
          const rainbow = ["#f43f5e", "#f97316", "#facc15", "#34d399", "#38bdf8", "#818cf8", "#e879f9"];

          if (lv === 1) {
            const off = focused ? 7 : 12;
            playerBullets.push(
              { x: player.x - off, y: player.y - 14, vx: 0, vy: -13.5, dmg: isHyper ? 5.2 : 4.4, color: "#38bdf8", r: 4.2, shape: "lance", homing: false, trail: [] },
              { x: player.x + off, y: player.y - 14, vx: 0, vy: -13.5, dmg: isHyper ? 5.2 : 4.4, color: "#38bdf8", r: 4.2, shape: "lance", homing: false, trail: [] }
            );
          } else {
            const fanCount = lv >= 5 ? 5 : 3;
            for (let i = 0; i < fanCount; i++) {
              const offsetIdx = i - (fanCount - 1) / 2;
              const spreadAng = offsetIdx * (focused ? 0.04 : 0.105);
              const spd = 13.8;
              const col = lv === 7
                ? rainbow[(i + Math.floor(frameTick / 3)) % rainbow.length]
                : (isHyper ? "#facc15" : getCurrentWeaponTierObj().primaryColor);
              playerBullets.push({
                x: player.x + offsetIdx * (focused ? 5 : 9),
                y: player.y - 14,
                vx: Math.sin(spreadAng) * spd,
                vy: -Math.cos(spreadAng) * spd,
                dmg: (3.6 + lv * 0.35) * (isHyper ? 1.25 : 1),
                color: col,
                r: 4.6,
                shape: lv >= 4 ? "shuriken" : "crescent",
                rot: frameTick * 0.2,
                homing: false,
                trail: []
              });
            }
          }
        }

        // 2. Lv.2+ 自动追踪等离子飞弹 (前期进阶与全程辅助追踪火力)
        if (lv >= 2 && frameTick % (isHyper ? 9 : 13) === 0) {
          const droneOffset = focused ? 20 : 32;
          [-droneOffset, droneOffset].forEach(function (ox) {
            playerBullets.push({
              x: player.x + ox,
              y: player.y + 2,
              vx: ox < 0 ? -2.4 : 2.4,
              vy: -6.5,
              dmg: (5.2 + lv * 0.45) * (isHyper ? 1.25 : 1),
              color: isHyper ? "#f472b6" : "#34d399",
              r: 4.8,
              shape: "missile",
              homing: true,
              trail: []
            });
          });
        }

        // 3. 中期 Lv.3+ 穿透折返巨型风刃回旋镖 (飞至前场悬停切割后自动折返飞回自机)
        if (lv >= 3 && frameTick % (isHyper ? 15 : 22) === 0) {
          const bCount = lv >= 5 ? 2 : 1;
          for (let i = 0; i < bCount; i++) {
            const side = bCount === 1 ? 0 : (i === 0 ? -1 : 1);
            playerBullets.push({
              x: player.x + side * 18,
              y: player.y - 14,
              vx: side * (focused ? 0.9 : 2.6),
              vy: -11.5,
              dmg: isHyper ? 2.6 : 2.0,
              color: "#34d399",
              r: 12.5,
              shape: "boomerang",
              piercing: true,
              age: 0,
              rot: 0,
              trail: []
            });
          }
        }

        // 4. 中期 Lv.4+ 紫电索敌浮游光剑阵 (自动飞向敌机/Boss 贴身高速环绕斩击，按住鼠标左键聚能时收拢护身)
        if (lv >= 4) {
          const bladeCount = lv >= 6 ? 4 : 2;
          for (let bIdx = 0; bIdx < bladeCount; bIdx++) {
            const blade = player.bitBlades[bIdx];
            blade.angle += 0.16;

            let target = currentBoss;
            if (!target && enemies.length > 0) {
              target = enemies[bIdx % enemies.length];
            }

            let destX, destY;
            if (target && !focused) {
              const orbitR = 34;
              destX = target.x + Math.cos(blade.angle + bIdx * 1.57) * orbitR;
              destY = target.y + Math.sin(blade.angle + bIdx * 1.57) * orbitR;
            } else {
              const formR = focused ? 24 : 42;
              destX = player.x + Math.cos(blade.angle + bIdx * 1.57) * formR;
              destY = player.y + Math.sin(blade.angle + bIdx * 1.57) * formR;
            }

            blade.x += (destX - blade.x) * 0.22;
            blade.y += (destY - blade.y) * 0.22;

            if (frameTick % (isHyper ? 6 : 10) === bIdx % 3) {
              if (currentBoss && Math.hypot(blade.x - currentBoss.x, blade.y - currentBoss.y) < 52) {
                const dmg = isHyper ? 4.2 : 3.0;
                currentBoss.hp -= dmg;
                currentBoss.hitFlash = 2;
                chargeHyper(0.22);
                spawnSlashArc(currentBoss.x + (Math.random() - 0.5) * 24, currentBoss.y + (Math.random() - 0.5) * 24, "#f472b6");
                spawnDamagePopup(currentBoss.x, currentBoss.y, dmg, true);
              }
              for (let j = 0; j < enemies.length; j++) {
                const en = enemies[j];
                if (Math.hypot(blade.x - en.x, blade.y - en.y) < en.radius + 30) {
                  const dmg = isHyper ? 4.4 : 3.2;
                  en.hp -= dmg;
                  en.hitFlash = 2;
                  chargeHyper(0.22);
                  spawnSlashArc(en.x, en.y, "#c084fc");
                  spawnDamagePopup(en.x, en.y, dmg, true);
                  break;
                }
              }
            }
          }
        }

        // 5. 后期 Lv.5+ 耀金贯穿电磁轨炮 + 子母爆裂熔岩榴弹
        if (lv >= 5) {
          if (frameTick % (isHyper ? 13 : 19) === 0) {
            sfxRailgun();
            spawnShockwave(player.x, player.y - 20, "#facc15", 30, 2.2);
            playerBullets.push({
              x: player.x,
              y: player.y - 18,
              vx: 0,
              vy: -19,
              dmg: isHyper ? 5.0 : 3.8,
              color: "#facc15",
              r: 6.5,
              shape: "railgun",
              piercing: true,
              trail: []
            });
          }

          if (frameTick % (isHyper ? 18 : 26) === 0) {
            [-20, 20].forEach(function (ox) {
              playerBullets.push({
                x: player.x + ox,
                y: player.y - 8,
                vx: ox * (focused ? 0.03 : 0.09),
                vy: -8.5,
                dmg: 9.5,
                color: "#f97316",
                r: 7.0,
                shape: "cluster",
                isCluster: true,
                trail: []
              });
            });
          }
        }

        // 6. 后期 Lv.6+ 绯红女武神贯穿棱镜激光束 + 三目标跳跃闪电链
        if (lv >= 6) {
          player.laserActiveFrames = 3;
          const beamHalfW = (lv === 7 ? 15 : 11) * (isHyper ? 1.35 : 1);
          const beamDmg = (lv === 7 ? 1.35 : 0.95) * (isHyper ? 1.35 : 1);

          if (currentBoss && Math.abs(currentBoss.x - player.x) < 36 + beamHalfW && currentBoss.y < player.y) {
            currentBoss.hp -= beamDmg;
            currentBoss.hitFlash = 2;
            chargeHyper(0.18);
            if (frameTick % 6 === 0) {
              spawnParticles(player.x, currentBoss.y + 22, "#facc15", 3, 0.9);
              spawnDamagePopup(currentBoss.x, currentBoss.y, beamDmg * 5, true);
            }
          }
          for (let i = 0; i < enemies.length; i++) {
            const en = enemies[i];
            if (Math.abs(en.x - player.x) < en.radius + beamHalfW && en.y < player.y) {
              en.hp -= beamDmg;
              en.hitFlash = 2;
              chargeHyper(0.15);
              if (frameTick % 6 === 0) {
                spawnParticles(en.x, en.y + en.radius * 0.5, "#f43f5e", 2, 0.8);
                spawnDamagePopup(en.x, en.y, beamDmg * 5, false);
              }
            }
          }

          if (frameTick % (isHyper ? 12 : 17) === 0) {
            const chainTargets = [];
            if (currentBoss) chainTargets.push(currentBoss);
            enemies.forEach(function (en) {
              if (chainTargets.length < 3 && Math.hypot(en.x - player.x, en.y - player.y) < 380) {
                chainTargets.push(en);
              }
            });
            let prevX = player.x;
            let prevY = player.y - 10;
            chainTargets.forEach(function (t, idx) {
              const dmg = 8.5 * (isHyper ? 1.35 : 1);
              t.hp -= dmg;
              t.hitFlash = 3;
              spawnLightningArc(prevX, prevY, t.x, t.y, idx === 0 ? "#facc15" : "#f43f5e");
              spawnDamagePopup(t.x, t.y, dmg, true);
              prevX = t.x;
              prevY = t.y;
            });
          }
        }

        // 7. 终局神装 Lv.7 MAX 虚空黑洞奇点球 (聚怪+吞噬敌弹) + 4 座驻场自动索敌星彩激光炮塔
        if (lv >= 7) {
          if (frameTick % (isHyper ? 28 : 42) === 0) {
            sfxBlackHole();
            singularityWells.push({
              x: player.x,
              y: player.y - 22,
              vy: -2.4,
              radius: 54,
              life: 130,
              maxLife: 130,
              dmg: isHyper ? 0.9 : 0.65
            });
          }

          if (player.prismTurrets.length === 0) {
            deployPrismTurrets();
          }
          player.prismTurrets.forEach(function (tu, idx) {
            tu.fireTick++;
            const homeX = player.focusMode
              ? (player.x + (idx - 1.5) * 26)
              : (W * 0.16 + ((idx + 0.5) / 4) * (W * 0.68));
            const homeY = player.focusMode ? (player.y - 24) : (H * 0.58 + (idx % 2 === 0 ? 18 : -14));
            tu.x += (homeX - tu.x) * 0.12;
            tu.y += (homeY - tu.y) * 0.12;

            let target = currentBoss;
            let bestD = target ? Math.hypot(target.x - tu.x, target.y - tu.y) : Infinity;
            enemies.forEach(function (en) {
              const d = Math.hypot(en.x - tu.x, en.y - tu.y);
              if (d < bestD) {
                bestD = d;
                target = en;
              }
            });

            tu.angle = target ? Math.atan2(target.y - tu.y, target.x - tu.x) : (-Math.PI / 2);

            if (tu.fireTick % (isHyper ? 8 : 12) === 0) {
              const spd = 13;
              playerBullets.push({
                x: tu.x,
                y: tu.y,
                vx: Math.cos(tu.angle) * spd,
                vy: Math.sin(tu.angle) * spd,
                dmg: isHyper ? 4.8 : 3.6,
                color: tu.color,
                r: 4.2,
                shape: "lance",
                homing: false,
                trail: []
              });
            }
          });
        }
      }

      /* ========================================================================
         非 Boss 敌方战机巡航阶段与六大关底 Boss 交替生成系统
         保证每个 Boss 登场前都有完整的 20 秒 (SORTIE_DURATION_FRAMES) 纯非 Boss 敌机作战期
         ======================================================================== */
      function spawnWaveIfNeeded() {
        if (currentBoss) return;

        const rank = getDynamicRank();

        if (sortieFramesRemaining > 0) {
          sortieFramesRemaining--;
        }

        // 当非 Boss 敌机巡航倒计时归零，且场上的大型敌机清理完毕（或超时）时，召唤本关 Boss！
        if (sortieFramesRemaining <= 0) {
          const bossSpec = BOSS_CATALOG[(stageWave - 1) % BOSS_CATALOG.length];
          const loopMult = 1 + Math.floor((stageWave - 1) / BOSS_CATALOG.length) * 0.55;
          const maxHp = Math.round(bossSpec.baseHp * loopMult * (0.78 + rank * 0.32));
          currentBoss = {
            id: bossSpec.id,
            name: bossSpec.name,
            themeColor: bossSpec.themeColor,
            subColor: bossSpec.subColor,
            spellNames: bossSpec.spellNames,
            bossIndex: (stageWave - 1) % BOSS_CATALOG.length,
            x: W / 2,
            y: -48,
            targetY: 84,
            hp: maxHp,
            maxHp: maxHp,
            phase: 0,
            tick: 0,
            tier: stageWave,
            hitFlash: 0
          };
          spellBannerText = currentBoss.name + " · " + currentBoss.spellNames[0];
          spellBannerTimer = 140;
          spawnFloatingLabel(W / 2, 130, "⚠️ 第 " + stageWave + " 关 BOSS 降临：" + currentBoss.name, bossSpec.themeColor, 17);
          return;
        }

        // 在非 Boss 巡航阶段内，按动态难度 rank 刷新六类非 Boss 敌机编队
        const maxEnemiesOnScreen = Math.min(10, Math.floor(3 + rank * 2));
        if (enemies.length >= maxEnemiesOnScreen) return;

        const spawnInterval = Math.max(54, Math.round(135 / (0.65 + rank * 0.35)));
        if (frameTick - lastWaveSpawnTick < spawnInterval) return;
        lastWaveSpawnTick = frameTick;

        const hpMult = 0.8 + rank * 0.45;
        const pattern = Math.floor(frameTick / spawnInterval) % 6;

        if (pattern === 0) {
          const count = rank >= 2.2 ? 5 : (rank >= 1.5 ? 4 : 3);
          for (let i = 0; i < count; i++) {
            const ratio = count === 1 ? 0.5 : i / (count - 1);
            const hp = Math.round(12 * hpMult);
            enemies.push({
              type: "scout",
              baseX: W * 0.16 + ratio * (W * 0.68),
              x: W * 0.16 + ratio * (W * 0.68),
              y: -22 - Math.abs(i - (count - 1) / 2) * 18,
              vx: 0,
              vy: 1.25 + Math.min(0.7, (rank - 1) * 0.22),
              hp: hp,
              maxHp: hp,
              tick: i * 12,
              color: "#38bdf8",
              radius: 15,
              hitFlash: 0
            });
          }
        } else if (pattern === 1) {
          const count = rank >= 2.3 ? 3 : 2;
          for (let i = 0; i < count; i++) {
            const xPos = count === 2 ? (i === 0 ? W * 0.28 : W * 0.72) : (W * 0.2 + i * (W * 0.3));
            const hp = Math.round(34 * hpMult);
            enemies.push({
              type: "spinner",
              x: xPos,
              y: -26 - (i % 2) * 16,
              vx: 0,
              vy: 0.95,
              hp: hp,
              maxHp: hp,
              tick: i * 16,
              color: "#a855f7",
              radius: 19,
              hitFlash: 0
            });
          }
        } else if (pattern === 2) {
          const gunHp = Math.round(62 * hpMult);
          enemies.push({
            type: "gunship",
            x: W / 2,
            y: -30,
            vx: 0.95,
            vy: 0.85,
            hp: gunHp,
            maxHp: gunHp,
            tick: 0,
            color: "#f59e0b",
            radius: 23,
            hitFlash: 0
          });
        } else if (pattern === 3) {
          for (let i = 0; i < 2; i++) {
            const wx = i === 0 ? W * 0.24 : W * 0.76;
            const hp = Math.round(28 * hpMult);
            spawnShockwave(wx, 75, "#2dd4bf", 55, 2.5);
            enemies.push({
              type: "warper",
              x: wx,
              y: 75,
              vx: i === 0 ? 0.6 : -0.6,
              vy: 0.45,
              hp: hp,
              maxHp: hp,
              tick: 0,
              color: "#2dd4bf",
              radius: 17,
              hitFlash: 4
            });
          }
        } else if (pattern === 4) {
          const trHp = Math.round(42 * hpMult);
          enemies.push({
            type: "treasure",
            x: 80,
            y: 68,
            vx: 2.1,
            vy: 0.15,
            hp: trHp,
            maxHp: trHp,
            tick: 0,
            color: "#facc15",
            radius: 20,
            hitFlash: 0
          });
          spawnFloatingLabel(W / 2, 65, "✨ 黄金补给舰出现！击破掉落 [W] 武器进化核心", "#facc15", 14);
        } else {
          const cHp = Math.round(54 * hpMult);
          enemies.push({
            type: "carrier",
            x: W * (0.3 + Math.random() * 0.4),
            y: -28,
            vx: 0,
            vy: 0.75,
            hp: cHp,
            maxHp: cHp,
            tick: 0,
            color: "#ec4899",
            radius: 22,
            hitFlash: 0
          });
        }
      }

      function fireEnemyBullet(x, y, vx, vy, color, radius, shape) {
        enemyBullets.push({
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          color: color || "#f43f5e",
          r: radius || 4.4,
          shape: shape || "rice",
          rot: Math.atan2(vy, vx),
          grazed: false
        });
      }

      function spawnWarningLaser(x, y, angle, color, chargeFrames, fireFrames) {
        enemyLasers.push({
          x: x,
          y: y,
          angle: angle,
          color: color || "#f43f5e",
          chargeTick: chargeFrames || 45,
          maxCharge: chargeFrames || 45,
          fireTick: fireFrames || 25,
          maxFire: fireFrames || 25
        });
      }

      // 六大关底 Boss 各自独特的三阶段符卡弹幕实现
      function updateBoss() {
        if (!currentBoss) return;
        const b = currentBoss;
        const rank = getDynamicRank();
        const spdMult = 0.88 + Math.min(0.85, (rank - 1) * 0.25);

        b.tick++;
        if (b.hitFlash > 0) b.hitFlash--;

        if (b.y < b.targetY) {
          b.y += (b.targetY - b.y) * 0.08;
        } else {
          b.x = W / 2 + Math.sin(b.tick * 0.016) * (W * 0.27);
          b.y = b.targetY + Math.cos(b.tick * 0.028) * 12;
        }

        const hpRatio = b.hp / b.maxHp;
        const nextPhase = hpRatio > 0.66 ? 0 : (hpRatio > 0.33 ? 1 : 2);
        if (nextPhase !== b.phase) {
          b.phase = nextPhase;
          hitStopFrames = 5;
          screenShake = 14;
          screenFlashColor = b.themeColor;
          screenFlashAlpha = 0.38;
          spellBannerText = b.name + " · " + b.spellNames[b.phase];
          spellBannerTimer = 140;
          spawnExplosionFireball(b.x, b.y, b.themeColor, 1.6);
          spawnShockwave(b.x, b.y, "#facc15", 240, 5);
          spawnFloatingLabel(b.x, b.y + 34, "✦ 符卡展开：" + b.spellNames[b.phase] + " ✦", "#facc15", 16);
          enemyBullets.forEach(function (eb) {
            drops.push({ x: eb.x, y: eb.y, vx: 0, vy: -1.4, type: "star", magnet: true });
          });
          enemyBullets = [];
          enemyLasers = [];
        }

        // 根据 6 个不同 Boss ID 释放差异化主题几何弹幕
        if (b.id === "valkyrie") {
          // Boss 1：苍穹女武神（阿基米德双螺旋 + 棱镜扇形 + 星雨）
          if (b.phase === 0 && b.tick % 16 === 0) {
            const arms = Math.min(8, 4 + Math.floor(rank));
            for (let i = 0; i < arms; i++) {
              const a = b.tick * 0.055 + (Math.PI * 2 * i) / arms;
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.65 * spdMult, Math.sin(a) * 1.65 * spdMult, b.subColor, 4.4, "rice");
            }
          } else if (b.phase === 1) {
            if (b.tick % 32 === 0) {
              const aim = Math.atan2(player.y - b.y, player.x - b.x);
              for (let k = -3; k <= 3; k++) {
                fireEnemyBullet(b.x, b.y, Math.cos(aim + k * 0.16) * 1.8 * spdMult, Math.sin(aim + k * 0.16) * 1.8 * spdMult, b.themeColor, 4.6, "star");
              }
            }
          } else if (b.phase === 2 && b.tick % 14 === 0) {
            const arms = 6;
            const wAng = Math.sin(b.tick * 0.04) * 1.2;
            for (let i = 0; i < arms; i++) {
              const a = wAng + (Math.PI * 2 * i) / arms;
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.75 * spdMult, Math.sin(a) * 1.75 * spdMult, i % 2 === 0 ? b.themeColor : b.subColor, 4.5, "star");
            }
          }
        } else if (b.id === "aegis") {
          // Boss 2：碧海重装母舰（六角晶格环 + 召唤无人机 + 潮汐光玉）
          if (b.phase === 0 && b.tick % 36 === 0) {
            for (let side = 0; side < 6; side++) {
              const baseA = (Math.PI * 2 * side) / 6 + b.tick * 0.02;
              for (let k = -1; k <= 1; k++) {
                const a = baseA + k * 0.12;
                fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.55 * spdMult, Math.sin(a) * 1.55 * spdMult, b.themeColor, 4.6, "ring");
              }
            }
          } else if (b.phase === 1) {
            if (b.tick % 110 === 20 && enemies.length < 4) {
              [-90, 90].forEach(function (ox) {
                enemies.push({
                  type: "scout",
                  baseX: b.x + ox,
                  x: b.x + ox,
                  y: b.y + 10,
                  vx: 0,
                  vy: 1.35,
                  hp: 16,
                  maxHp: 16,
                  tick: 0,
                  color: "#10b981",
                  radius: 14,
                  hitFlash: 0
                });
              });
            }
            if (b.tick % 24 === 0) {
              const aim = Math.atan2(player.y - b.y, player.x - b.x);
              for (let k = -2; k <= 2; k++) {
                fireEnemyBullet(b.x, b.y, Math.cos(aim + k * 0.22) * 1.7 * spdMult, Math.sin(aim + k * 0.22) * 1.7 * spdMult, b.subColor, 4.4, "rice");
              }
            }
          } else if (b.phase === 2 && b.tick % 28 === 0) {
            for (let i = 0; i < 10; i++) {
              const a = (Math.PI * 2 * i) / 10 + b.tick * 0.03;
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.65 * spdMult, Math.sin(a) * 1.65 * spdMult, i % 2 === 0 ? "#10b981" : "#38bdf8", 7.2, "big");
            }
          }
        } else if (b.id === "tempest") {
          // Boss 3：翠岚风暴龙骑（交叉回旋刃幕 + 预警激光十字斩 + 飓风眼）
          if (b.phase === 0 && b.tick % 14 === 0) {
            for (let i = 0; i < 4; i++) {
              const a1 = b.tick * 0.07 + (Math.PI * 2 * i) / 4;
              const a2 = -b.tick * 0.07 + (Math.PI * 2 * i) / 4;
              fireEnemyBullet(b.x - 24, b.y, Math.cos(a1) * 1.8 * spdMult, Math.sin(a1) * 1.8 * spdMult, "#2dd4bf", 4.5, "rice");
              fireEnemyBullet(b.x + 24, b.y, Math.cos(a2) * 1.8 * spdMult, Math.sin(a2) * 1.8 * spdMult, "#facc15", 4.5, "rice");
            }
          } else if (b.phase === 1) {
            if (b.tick % 80 === 0) {
              const aim = Math.atan2(player.y - b.y, player.x - b.x);
              [-0.32, 0, 0.32].forEach(function (off) {
                spawnWarningLaser(b.x, b.y, aim + off, "#2dd4bf", 45, 22);
              });
            }
            if (b.tick % 20 === 0) {
              for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 * i) / 8 + b.tick * 0.04;
                fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.6 * spdMult, Math.sin(a) * 1.6 * spdMult, "#facc15", 4.6, "star");
              }
            }
          } else if (b.phase === 2 && b.tick % 12 === 0) {
            const arms = 7;
            for (let i = 0; i < arms; i++) {
              const a = b.tick * 0.08 + (Math.PI * 2 * i) / arms;
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.9 * spdMult, Math.sin(a) * 1.9 * spdMult, i % 2 === 0 ? "#2dd4bf" : "#facc15", 4.6, "rice");
            }
          }
        } else if (b.id === "chronos") {
          // Boss 4：时空星盘主宰（十二宫齿轮 + 曼陀罗八叶莲华 + 时针激光）
          if (b.phase === 0 && b.tick % 30 === 0) {
            for (let i = 0; i < 12; i++) {
              const a = (Math.PI * 2 * i) / 12 + (b.tick % 60 === 0 ? 0 : 0.26);
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.6 * spdMult, Math.sin(a) * 1.6 * spdMult, "#a855f7", 4.8, "ring");
            }
          } else if (b.phase === 1 && b.tick % 38 === 0) {
            const petals = 16;
            const rot = b.tick * 0.035;
            for (let i = 0; i < petals; i++) {
              const theta = (Math.PI * 2 * i) / petals;
              const spd = (1.3 + 0.9 * Math.abs(Math.cos(4 * theta))) * spdMult;
              fireEnemyBullet(b.x, b.y, Math.cos(theta + rot) * spd, Math.sin(theta + rot) * spd, i % 2 === 0 ? "#a855f7" : "#facc15", 4.6, "star");
            }
          } else if (b.phase === 2) {
            if (b.tick % 75 === 0) {
              for (let k = 0; k < 4; k++) {
                spawnWarningLaser(b.x, b.y, b.tick * 0.02 + (Math.PI * k) / 2, "#facc15", 42, 20);
              }
            }
            if (b.tick % 16 === 0) {
              for (let i = 0; i < 6; i++) {
                const a = -b.tick * 0.06 + (Math.PI * 2 * i) / 6;
                fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.75 * spdMult, Math.sin(a) * 1.75 * spdMult, "#a855f7", 4.5, "rice");
              }
            }
          }
        } else if (b.id === "erebus") {
          // Boss 5：虚空暗影魔龙（暗影双漩涡 + 重力大玉星陨 + 交叉光矛网）
          if (b.phase === 0 && b.tick % 13 === 0) {
            for (let i = 0; i < 6; i++) {
              const a = b.tick * 0.065 + (Math.PI * 2 * i) / 6;
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.8 * spdMult, Math.sin(a) * 1.8 * spdMult, i % 2 === 0 ? "#6366f1" : "#f43f5e", 4.6, "rice");
            }
          } else if (b.phase === 1 && b.tick % 44 === 0) {
            const aim = Math.atan2(player.y - b.y, player.x - b.x);
            for (let k = -2; k <= 2; k++) {
              const a = aim + k * 0.24;
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.7 * spdMult, Math.sin(a) * 1.7 * spdMult, "#f43f5e", 8.0, "big");
            }
          } else if (b.phase === 2 && b.tick % 18 === 0) {
            for (let i = 0; i < 8; i++) {
              const a = Math.sin(b.tick * 0.05) * 1.4 + (Math.PI * 2 * i) / 8;
              fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.9 * spdMult, Math.sin(a) * 1.9 * spdMult, i % 2 === 0 ? "#818cf8" : "#f43f5e", 4.8, "star");
            }
          }
        } else {
          // Boss 6：炽天创世裁决者（六翼十字激光 + 蝶舞七彩曼陀罗 + 创世超新星）
          const rainbow = ["#f43f5e", "#f97316", "#facc15", "#34d399", "#38bdf8", "#a855f7", "#ec4899"];
          if (b.phase === 0) {
            if (b.tick % 85 === 0) {
              const aim = Math.atan2(player.y - b.y, player.x - b.x);
              [-0.4, -0.15, 0.15, 0.4].forEach(function (off) {
                spawnWarningLaser(b.x, b.y, aim + off, "#f97316", 45, 22);
              });
            }
            if (b.tick % 15 === 0) {
              for (let i = 0; i < 7; i++) {
                const a = b.tick * 0.05 + (Math.PI * 2 * i) / 7;
                fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.75 * spdMult, Math.sin(a) * 1.75 * spdMult, rainbow[i], 4.6, "rice");
              }
            }
          } else if (b.phase === 1 && b.tick % 32 === 0) {
            const petals = 18;
            const rot = b.tick * 0.04;
            for (let i = 0; i < petals; i++) {
              const theta = (Math.PI * 2 * i) / petals;
              const spd = (1.35 + 0.95 * Math.abs(Math.sin(3 * theta))) * spdMult;
              fireEnemyBullet(b.x, b.y, Math.cos(theta + rot) * spd, Math.sin(theta + rot) * spd, rainbow[i % rainbow.length], 4.8, "star");
            }
          } else if (b.phase === 2) {
            if (b.tick % 11 === 0) {
              for (let i = 0; i < 8; i++) {
                const a = Math.sin(b.tick * 0.045) * 1.5 + (Math.PI * 2 * i) / 8;
                fireEnemyBullet(b.x, b.y, Math.cos(a) * 1.9 * spdMult, Math.sin(a) * 1.9 * spdMult, rainbow[(i + Math.floor(b.tick / 11)) % rainbow.length], 4.8, "star");
              }
            }
            if (b.tick % 65 === 0) {
              const aim = Math.atan2(player.y - b.y, player.x - b.x);
              for (let k = -2; k <= 2; k++) {
                fireEnemyBullet(b.x, b.y, Math.cos(aim + k * 0.22) * 1.75 * spdMult, Math.sin(aim + k * 0.22) * 1.75 * spdMult, "#facc15", 8.0, "big");
              }
            }
          }
        }

        // Boss 被彻底击破：进入下一轮 20 秒纯非 Boss 敌机巡航期，并奖励丰厚武器进化核心
        if (b.hp <= 0) {
          sfxBossClear();
          hitStopFrames = 8;
          screenShake = 20;
          screenFlashColor = "#facc15";
          screenFlashAlpha = 0.55;
          const bossBonus = Math.round((3000 + b.tier * 1200) * rank);
          addScore(bossBonus);
          stageWave += 1;
          sortieFramesRemaining = SORTIE_DURATION_FRAMES;

          spawnExplosionFireball(b.x, b.y, "#facc15", 2.4);
          spawnExplosionFireball(b.x - 32, b.y + 14, b.themeColor, 1.6);
          spawnExplosionFireball(b.x + 32, b.y - 14, b.subColor, 1.6);
          spawnShockwave(b.x, b.y, "#facc15", 340, 7);
          spawnShockwave(b.x, b.y, b.themeColor, 240, 4.5);
          spawnParticles(b.x, b.y, "#facc15", 65, 2.1);
          spawnParticles(b.x, b.y, b.subColor, 45, 1.6);
          spawnFloatingLabel(b.x, b.y, "🏆 击破 BOSS #" + b.tier + " +" + bossBonus, "#facc15", 19);

          enemyBullets.forEach(function (eb) {
            drops.push({ x: eb.x, y: eb.y, vx: 0, vy: -1.4, type: "star", magnet: true });
          });
          enemyBullets = [];
          enemyLasers = [];
          drops.push(
            { x: b.x - 36, y: b.y, vx: -1, vy: -1.8, type: "weapon", magnet: true },
            { x: b.x - 12, y: b.y, vx: -0.4, vy: -2.0, type: "power", magnet: true },
            { x: b.x + 12, y: b.y, vx: 0.4, vy: -2.2, type: "bomb", magnet: true },
            { x: b.x + 36, y: b.y, vx: 1, vy: -1.8, type: "hp", magnet: true }
          );
          chargeHyper(45);
          currentBoss = null;
          updateHud(true);
        }
      }

      function detonateClusterBomb(x, y) {
        spawnExplosionFireball(x, y, "#f97316", 1.15);
        spawnShockwave(x, y, "#facc15", 68, 3);
        plasmaFields.push({
          x: x,
          y: y,
          radius: 42,
          life: 65,
          maxLife: 65,
          dmg: 0.55
        });
        for (let k = 0; k < 8; k++) {
          const ang = (Math.PI * 2 * k) / 8;
          playerBullets.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * 6.5,
            vy: Math.sin(ang) * 6.5,
            dmg: 2.6,
            color: "#fb923c",
            r: 3.6,
            shape: "orb",
            homing: false,
            trail: []
          });
        }
      }

      function onPlayerHit() {
        if (player.invincibleTimer > 0 || isGameOver) return;

        if (player.hp === 1 && player.bombs >= 1) {
          player.bombs -= 1;
          triggerEmpBomb(true);
          return;
        }

        player.hp -= 1;
        killChain = 0;
        player.invincibleTimer = 140;
        screenShake = 14;
        screenFlashColor = "#ef4444";
        screenFlashAlpha = 0.4;
        sfxPlayerHit();
        spawnExplosionFireball(player.x, player.y, "#ef4444", 1.25);
        spawnShockwave(player.x, player.y, "#ef4444", 190, 5);
        spawnParticles(player.x, player.y, "#ef4444", 28, 1.4);

        enemyBullets = enemyBullets.filter(function (b) {
          return Math.hypot(b.x - player.x, b.y - player.y) > 210;
        });
        enemyLasers = [];

        updateHud(false);

        if (player.hp <= 0) {
          isGameOver = true;
          gameOverTitle.textContent = "战机坠毁";
          gameOverSummary.textContent = "最终得分 " + score + " 分 · 武器进化至 " + getCurrentWeaponTierObj().shortName + " · 突破至第 " + stageWave + " 关";
          gameOverOverlay.classList.add("is-visible");
        }
      }

      function updateGameFrame() {
        if (isPaused || isGameOver) return;

        if (hitStopFrames > 0) {
          hitStopFrames--;
          return;
        }

        frameTick++;
        if (spellBannerTimer > 0) spellBannerTimer--;
        if (player.overclockTimer > 0) player.overclockTimer--;
        if (player.hyperTimer > 0) {
          player.hyperTimer--;
          if (player.hyperTimer % 12 === 0) updateHud(false);
        }
        if (killChainTimer > 0) {
          killChainTimer--;
          if (killChainTimer === 0) {
            killChain = 0;
            updateHud(false);
          }
        }

        // 按住鼠标左键或按住键盘 Shift 均可进入 Focus 精密聚能模式
        player.focusMode = Boolean(keys["Shift"] || isMouseLeftHeld);
        const moveSpd = player.focusMode ? 2.6 : 5.4;

        let dx = 0;
        let dy = 0;
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= 1;
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += 1;
        if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy -= 1;
        if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += 1;

        if (dx !== 0 || dy !== 0) {
          player.targetX = null;
          player.targetY = null;
          const len = Math.hypot(dx, dy);
          player.x += (dx / len) * moveSpd;
          player.y += (dy / len) * moveSpd;
        } else if (player.targetX !== null && player.targetY !== null) {
          const followRate = player.focusMode ? 0.18 : 0.3;
          player.x += (player.targetX - player.x) * followRate;
          player.y += (player.targetY - player.y) * followRate;
        }

        player.x = Math.max(22, Math.min(W - 22, player.x));
        player.y = Math.max(28, Math.min(H - 36, player.y));

        const tierObj = getCurrentWeaponTierObj();
        if (frameTick % 2 === 0) {
          wingTrails.push(
            { x: player.x - 14, y: player.y + 9, alpha: 0.48, color: player.hyperTimer > 0 ? "#facc15" : tierObj.primaryColor },
            { x: player.x + 14, y: player.y + 9, alpha: 0.48, color: player.hyperTimer > 0 ? "#facc15" : tierObj.primaryColor }
          );
        }

        if (player.invincibleTimer > 0) player.invincibleTimer--;
        if (player.laserActiveFrames > 0) player.laserActiveFrames--;
        if (screenShake > 0) screenShake *= 0.84;
        if (screenFlashAlpha > 0) screenFlashAlpha *= 0.85;

        firePlayerWeapons();
        spawnWaveIfNeeded();
        updateBoss();

        if (singularityWells.length > 0) {
          const nextWells = [];
          for (let i = 0; i < singularityWells.length; i++) {
            const w = singularityWells[i];
            w.y += w.vy;
            w.vy *= 0.975;
            w.life--;

            if (currentBoss && Math.hypot(currentBoss.x - w.x, currentBoss.y - w.y) < w.radius + 36) {
              currentBoss.hp -= w.dmg;
              currentBoss.hitFlash = 2;
              chargeHyper(0.15);
            }
            enemies.forEach(function (en) {
              const d = Math.hypot(en.x - w.x, en.y - w.y);
              if (d < w.radius + 65) {
                const pullAng = Math.atan2(w.y - en.y, w.x - en.x);
                en.x += Math.cos(pullAng) * 1.8;
                en.y += Math.sin(pullAng) * 1.8;
                if (d < w.radius + en.radius) {
                  en.hp -= w.dmg;
                  en.hitFlash = 2;
                  chargeHyper(0.15);
                }
              }
            });

            enemyBullets = enemyBullets.filter(function (eb) {
              const d = Math.hypot(eb.x - w.x, eb.y - w.y);
              if (d < w.radius * 0.85) {
                addScore(15);
                spawnParticles(eb.x, eb.y, "#c084fc", 1, 0.5);
                return false;
              }
              return true;
            });

            if (w.life <= 0) {
              spawnExplosionFireball(w.x, w.y, "#c084fc", 1.35);
              spawnShockwave(w.x, w.y, "#818cf8", w.radius * 1.9, 4);
            } else if (w.y > -40) {
              nextWells.push(w);
            }
          }
          singularityWells = nextWells;
        }

        if (plasmaFields.length > 0) {
          const nextPF = [];
          for (let i = 0; i < plasmaFields.length; i++) {
            const pf = plasmaFields[i];
            pf.life--;
            if (currentBoss && Math.hypot(currentBoss.x - pf.x, currentBoss.y - pf.y) < pf.radius + 32) {
              currentBoss.hp -= pf.dmg;
            }
            enemies.forEach(function (en) {
              if (Math.hypot(en.x - pf.x, en.y - pf.y) < pf.radius + en.radius) {
                en.hp -= pf.dmg;
              }
            });
            if (pf.life > 0) nextPF.push(pf);
          }
          plasmaFields = nextPF;
        }

        const nextPBullets = [];
        for (let i = 0; i < playerBullets.length; i++) {
          const pb = playerBullets[i];
          if (pb.shape === "shuriken" || pb.shape === "boomerang") {
            pb.rot = (pb.rot || 0) + 0.32;
          }

          if (pb.shape === "boomerang") {
            pb.age = (pb.age || 0) + 1;
            if (pb.age < 38) {
              pb.vy += 0.32;
            } else {
              const backAng = Math.atan2(player.y - pb.y, player.x - pb.x);
              pb.vx = pb.vx * 0.86 + Math.cos(backAng) * 9.5 * 0.14;
              pb.vy = pb.vy * 0.86 + Math.sin(backAng) * 9.5 * 0.14;
              if (pb.age > 55 && Math.hypot(pb.x - player.x, pb.y - player.y) < 24) {
                continue;
              }
            }
          } else if (pb.homing) {
            pb.trail.push({ x: pb.x, y: pb.y });
            if (pb.trail.length > 8) pb.trail.shift();

            let target = currentBoss;
            let bestDist = target ? Math.hypot(target.x - pb.x, target.y - pb.y) : Infinity;
            for (let j = 0; j < enemies.length; j++) {
              const en = enemies[j];
              const d = Math.hypot(en.x - pb.x, en.y - pb.y);
              if (d < bestDist) {
                bestDist = d;
                target = en;
              }
            }
            if (target) {
              const desiredAng = Math.atan2(target.y - pb.y, target.x - pb.x);
              const curSpd = Math.hypot(pb.vx, pb.vy) || 8.8;
              pb.vx = pb.vx * 0.78 + Math.cos(desiredAng) * curSpd * 0.22;
              pb.vy = pb.vy * 0.78 + Math.sin(desiredAng) * curSpd * 0.22;
            }
          } else if (pb.shape === "railgun") {
            pb.trail.push({ x: pb.x, y: pb.y });
            if (pb.trail.length > 6) pb.trail.shift();
          }

          pb.x += pb.vx;
          pb.y += pb.vy;

          if (pb.y < -30 || pb.y > H + 30 || pb.x < -30 || pb.x > W + 30) continue;

          let hit = false;
          if (currentBoss && Math.hypot(pb.x - currentBoss.x, pb.y - currentBoss.y) < 35 + pb.r) {
            currentBoss.hp -= pb.dmg;
            currentBoss.hitFlash = 3;
            addScore(15);
            chargeHyper(0.3);
            if (pb.isCluster) {
              detonateClusterBomb(pb.x, pb.y);
            } else if (!pb.piercing || frameTick % 4 === 0) {
              spawnParticles(pb.x, pb.y, pb.color, 3, 0.75);
              spawnDamagePopup(pb.x, pb.y, pb.dmg, pb.homing || pb.piercing);
            }
            hit = !pb.piercing;
          }

          if (!hit) {
            for (let j = 0; j < enemies.length; j++) {
              const en = enemies[j];
              if (Math.hypot(pb.x - en.x, pb.y - en.y) < en.radius + pb.r) {
                en.hp -= pb.dmg;
                en.hitFlash = 3;
                en.y = Math.max(-20, en.y - 0.9);
                addScore(10);
                chargeHyper(0.28);
                if (pb.isCluster) {
                  detonateClusterBomb(pb.x, pb.y);
                  hit = true;
                  break;
                } else if (!pb.piercing || frameTick % 4 === 0) {
                  spawnParticles(pb.x, pb.y, pb.color, 3, 0.75);
                  spawnDamagePopup(pb.x, pb.y, pb.dmg, pb.homing || pb.piercing);
                  sfxHitEnemy(pb.homing || pb.piercing);
                }
                if (!pb.piercing) {
                  hit = true;
                  break;
                }
              }
            }
          }

          if (!hit) nextPBullets.push(pb);
        }
        playerBullets = nextPBullets;

        const rank = getDynamicRank();
        const bulletSpdMult = 0.88 + Math.min(0.95, (rank - 1) * 0.3);
        const nextEnemies = [];

        for (let i = 0; i < enemies.length; i++) {
          const en = enemies[i];
          en.tick++;
          if (en.hitFlash > 0) en.hitFlash--;
          en.x += en.vx;
          en.y += en.vy;

          if (en.type === "scout") {
            en.x = (en.baseX || en.x) + Math.sin(en.tick * 0.05) * 28;
            if (en.tick === 44 || (rank >= 2.0 && en.tick === 92)) {
              const aim = Math.atan2(player.y - en.y, player.x - en.x);
              const half = rank >= 2.2 ? 1 : 0;
              for (let k = -half; k <= half; k++) {
                fireEnemyBullet(en.x, en.y, Math.cos(aim + k * 0.2) * 1.75 * bulletSpdMult, Math.sin(aim + k * 0.2) * 1.75 * bulletSpdMult, "#38bdf8", 4.2, "rice");
              }
            }
          } else if (en.type === "spinner") {
            if (en.y > 92) en.vy = 0.28;
            const spinInterval = Math.max(26, Math.round(52 - rank * 7));
            if (en.tick % spinInterval === 0) {
              const petals = Math.min(12, 5 + Math.floor(rank * 2));
              const base = en.tick * 0.06;
              for (let k = 0; k < petals; k++) {
                const a = base + (Math.PI * 2 * k) / petals;
                fireEnemyBullet(en.x, en.y, Math.cos(a) * 1.4 * bulletSpdMult, Math.sin(a) * 1.4 * bulletSpdMult, "#c084fc", 4.5, "star");
              }
            }
          } else if (en.type === "gunship") {
            if (en.x < 110 || en.x > W - 110) en.vx *= -1;
            if (en.y > 105) en.vy = 0.12;
            const gunInterval = Math.max(46, Math.round(80 - rank * 10));
            if (en.tick % gunInterval === 0) {
              const aim = Math.atan2(player.y - en.y, player.x - en.x);
              spawnWarningLaser(en.x, en.y + 10, aim, "#f59e0b", 40, 18);
              const halfWays = rank >= 1.7 ? 2 : 1;
              for (let k = -halfWays; k <= halfWays; k++) {
                if (k === 0) continue;
                fireEnemyBullet(en.x, en.y + 12, Math.cos(aim + k * 0.22) * 1.7 * bulletSpdMult, Math.sin(aim + k * 0.22) * 1.7 * bulletSpdMult, "#f59e0b", 4.5, "rice");
              }
            }
          } else if (en.type === "warper") {
            if (en.x < 70 || en.x > W - 70) en.vx *= -1;
            if (en.tick % 56 === 25) {
              const sides = 6;
              for (let s = 0; s < sides; s++) {
                const ang = (Math.PI * 2 * s) / sides + en.tick * 0.02;
                fireEnemyBullet(en.x, en.y, Math.cos(ang) * 1.5 * bulletSpdMult, Math.sin(ang) * 1.5 * bulletSpdMult, "#2dd4bf", 4.8, "ring");
              }
            }
          } else if (en.type === "carrier") {
            if (en.y > 95) en.vy = 0.2;
            if (en.tick % 65 === 30) {
              const aim = Math.atan2(player.y - en.y, player.x - en.x);
              fireEnemyBullet(en.x, en.y, Math.cos(aim) * 1.5 * bulletSpdMult, Math.sin(aim) * 1.5 * bulletSpdMult, "#ec4899", 7.5, "big");
            }
          }

          if (en.hp <= 0) {
            const isHeavy = en.type !== "scout";
            killChain += 1;
            killChainTimer = 210;
            chargeHyper(isHeavy ? 10 : 5);
            const chainBonus = Math.round(killChain * 35 * rank);
            const basePts = Math.round((en.type === "treasure" ? 800 : (isHeavy ? 320 : 110)) * rank) + chainBonus;
            addScore(basePts);

            screenShake = Math.max(screenShake, isHeavy ? 8.5 : 4.2);
            if (isHeavy) hitStopFrames = 2;
            sfxEnemyExplode(isHeavy, killChain);

            spawnExplosionFireball(en.x, en.y, en.color, isHeavy ? 1.45 : 0.95);
            spawnParticles(en.x, en.y, en.color, isHeavy ? 28 : 16, 1.3);
            spawnShockwave(en.x, en.y, en.color, en.radius * 3.2, isHeavy ? 4.0 : 2.6);

            if (en.type === "treasure") {
              spawnFloatingLabel(en.x, en.y - 14, "💎 补给舰击破 +" + basePts + "!", "#facc15", 17);
              drops.push(
                { x: en.x - 24, y: en.y, vx: -1, vy: -1.8, type: "weapon", magnet: true },
                { x: en.x, y: en.y, vx: 0, vy: -2.0, type: "power", magnet: true },
                { x: en.x + 24, y: en.y, vx: 1, vy: -1.8, type: "bomb", magnet: true }
              );
              for (let s = 0; s < 10; s++) {
                drops.push({ x: en.x + (Math.random() - 0.5) * 40, y: en.y + (Math.random() - 0.5) * 20, vx: 0, vy: -1.5, type: "star", magnet: true });
              }
            } else {
              if (killChain >= 3) {
                spawnFloatingLabel(en.x, en.y - 12, "🔥 " + killChain + " CHAIN +" + basePts, "#facc15", 15);
              } else {
                spawnFloatingLabel(en.x, en.y - 10, "+" + basePts, en.color, 13);
              }

              const r = Math.random();
              if (r < 0.14) {
                drops.push({ x: en.x, y: en.y, vx: 0, vy: -1.5, type: "weapon", magnet: false });
              } else if (r < 0.54) {
                drops.push({ x: en.x, y: en.y, vx: 0, vy: -1.5, type: "power", magnet: false });
              } else if (r < 0.60) {
                drops.push({ x: en.x, y: en.y, vx: 0, vy: -1.5, type: "bomb", magnet: false });
              } else if (r < 0.65) {
                drops.push({ x: en.x, y: en.y, vx: 0, vy: -1.5, type: "hp", magnet: false });
              } else {
                drops.push({ x: en.x, y: en.y, vx: 0, vy: -1.2, type: "star", magnet: true });
              }
            }
            updateHud(true);
            continue;
          }

          if (en.y < H + 40 && en.x > -60 && en.x < W + 60) nextEnemies.push(en);
        }
        enemies = nextEnemies;

        if (enemyLasers.length > 0) {
          const nextLasers = [];
          for (let i = 0; i < enemyLasers.length; i++) {
            const ls = enemyLasers[i];
            if (ls.chargeTick > 0) {
              ls.chargeTick--;
              nextLasers.push(ls);
            } else if (ls.fireTick > 0) {
              ls.fireTick--;
              const dxL = Math.cos(ls.angle);
              const dyL = Math.sin(ls.angle);
              const px = player.x - ls.x;
              const py = player.y - ls.y;
              const proj = px * dxL + py * dyL;
              if (proj > 0) {
                const perpDist = Math.abs(px * dyL - py * dxL);
                if (perpDist < 6 + player.coreRadius) {
                  onPlayerHit();
                }
              }
              if (ls.fireTick > 0) nextLasers.push(ls);
            }
          }
          enemyLasers = nextLasers;
        }

        const nextEBullets = [];
        for (let i = 0; i < enemyBullets.length; i++) {
          const b = enemyBullets[i];
          const dist = Math.hypot(b.x - player.x, b.y - player.y);

          const timeScale = (player.hyperTimer > 0 && dist < 115) ? 0.35 : 1.0;
          b.x += b.vx * timeScale;
          b.y += b.vy * timeScale;
          if (b.shape === "star") b.rot += 0.08;

          if (b.x < -24 || b.x > W + 24 || b.y < -24 || b.y > H + 24) continue;

          if (!b.grazed && dist < player.grazeRadius + b.r && dist >= player.coreRadius + b.r * 0.55) {
            b.grazed = true;
            grazeCount += 1;
            chargeHyper(4.5);
            addScore(Math.round(45 * rank));
            sfxGraze();
            spawnParticles(player.x + (b.x - player.x) * 0.5, player.y + (b.y - player.y) * 0.5, "#38bdf8", 4, 0.8);
            spawnFloatingLabel(player.x + (Math.random() - 0.5) * 24, player.y - 16, "GRAZE", "#38bdf8", 11);

            if (grazeCount % 30 === 0) {
              player.bombs = Math.min(6, player.bombs + 1);
              spawnFloatingLabel(player.x, player.y - 24, "擦弹充能 ⚡EMP +1!", "#facc15", 15);
            }
            updateHud(false);
          }

          if (dist < player.coreRadius + b.r * 0.55) {
            onPlayerHit();
            continue;
          }

          nextEBullets.push(b);
        }
        enemyBullets = nextEBullets;

        const nextDrops = [];
        const autoCollectAll = player.y < 140 || player.hyperTimer > 0;
        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          if (autoCollectAll) d.magnet = true;

          const dist = Math.hypot(d.x - player.x, d.y - player.y);
          if (dist < 145 || d.magnet) {
            const ang = Math.atan2(player.y - d.y, player.x - d.x);
            const pullSpd = d.magnet ? 9.8 : 6.4;
            d.x += Math.cos(ang) * pullSpd;
            d.y += Math.sin(ang) * pullSpd;
          } else {
            d.x += d.vx;
            d.y += d.vy;
            d.vy = Math.min(1.8, d.vy + 0.045);
          }

          if (dist < 22) {
            if (d.type === "weapon") {
              player.overclockTimer = 300;
              addWeaponExp(3.5);
              chargeHyper(15);
              sfxPowerUp();
              spawnShockwave(player.x, player.y, "#e879f9", 125, 4);
              spawnFloatingLabel(player.x, player.y - 24, "⚙️ 武器进化核心 · 火力大幅跃升！", "#e879f9", 15);
            } else if (d.type === "power") {
              addWeaponExp(1.8);
              chargeHyper(8);
              addScore(60);
            } else if (d.type === "bomb") {
              player.bombs = Math.min(6, player.bombs + 1);
              sfxPowerUp();
              spawnFloatingLabel(player.x, player.y - 20, "⚡ EMP +1", "#38bdf8", 15);
            } else if (d.type === "hp") {
              player.hp = Math.min(player.maxHp, player.hp + 1);
              sfxPowerUp();
              spawnFloatingLabel(player.x, player.y - 20, "♥ 护盾 +1", "#f43f5e", 15);
            } else {
              chargeHyper(1.2);
              addScore(Math.round(50 * rank));
            }
            updateHud(true);
            continue;
          }

          if (d.y < H + 24) nextDrops.push(d);
        }
        drops = nextDrops;
      }

      function drawFourPointStar(ctx, x, y, r, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot || 0);
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const rad = i % 2 === 0 ? r : r * 0.38;
          const a = (i * Math.PI) / 4;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function renderScene() {
        ctx.save();
        if (screenShake > 0.35) {
          const sx = (Math.random() - 0.5) * screenShake;
          const sy = (Math.random() - 0.5) * screenShake;
          ctx.translate(sx, sy);
        }

        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, "#060b19");
        bgGrad.addColorStop(0.5, "#0f172a");
        bgGrad.addColorStop(1, "#090d1c");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < bgNebulas.length; i++) {
          const nb = bgNebulas[i];
          if (!isPaused && !isGameOver) {
            nb.x += nb.vx;
            nb.y += nb.vy;
            if (nb.y - nb.r > H) nb.y = -nb.r;
            if (nb.x < 0 || nb.x > W) nb.vx *= -1;
          }
          const g = ctx.createRadialGradient(nb.x, nb.y, 10, nb.x, nb.y, nb.r);
          g.addColorStop(0, nb.color);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(nb.x, nb.y, nb.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        if (currentBoss) {
          ctx.save();
          ctx.translate(currentBoss.x, currentBoss.y);
          ctx.rotate(frameTick * 0.008);
          ctx.strokeStyle = "rgba(236, 72, 153, 0.16)";
          ctx.lineWidth = 1.5;
          const rBig = 155 + Math.sin(frameTick * 0.04) * 8;
          ctx.beginPath();
          ctx.arc(0, 0, rBig, 0, Math.PI * 2);
          ctx.stroke();

          for (let t = 0; t < 2; t++) {
            ctx.beginPath();
            for (let k = 0; k < 3; k++) {
              const a = t * (Math.PI / 3) + (k * Math.PI * 2) / 3;
              const px = Math.cos(a) * rBig;
              const py = Math.sin(a) * rBig;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
          }
          ctx.restore();
        }

        const rank = getDynamicRank();
        for (let i = 0; i < bgStars.length; i++) {
          const st = bgStars[i];
          if (!isPaused && !isGameOver) {
            st.y += st.speed * (0.85 + rank * 0.25);
            if (st.y > H) {
              st.y = 0;
              st.x = Math.random() * W;
            }
          }
          ctx.save();
          ctx.globalAlpha = st.alpha;
          ctx.strokeStyle = st.color;
          ctx.lineWidth = st.size;
          ctx.beginPath();
          ctx.moveTo(st.x, st.y);
          ctx.lineTo(st.x, st.y - st.speed * 2.8);
          ctx.stroke();
          ctx.restore();
        }

        // Additive 发光混合层
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        if (wingTrails.length > 0) {
          const nextWT = [];
          for (let i = 0; i < wingTrails.length; i++) {
            const wt = wingTrails[i];
            wt.y += 1.4;
            wt.alpha -= 0.045;
            if (wt.alpha > 0.02) {
              ctx.globalAlpha = wt.alpha;
              ctx.fillStyle = wt.color;
              ctx.beginPath();
              ctx.arc(wt.x, wt.y, 2.4, 0, Math.PI * 2);
              ctx.fill();
              nextWT.push(wt);
            }
          }
          wingTrails = nextWT;
        }

        for (let i = 0; i < singularityWells.length; i++) {
          const w = singularityWells[i];
          const ratio = w.life / w.maxLife;
          ctx.save();
          ctx.translate(w.x, w.y);
          ctx.rotate(frameTick * 0.14);
          const g = ctx.createRadialGradient(0, 0, 4, 0, 0, w.radius);
          g.addColorStop(0, "#ffffff");
          g.addColorStop(0.3, "#818cf8");
          g.addColorStop(0.7, "rgba(192, 132, 252, 0.45)");
          g.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.globalAlpha = Math.min(1, ratio * 1.5);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, w.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "#c084fc";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.arc(0, 0, w.radius * 0.78, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (let i = 0; i < plasmaFields.length; i++) {
          const pf = plasmaFields[i];
          ctx.globalAlpha = (pf.life / pf.maxLife) * 0.65;
          const g = ctx.createRadialGradient(pf.x, pf.y, 2, pf.x, pf.y, pf.radius);
          g.addColorStop(0, "#facc15");
          g.addColorStop(0.55, "rgba(249, 115, 22, 0.55)");
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(pf.x, pf.y, pf.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        if (player.laserActiveFrames > 0 && !isGameOver) {
          const lv = getWeaponTierLevel();
          const beamW = (lv === 7 ? 18 : 11) * (player.hyperTimer > 0 ? 1.35 : 1);
          ctx.globalAlpha = 0.92;
          const beamGrad = ctx.createLinearGradient(player.x - beamW, 0, player.x + beamW, 0);
          beamGrad.addColorStop(0, "rgba(244, 63, 94, 0)");
          beamGrad.addColorStop(0.25, "rgba(244, 63, 94, 0.65)");
          beamGrad.addColorStop(0.5, "#ffffff");
          beamGrad.addColorStop(0.75, "rgba(250, 204, 21, 0.65)");
          beamGrad.addColorStop(1, "rgba(244, 63, 94, 0)");
          ctx.fillStyle = beamGrad;
          ctx.fillRect(player.x - beamW, 0, beamW * 2, player.y - 16);
        }

        for (let i = 0; i < enemyLasers.length; i++) {
          const ls = enemyLasers[i];
          ctx.save();
          ctx.translate(ls.x, ls.y);
          ctx.rotate(ls.angle);
          if (ls.chargeTick > 0) {
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = ls.color;
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(1000, 0);
            ctx.stroke();
          } else {
            const w = 10 * (ls.fireTick / ls.maxFire);
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = ls.color;
            ctx.fillRect(0, -w, 1000, w * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, -w * 0.4, 1000, w * 0.8);
          }
          ctx.restore();
        }

        for (let i = 0; i < playerBullets.length; i++) {
          const pb = playerBullets[i];
          ctx.globalAlpha = 0.95;
          if ((pb.homing || pb.shape === "railgun") && pb.trail.length > 1) {
            ctx.strokeStyle = pb.color;
            ctx.lineWidth = pb.shape === "railgun" ? 5.5 : 3.5;
            ctx.lineCap = "round";
            ctx.beginPath();
            for (let t = 0; t < pb.trail.length; t++) {
              if (t === 0) ctx.moveTo(pb.trail[t].x, pb.trail[t].y);
              else ctx.lineTo(pb.trail[t].x, pb.trail[t].y);
            }
            ctx.lineTo(pb.x, pb.y);
            ctx.stroke();
          }

          ctx.fillStyle = pb.color;
          if (pb.shape === "shuriken") {
            drawFourPointStar(ctx, pb.x, pb.y, pb.r * 1.9, pb.rot);
          } else if (pb.shape === "boomerang") {
            ctx.save();
            ctx.translate(pb.x, pb.y);
            ctx.rotate(pb.rot);
            for (let b = 0; b < 4; b++) {
              ctx.rotate(Math.PI / 2);
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(pb.r * 0.6, -pb.r * 0.5, pb.r * 1.35, 0);
              ctx.quadraticCurveTo(pb.r * 0.6, pb.r * 0.25, 0, 0);
              ctx.fill();
            }
            ctx.restore();
          } else if (pb.shape === "railgun") {
            ctx.fillRect(pb.x - 3, pb.y - 16, 6, 32);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(pb.x - 1.4, pb.y - 16, 2.8, 32);
          } else if (pb.shape === "crescent") {
            ctx.save();
            ctx.translate(pb.x, pb.y);
            ctx.rotate(Math.atan2(pb.vy, pb.vx) + Math.PI / 2);
            ctx.beginPath();
            ctx.arc(0, 0, pb.r * 1.5, Math.PI, 0, false);
            ctx.quadraticCurveTo(0, -pb.r * 0.5, -pb.r * 1.5, 0);
            ctx.fill();
            ctx.restore();
          } else {
            ctx.beginPath();
            ctx.arc(pb.x, pb.y, pb.r * 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(pb.x, pb.y, pb.r * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        if (slashArcs.length > 0) {
          const nextSA = [];
          for (let i = 0; i < slashArcs.length; i++) {
            const sa = slashArcs[i];
            sa.alpha -= 0.08;
            sa.radius += 1.6;
            if (sa.alpha > 0.02) {
              ctx.save();
              ctx.globalAlpha = sa.alpha;
              ctx.translate(sa.x, sa.y);
              ctx.rotate(sa.angle);
              ctx.strokeStyle = sa.color;
              ctx.lineWidth = 3.5;
              ctx.beginPath();
              ctx.arc(0, 0, sa.radius, -0.9, 0.9);
              ctx.stroke();
              ctx.restore();
              nextSA.push(sa);
            }
          }
          slashArcs = nextSA;
        }

        if (lightningArcs.length > 0) {
          const nextLA = [];
          for (let i = 0; i < lightningArcs.length; i++) {
            const la = lightningArcs[i];
            la.alpha -= 0.11;
            if (la.alpha > 0.02) {
              ctx.save();
              ctx.globalAlpha = la.alpha;
              ctx.strokeStyle = la.color;
              ctx.lineWidth = 2.4;
              ctx.beginPath();
              ctx.moveTo(la.x1, la.y1);
              const steps = 5;
              for (let s = 1; s < steps; s++) {
                const t = s / steps;
                const mx = la.x1 + (la.x2 - la.x1) * t + (Math.random() - 0.5) * 22;
                const my = la.y1 + (la.y2 - la.y1) * t + (Math.random() - 0.5) * 22;
                ctx.lineTo(mx, my);
              }
              ctx.lineTo(la.x2, la.y2);
              ctx.stroke();
              ctx.restore();
              nextLA.push(la);
            }
          }
          lightningArcs = nextLA;
        }

        if (fireballs.length > 0) {
          const nextFB = [];
          for (let i = 0; i < fireballs.length; i++) {
            const fb = fireballs[i];
            fb.radius += (fb.maxRadius - fb.radius) * 0.24;
            fb.alpha -= 0.052;
            if (fb.alpha > 0.02) {
              ctx.globalAlpha = fb.alpha;
              const g = ctx.createRadialGradient(fb.x, fb.y, 1, fb.x, fb.y, fb.radius);
              g.addColorStop(0, "#ffffff");
              g.addColorStop(0.4, "#facc15");
              g.addColorStop(0.75, fb.color);
              g.addColorStop(1, "rgba(0,0,0,0)");
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(fb.x, fb.y, fb.radius, 0, Math.PI * 2);
              ctx.fill();
              nextFB.push(fb);
            }
          }
          fireballs = nextFB;
        }

        if (shockwaves.length > 0) {
          const nextW = [];
          for (let i = 0; i < shockwaves.length; i++) {
            const sw = shockwaves[i];
            sw.radius += (sw.maxRadius - sw.radius) * 0.18;
            sw.alpha -= 0.035;
            if (sw.alpha > 0.02) {
              ctx.globalAlpha = sw.alpha;
              ctx.strokeStyle = sw.color;
              ctx.lineWidth = sw.lineWidth;
              ctx.beginPath();
              ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
              ctx.stroke();
              nextW.push(sw);
            }
          }
          shockwaves = nextW;
        }

        if (particles.length > 0) {
          const nextP = [];
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha > 0.02) {
              ctx.globalAlpha = p.alpha;
              ctx.fillStyle = p.color;
              if (p.star) {
                drawFourPointStar(ctx, p.x, p.y, p.size * 1.6, frameTick * 0.1);
              } else {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
              }
              nextP.push(p);
            }
          }
          particles = nextP;
        }

        ctx.restore();

        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          ctx.save();
          ctx.translate(d.x, d.y);
          if (d.type === "star") {
            ctx.fillStyle = "#facc15";
            drawFourPointStar(ctx, 0, 0, 5.5, frameTick * 0.08);
          } else {
            const color = d.type === "weapon" ? "#a855f7" : (d.type === "power" ? "#10b981" : (d.type === "bomb" ? "#0ea5e9" : "#f43f5e"));
            const label = d.type === "weapon" ? "W" : (d.type === "power" ? "P" : (d.type === "bomb" ? "B" : "♥"));
            ctx.fillStyle = color;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(-9, -9, 18, 18, 5) : ctx.rect(-9, -9, 18, 18);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#ffffff";
            ctx.font = "800 11px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, 0, 0.5);
          }
          ctx.restore();
        }

        for (let i = 0; i < enemies.length; i++) {
          const en = enemies[i];
          ctx.save();
          ctx.translate(en.x, en.y);
          ctx.fillStyle = en.hitFlash > 0 ? "#ffffff" : en.color;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.6;

          if (en.type === "spinner" || en.type === "warper") {
            ctx.rotate(en.tick * 0.05);
            ctx.beginPath();
            for (let k = 0; k < 6; k++) {
              const a = (Math.PI * 2 * k) / 6;
              const px = Math.cos(a) * en.radius;
              const py = Math.sin(a) * en.radius;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.moveTo(0, en.radius);
            ctx.lineTo(-en.radius, -en.radius * 0.8);
            ctx.lineTo(0, -en.radius * 0.35);
            ctx.lineTo(en.radius, -en.radius * 0.8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          if (en.hp < en.maxHp) {
            const bw = en.radius * 1.8;
            ctx.fillStyle = "rgba(15, 23, 42, 0.7)";
            ctx.fillRect(-bw / 2, -en.radius - 7, bw, 3.5);
            ctx.fillStyle = "#34d399";
            ctx.fillRect(-bw / 2, -en.radius - 7, bw * Math.max(0, en.hp / en.maxHp), 3.5);
          }
          ctx.restore();
        }

        if (currentBoss) {
          const b = currentBoss;
          ctx.save();
          ctx.translate(b.x, b.y);

          ctx.strokeStyle = b.subColor;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(0, 0, 38 + Math.sin(b.tick * 0.08) * 3, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = b.hitFlash > 0 ? "#ffffff" : b.themeColor;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          // 不同 Boss 展现不同装甲翼廓
          if (b.bossIndex % 3 === 1) {
            for (let k = 0; k < 6; k++) {
              const a = (Math.PI * 2 * k) / 6;
              const px = Math.cos(a) * 30;
              const py = Math.sin(a) * 26;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
          } else if (b.bossIndex % 3 === 2) {
            ctx.moveTo(0, 28);
            ctx.lineTo(-38, -6);
            ctx.lineTo(-18, -26);
            ctx.lineTo(0, -14);
            ctx.lineTo(18, -26);
            ctx.lineTo(38, -6);
          } else {
            ctx.moveTo(0, 26);
            ctx.lineTo(-34, -10);
            ctx.lineTo(-14, -24);
            ctx.lineTo(14, -24);
            ctx.lineTo(34, -10);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          const barW = W - 100;
          const barX = 50;
          const barY = 14;
          const ratio = Math.max(0, b.hp / b.maxHp);
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
          ctx.fillRect(barX, barY, barW, 9);
          const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
          hpGrad.addColorStop(0, b.subColor);
          hpGrad.addColorStop(0.5, "#a855f7");
          hpGrad.addColorStop(1, b.themeColor);
          ctx.fillStyle = hpGrad;
          ctx.fillRect(barX, barY, barW * ratio, 9);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.82)";
          ctx.lineWidth = 1.2;
          ctx.strokeRect(barX, barY, barW, 9);

          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 11.5px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "left";
          ctx.fillText("BOSS #" + b.tier + " " + b.name + " · " + b.spellNames[b.phase], barX, barY + 22);
          ctx.restore();
        } else {
          // 非 Boss 敌机编队巡航期：右上角显示距离下一个 Boss 降临的秒数
          const nextBossSpec = BOSS_CATALOG[(stageWave - 1) % BOSS_CATALOG.length];
          const remSec = Math.ceil(sortieFramesRemaining / 60);
          ctx.save();
          ctx.fillStyle = "rgba(226, 232, 240, 0.84)";
          ctx.font = "700 11px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "right";
          ctx.fillText("第 " + stageWave + " 关敌机巡航阶段 · 距 [" + nextBossSpec.name.split(" · ")[1] + "] 降临: " + remSec + "s", W - 16, 22);
          ctx.restore();
        }
